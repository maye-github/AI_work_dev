notes_on_gaps: >
  上の調査（2026-10-15、実在資産の横断読取）で「実在資産のどこにも答えが無い」と確認できた事項。
  これらは**本物の缺口**であり、要求書に書かなくて正しい（顧客に聞くべき事項）。
  - 遷移 URL の**受け手と用途**（他システムが使うのか、人が手で使うのか）
  - **画面単位の利用権限**という考え方（現行は全社共通リスト）
  - **セッション管理全般**（ログアウト・有効期限・履歴・連続失敗ロック・同時利用制限の要否）
  - **権限区分の選択基準**（誰が何を基準に選ぶか。初期値だけが規定されている）
  - **起動区分 1/2/3 の業務効果**（設計と実装が食い違い、どちらが正か未裁定）

