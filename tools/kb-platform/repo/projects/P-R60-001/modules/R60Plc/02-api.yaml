open_points:
  - "表示（search_btn='1'）が REG_STS=1 で絞らない。設計の『確定のみ表示』と実装が食い違う。"
  - "download のファイル名取得が設計（情報ID 000000099 指定）と実装（共通ユーティリティ）で異なる。"
  - "delete の完了メッセージが設計 R60I0002、実装表示 R60I0001。"
