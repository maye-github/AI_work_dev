    - { no: 15, name: 更新時刻,                   column_id: KSN_DAT,         length: null, insert: true, update: true,  delete: true,  screen_item: 共通仕様参照, edit_spec: "-" }
    - { no: 16, name: 更新プログラムＩＤ,         column_id: KSN_PGM_ID,      length: 20, insert: true,  update: true,  delete: true,  screen_item: 共通仕様参照, edit_spec: "-" }
    - { no: 17, name: リビジョン,                 column_id: REV_NO,          length: 5,  insert: true,  update: true,  delete: true,  screen_item: 共通仕様参照, edit_spec: "-" }

key_fields:
  primary_key: [MAKER_CD]
  logical_delete: DEL_FLG
  exclusive_control: [KSN_DAT, REV_NO]
  registration_status: REG_STS
  emergency_distribution: SEND_STS
  note: >-
    被参照される側のマスタである。削除・（修正で削除選択）時に
    購入品目別仕入先マスタと原材料仕入単価マスタから参照チェックを受ける（03-logic.yaml MK-LOGIC-10/11）。

