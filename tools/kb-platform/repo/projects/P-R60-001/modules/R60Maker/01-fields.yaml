search_result_columns:
  note: >-
    一覧のデータ列はコード・日本語名・カナ名・削除の 4 列（No24-27）。
    No23『送信』は 4 列の直前に置かれた送信ステータス表示で、列か行ラベルかは
    抽出範囲では確定できない（画面レイアウトシートは未抽出）。
  columns:
    - { no: 23, name: "送信",               source: "メーカーマスタ.SEND_STS", lookup: "コード値明細マスタ(送信ステータス) 情報ID='000000057', KEYID=SEND_STS", status: "位置づけ未確定" }
    - { no: 24, name: "メーカー情報：コード", source: "メーカーマスタ.MAKER_CD", lookup: "単純移送", sortable: true }
    - { no: 25, name: "メーカー情報：日本語名", source: "メーカーマスタ.MAKER_NM", lookup: "単純移送", sortable: true }
    - { no: 26, name: "メーカー情報：カナ名", source: "メーカーマスタ.MAKER_ANM", lookup: "単純移送" }
    - { no: 27, name: "削除",               source: "メーカーマスタ.DEL_FLG", lookup: "コード値明細マスタ(論理削除) 情報ID='000000063', KEYID=DEL_FLG" }

master_items:
  - { no: 2, name: 操作モード,       control: ラベル,           mode: "新規/複製/修正の別を表示" }
  - { no: 4, name: メーカーコード,   control: "新規・複製＝テキストボックス / 修正＝ラベル", length: 5,  required: "新規・複製のみ必須" }
  - { no: 5, name: メーカー日本語名, control: テキストボックス, length: 30, required: "緊急配信または削除選択時に必須" }
  - { no: 6, name: メーカーカナ名,   control: テキストボックス, length: 15, required: "緊急配信または削除選択時に必須" }
  - { no: 7, name: 緊急配信,         control: チェックボックス, source: "SEND_STS='9' でチェックオン" }
  - { no: 8, name: 削除,             control: "新規・複製＝ラベル / 修正＝チェックボックス", source: "DEL_FLG='1' でチェックオン" }

