search_conditions:
  - { no: 8,  name: メーカーコード,     input: テキストボックス, length: 5,  match: 前方一致, note: "ワイルドカード入力不要" }
  - { no: 9,  name: メーカー日本語名,   input: テキストボックス, length: 30, match: 中間一致, note: "×ボタンで入力内容削除" }
