viewpoint_mapping:
  note: >-
    旧単体テスト仕様は「正常/境界/異常」の分類を持たない。
    骨架の 正常3/境界2/異常3 へ写像するときは、下記の読み替えを使う。
  equivalence_partition:
    - "単項目チェックの各項目：有効値・無効値（半角英数字外、禁止文字、全半角混在）・空値"
    - "権限マトリクス（特殊機能 6 + 10 パターン）：権限区分 × 自工場/他工場更新権限"
    - "操作モード（新規／複製／修正）× 緊急配信 ON/OFF × 削除選択 ON/OFF"
  boundary_value:
    - "メーカーコード 5 文字（5 OK / 6 NG、半角英数字）"
    - "メーカー日本語名 30Byte（30Byte OK / 31Byte NG）"
    - "メーカーカナ名 15 文字（15 OK / 16 NG）"
    - "検索上限件数（上限ちょうど OK / 上限+1 NG）"
    - "ページ最終頁・先頭頁（1 起算）"
  decision_table:
    - "登録：新規／複製／修正 × 削除選択 × 緊急配信（8 パターン、イベント処理 No12 の 8 件に対応）"
    - "削除：削除のみ／他項目変更有 × 緊急配信（4 パターン、イベント処理 No11 の 4 件に対応）"
    - "権限：検索条件・結果画面 6 パターン / マスタ画面 10 パターン"

key_test_cards:
  - area: 画面遷移
    test_items: 4
    checks:
      - "検索条件画面から検索結果画面へ遷移する。"
      - "検索結果からマスタ画面（新規／複製／修正）へ遷移する。"
      - "マスタ画面から検索結果画面へ戻る。"
    viewpoint: 同値分割
  - area: 入力チェック（表示・仕掛表示）
    test_items: 10
    checks:
      - "メーカーコードの半角英数字・5 文字チェック（R60W0103）。"
      - "メーカー日本語名の 30Byte・禁止文字チェック（R60W0131）。"
    viewpoint: 同値分割 + 境界値
  - area: 入力チェック（削除）
    test_items: 11
    checks:
      - "日本語名・カナ名の必須チェック（R60W0015）。"
      - "緊急配信 ON 時の必須チェック（R60W0012）。"
      - "日本語名・カナ名の形式チェック（R60W0131 / R60W0113）。"
      - "削除確認（R60A0004）。"
    viewpoint: 同値分割 + デシジョンテーブル
  - area: 入力チェック（登録）・必須チェック
    test_items: 32
    checks:
      - "新規・複製のメーカーコード必須（R60W0009）と形式（R60W0103）。"
      - "緊急配信 ON 時の必須（R60W0012）、削除選択時の必須（R60W0015）。"
      - "登録確認（R60A0003）、変更なし（R60W0016）。"
    viewpoint: 同値分割 + 境界値 + デシジョンテーブル
  - area: イベント処理（検索）
    test_items: 19
    checks:
      - "表示／仕掛表示の検索条件が一覧に反映される。"
      - "仕掛表示では REG_STS='0' が追加される。"
      - "0 件時（R60W0010）と上限超過時（R60W0005）の挙動。"
    viewpoint: 同値分割 + 境界値
  - area: イベント処理（削除／登録）
    test_items: 12
    checks:
      - "削除後に DEL_FLG='1' になり、緊急配信 ON ならパッケージが呼ばれる。"
      - "新規・複製は INSERT、修正は UPDATE になる。"
      - "被参照（R60W0024 / R60E0025）、排他（R60W0006）、重複（R60W0014）が正しく返る。"
    viewpoint: デシジョンテーブル
  - area: 特殊処理
    test_items: 23
    checks:
      - "権限区分・自工場/他工場更新権限によるボタン活性。"
      - "例外処理（セッション・オンライン・システム）。"
      - "固有処理 4 件（内容は未抽出）。"
    viewpoint: デシジョンテーブル

