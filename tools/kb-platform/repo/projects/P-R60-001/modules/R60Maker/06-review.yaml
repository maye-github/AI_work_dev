deviations:
  - id: D-MK-01
    title: 画面項目数が骨架の I-ID 枠（56）と一致しない
    type: design_vs_skeleton
    evidence:
      - "画面項目内容(検索)：項目番号 33 件（r15-r51）"
      - "画面項目内容(マスタ項目)：項目番号 9 件（r16-r27）"
      - "骨架の I-201..I-256 は 56 件"
    impact: "I-ID を 1 対 1 で対応付けると、検索 33 件・マスタ 9 件のどちらとも合わない。"
    cause: "56 は骨架構築時に置いた仮の枠であり、設計書から導いた数ではない。"
    action: "R60Maker では I-ID を画面項目数として使わない。I-ID を起こす場合は、設計書の項目番号を source_locator に持つ。"
    machine_detectable: false
    layer: knowledge

  - id: D-MK-02
    title: ダウンロード処理が検索条件を SQL 文字列へ直接連結している
    type: security
    evidence:
      - "R60MakerController.py:817-883 の download は maker_cd / maker_nm を WHERE 句へ文字列連結する。"
      - "同じファイルの search（670-816）は bind パラメータを使っている。"
    impact: "入力値によっては SQL インジェクションが成立し得る。search と download で安全度が異なる。"
    cause: "共通 CSV ユーティリティが WHERE 文字列を受け取る設計であり、呼び出し側が値を連結している。"
    action: "実装課題として記録する。download も bind パラメータ化する。設計（D/L）を変える場合は CR を起票する。"
    machine_detectable: true
    detection_hint: "WHERE 句の組み立てで f-string / + を使っている箇所を grep する。"
    layer: gate

  - id: D-MK-03
    title: 削除・登録のレスポンスに完了メッセージが含まれない
    type: design_vs_implementation
    evidence:
      - "設計は削除完了時に R60I0002、登録完了時に R60I0001 を表示する（BP r318-r319 / r399-r400）。"
      - "実装の delete は {\"error_code\":\"0\",\"error_id\":\"\"} のみ、edit も同様で msg を返さない（R60MakerController.py:1090-1097 / 1295-1300）。"
      - "フロント側が messageInfo から R60I0002 / R60I0001 を引いて表示する（R60MakerEdit.vue:292 / 354）。"
    impact: "機能上の欠落はないが、API 契約としては設計のメッセージが応答に現れない。"
    cause: "メッセージ表示をフロントの責務に寄せた実装判断。"
    action: "API 契約カード（02-api.yaml）に『実装では未設定、フロントが表示』と明記する。"
    machine_detectable: true
    detection_hint: "設計のメッセージ ID と API レスポンス項目を突合する。"
    layer: knowledge

  - id: D-MK-04
    title: BaseCamelModel の extra が 'ignore'（骨架規則は 'forbid'）
    type: design_vs_skeleton
    evidence:
      - "R60MakerController.py:34-40 は extra=\"ignore\"。"
      - "03-design-coding.md §2 は extra='forbid' を固定としている。"
    impact: "定義外の入力が 422 にならず、静かに無視される。項目追加・改定の検知が弱い。"
    cause: "既存案件の実装が骨架規則より先に存在し、骨架規則が実装に合わせられていない。"
    action: "R60Maker の知識カードには実装値を記録する。骨架規則を変えるかは人（ユーザー）の裁定事項であり、本カードでは変更しない。"
    machine_detectable: true
    detection_hint: "grep 'extra=' で 'ignore' と 'forbid' の混在を検出できる。"
    layer: rules

  - id: D-MK-05
    title: REG_STS の判定基準が設計書に無く、実装だけが規則を持つ
    type: design_gap
    evidence:
      - "項目移送表(DB) r19 は登録ステータス（REG_STS）の画面項目を『共通仕様参照』とだけ書く。"
      - "R60MakerController.py:1311-1320 の set_reg_sts は『コード・日本語名・カナ名の 3 つが非空なら 1』と判定する。"
    impact: "設計書だけを読むと REG_STS を再現できない。仕掛表示（REG_STS='0'）の対象範囲も決まらない。"
    cause: "共通仕様が別文書にあり、本設計書へ転記されていない。"
    action: "実装値を記録しつつ、共通仕様の所在を確認するまで『確定規則ではない』と扱う。"
    machine_detectable: false
    layer: knowledge

  - id: D-MK-06
    title: 複製モードの初期化が元レコードの DEL_FLG / SEND_KBN を返す
    type: design_vs_implementation
    evidence:
      - "設計は複製時に『緊急配信はチェックオフ、削除は無』とする（BP r159-r160）。"
      - "実装の initEdit（mode='2'）は元レコードの DEL_FLG と SEND_KBN をそのまま返す（R60MakerController.py:884-978）。"
      - "ただし edit（mode='2'）の INSERT は DEL_FLG='0'、SEND_KBN='0' を固定設定する。"
    impact: "複製画面に元データの削除状態・送信区分が一瞬見える可能性がある。登録結果は設計どおり新規扱い。"
    cause: "初期化レスポンスと INSERT で別々の値を組み立てている。"
    action: "画面表示の実害を確認する。API 契約には『複製時の初期化は元値を含む』と注記する。"
    machine_detectable: true
    detection_hint: "initEdit の mode='2' 分岐が返す項目と、設計の『チェックオフ／削除は無』を比較する。"
    layer: knowledge

  - id: D-MK-07
    title: 『廃止_画面項目内容(入力)』シートが設計書に残っている
    type: design_hygiene
    evidence:
      - "設計書に『廃止_画面項目内容(入力)』シートがある（項目番号 19 件）。"
      - "現行の入力画面仕様は『画面項目内容(マスタ項目)』（9 件）。"
    impact: "どちらを読むかで項目数・必須条件が変わる。RAG が両方を拾うと誤答する。"
    cause: "シート廃止時に削除せず、名前に『廃止_』を付けて残した。"
    action: "RAG の chunk では廃止シートを corpus_scope='holdout' または除外にし、search 対象にしない。"
    machine_detectable: true
    detection_hint: "シート名の接頭辞『廃止_』を検出する。"
    layer: knowledge

  - id: D-MK-08
    title: 削除時の緊急配信対象が『画面初期表示時』と現在値のどちらか一意でない
    type: design_clarity
    evidence:
      - "BP r312『画面初期表示時に緊急配信が選択されていた場合、緊急配信を起動する』。"
      - "BP r316 は削除時の送信ステータスを『更新前が 9 なら維持、それ以外は 0』とする。"
      - "実装はリクエストの send_sts を判定に使う（R60MakerController.py:1085-1093）。"
    impact: "画面表示後にチェックを変えた場合、設計の逐語と実装で対象が変わり得る。"
    cause: "『初期表示時』という表現が、画面状態を指すのか DB 値を指すのか曖昧。"
    action: "設計へ確認事項として返す。実装値は send_sts による判定として記録する。"
    machine_detectable: false
    layer: knowledge

  - id: D-MK-09
    title: 概要シートの前提条件・排他条件が『あり』だけで本文が無い
    type: design_gap
    evidence:
      - "01_概要 r27-r28：前提条件は『なし／あり』の選択だけ。"
      - "01_概要 r31-r33：排他条件は『なし／あり』の選択と『画面項目間・DB整合チェックシート参照』のみ。"
    impact: "前提条件の本文が無いため、セッション・オンライン制御以外の前提を設計から復元できない。"
    cause: "標準様式の欄を埋めたが、本文の転記がされていない。"
    action: "排他条件は 11_画面項目間・DB整合チェック r18（KSN_DAT 比較）を正とする。前提条件は BP r13-r20 を正とする。"
    machine_detectable: false
    layer: knowledge

  - id: D-MK-10
    title: R60MakerCreate.vue / R60MakerCopy.vue が画面から参照されていない
    type: implementation_structure
    evidence:
      - "R60Maker.vue:172 は R60MakerEdit.vue だけを import する。"
      - "R60MakerCreate.vue の入力項目に v-model が無く、メッセージ ID も持たない。"
      - "R60MakerCopy.vue は edit_data.key_001..003 を参照し、削除チェックはコメントアウトされている。"
      - "3 モード分のチェックとダイアログは R60MakerEdit.vue に集約されている。"
    impact: "Create/Copy を『現行実装』として読むと、存在しない画面構成を学習する。"
    cause: "モード統合時に旧コンポーネントを残した可能性が高い（未確認）。"
    action: "RAG では Create/Copy を holdout または低重みにし、Edit.vue を現行の真源とする。削除の可否は人が判断する。"
    machine_detectable: true
    detection_hint: "view の import 一覧と components ディレクトリを突合する。"
    layer: knowledge

  - id: D-MK-11
    title: A/B レポートの全端点 404 は『実装欠落』ではない
    type: measurement
    evidence:
      - "app/main.py:48,132 で R60MakerController を import し include_router している。"
      - "R60MakerController.py:23 は prefix='/R60Maker'、端点パスは /init・/search・/download・initEdit・/delete・/edit。"
      - "A/B レポートは 8 端点すべて 404。"
    impact: "404 を実装欠落と読むと、実在する実装を『無い』と誤判定する。"
    cause: "測定環境でルータが公開されていなかった（未測定）。"
    action: "impl_alignment は null（未測定）とする。AB を再実測するまで実装一致を語らない。"
    machine_detectable: true
    detection_hint: "404 のときは main.py の include_router と router prefix を必ず確認する。"
    layer: knowledge

  - id: D-MK-12
    title: モード値 '1'/'2'/'3' が設計書に書かれていない
    type: design_vs_implementation
    evidence:
      - "設計は『新規／複製／修正』という名称でしか書かない。"
      - "実装は mode='1'（新規）、'2'（複製）、'3'（修正）で分岐する（R60MakerController.py:884 以降）。"
    impact: "設計から API を起こすとき、mode の値域を設計だけでは決められない。"
    cause: "実装時の内部規約が設計へ反映されていない。"
    action: "02-api.yaml に変換表として記録する。設計へ反映するかは人（ユーザー）の裁定事項。"
    machine_detectable: true
    detection_hint: "mode の比較値と設計のモード名称を突合する。"
    layer: knowledge

  - id: D-MK-13
    title: 標準仕様参照のイベント（No4/No9/No10/No13）に本文が無い
    type: design_gap
    evidence:
      - "13_イベント一覧 r17：No4『検索条件部を縮小/拡大表示する』のみ。"
      - "13_イベント一覧 r22-r23, r27：No9/No10/No13 は『標準仕様参照』。"
      - "BP も No4 は『共通処理参照』、No9/No10/No13 は標準仕様の記述に留まる。"
    impact: "戻る・業務終了・条件部トグルの詳細（確認メッセージの有無、遷移先）を本設計書から復元できない。"
    cause: "共通仕様が別文書にあり、本設計書へ転記されていない。"
    action: "RAG ではこれらを『標準仕様』として弱い根拠に留め、共通仕様の所在を確認するまで断定しない。"
    machine_detectable: false
    layer: knowledge

