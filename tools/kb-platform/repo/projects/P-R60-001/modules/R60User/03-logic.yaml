---
id: KNOW-LEGACY-R60-MODULE-R60USER-LOGIC
type: knowledge
req_ids: []
status: open
sensitivity: internal
owner: AI-SE
version: 0.1.0

module: R60User
artifact_type: logic-catalog

source:
  design_process: reports/module-survey/R60User/design/13_業務処理説明.txt
  design_events: reports/module-survey/R60User/design/12_イベント一覧.txt
  design_single_check: reports/module-survey/R60User/design/09_画面単項目チェック.txt
  design_cross_check: reports/module-survey/R60User/design/10_画面項目間・DB整合チェック.txt
  design_messages: reports/module-survey/R60User/design/11_その他メッセージ.txt
  frontend_view: Front-end/src/views/R60User.vue
  frontend_edit: Front-end/src/components/R60UserEdit.vue
  backend_controller: api/fastapi_oracle_pjt/app/routers/R60UserController.py
  frontend_store: Front-end/src/stores/index.ts

constants:
  REG_STS_ON: "1"
  REG_STS_OFF: "0"
  SEND_STS_EMG: "9"
  KSN_KBN_ONLINE: "1"
  DEL_FLG_OFF: "0"
  SOURCE: "R60Const / r60const.py"

logics:
  - id: L-US-01
    name: 初期表示
    design_locator: "BP r23-r52（イベント No2）"
    handler: "R60UserController.py:727-855 / R60User.vue:186-233"
    rules:
      - "メッセージを 15 ID 分まとめて取得する。"
      - "会社ドロップダウンは情報 ID 000000104、DEL_FLG=0、表示順・KEY_ID 昇順。"
      - "1 頁件数は情報 ID 000000064。既定は個別項目名 10='D' の行。"
      - "セッション無効ならセッションエラー画面、オンライン不可ならオンライン制御エラー画面へ。"
    deviation: >-
      実装の会社初期値は userInfo.scmp_cd（S 会社）。設計はログインユーザーの所属会社で、
      ストアの cmp_cd が所属会社にあたる（D-US-02）。

  - id: L-US-02
    name: 検索条件の組み立て
    design_locator: "BP r99-r108（イベント No5）"
    handler: "R60UserController.py:920-945"
    rules:
      - "会社は完全一致（SZK_CMP_CD = :SZK_CMP_CD）。"
      - "社員コード・組織ユニット・発令日は前方一致（LIKE '値%'）。"
      - "未入力の条件は WHERE に加えない。"
      - "COUNT(*) と一覧取得で同じ WHERE を使う。"
    deviation: >-
      LIKE の値に含まれる % と _ をエスケープしない。ワイルドカード入力で検索範囲が広がる（D-US-13）。

  - id: L-US-03
    name: 件数取得と上限判定
    design_locator: "BP r102-r114"
    handler: "R60UserController.py:937-958"
    rules:
      - "件数 0 → R60W0010、data=[]。"
      - "上限超過 → R60W0005、data=[]、max_count を返す。"
      - "上限値は情報 ID 000000024 から取得する。"
      - "0 件・上限超過のとき、画面は一覧部を非表示にする。"
    note: >-
      設計の文言は上限値を 3000/3001 と直書きするが、実装は実値を差し込む（D-US-10）。
      実装の方が設計より正しい（上限は情報 ID で変わる）。

  - id: L-US-04
    name: 一覧ソート
    design_locator: "BP r128-r135"
    handler: "R60UserController.py:971-990"
    allowed_fields: [SZK_CMP_CD, STF_CD, SSK_UNIT, S_CMP_CD, S_JIG_CD]
    rules:
      - "既定は ORDER BY DEL_FLG, SZK_CMP_CD, STF_CD, ROWID。"
      - "指定時は ORDER BY DEL_FLG, {許可列} {ASC|DESC}, ROWID。"
      - "白名单外は既定ソートへフォールバックする。"
      - "画面のソート可能列は 5 列（会社・社員コード・組織ユニット・経理用会社・経理用事業場）。"
    note: >-
      画面のフィールド名は camelCase で届くため、画面側で snake_case へ変換してから送る
      （R60User.vue:713-719）。

  - id: L-US-05
    name: ページング
    design_locator: "BP r139"
    handler: "R60UserController.py:960-990"
    rules:
      - "all_page = ceil(count / page_limit)。current_page を 1〜all_page に丸める。"
      - "offset = (current_page - 1) * page_limit。"
      - "OFFSET :offset ROWS FETCH FIRST :page_limit ROWS ONLY。"
    deviation: >-
      骨架の規則 00 §5 は Oracle 一覧のページングに ROWID 方式を推奨する。
      本実装は OFFSET/FETCH（D-US-14）。R60 既存実装の事実として記録する。

  - id: L-US-06
    name: 組織ユニット名称の取得
    design_locator: "BP r68-r89（イベント No4）"
    handler: "R60UserController.py:858-894 / R60User.vue:677-701"
    rules:
      - "入力支援画面 SSK_UNIT を、検索条件＝画面.会社で開く。"
      - "戻り値を組織ユニットに設定する。"
      - "部署マスタから正式名称を取得し、名称欄に設定する（右スペース除去）。"
    deviation: >-
      実装は R60_SSK_M_TBL.SEI_NM を返す。設計の『部署マスタ.正式名称』との対応は【推測】。
      検索シートのエンティティ記載自体が誤っている（D-US-03）。

  - id: L-US-07
    name: マスタ項目モーダル初期化
    design_locator: "BP r146-r226（イベント No11）"
    handler: "R60UserController.py:1049-1337 / R60UserEdit.vue:375-479"
    rules:
      - "STF_CD でユーザマスタを読み、更新区分・更新時刻・リビジョン・送信ステータス・各コードを返す。"
      - "S 会社／S 事業場のいずれかが空白なら、所属会社＋組織ユニットで部署マスタを引き、S 会社／S 事業場を補完する。"
      - "経理用会社・経理用事業場・役割・帳票共有グループ・帳票参照・帳票権限・ユーザタイプの 7 リストを返す。"
      - "経理用事業場は S 会社／S 事業場の状態で絞り込む。"
      - "全リストの先頭に空白行を置く。"
    open_point: "対象行が無い場合、initData を空で返す（エラーにしない）。"

  - id: L-US-08
    name: 経理用事業場ドロップダウンの再生成
    design_locator: "BP r188-r208 / r271-r289（イベント No11(7) / No13）"
    handler: "R60UserEdit.vue:482-553"
    rules:
      - "複合値は『会社コード,JIG_CD』。会社で絞る場合は split(',')[0]、事業場で絞る場合は split(',')[1] を使う。"
      - "経理用会社が空白のとき：S 事業場があれば S 事業場に一致する 1 件＋空白行。"
      - "経理用会社が空白で S 事業場も空白なら、空白行のみ。"
      - "経理用会社が選択済みなら、その会社の事業場＋空白行。"
      - "経理用会社を変更したら、経理用事業場をクリアする。"
    deviation: >-
      設計は複合キーを画面の値として定義するが、保存時に 2 番目だけを S_JIG_CD に入れる規則を
      明記していない。実装はサーバー側で分割する（D-US-04）。

  - id: L-US-09
    name: 自工・他工判別
    design_locator: "BP r228-r242"
    handler: "R60UserEdit.vue:844-869"
    rules:
      - "ログインユーザーの所属会社／事業場が、経理用会社／事業場と一致 → 自工。"
      - "または S 会社／S 事業場と一致 → 自工。"
      - "上記以外 → 他工。"
      - "S 会社／S 事業場のいずれかが空白 → 他工。"
    deviation: >-
      実装は『経理用が入力されていれば経理用と比較、無ければ S と比較』に単純化している。
      両方が入力されていて異なる場合、設計の OR 条件と結果が変わりうる（D-US-05）。

  - id: L-US-10
    name: 登録ボタンの活性制御
    design_locator: "BP r244-r267 / r820-r869"
    handler: "R60UserEdit.vue:821-869 / stores/index.ts:83-85"
    rules:
      - "権限区分が 'Y' 以外 → 登録は非活性（ストア既定値 true）。"
      - "自工更新フラグ='0' かつ 他工更新フラグ='0' → 非活性。"
      - "両方='1' → 活性。"
      - "それ以外 → 自工なら活性、他工なら非活性。"
    deviation: >-
      活性判定はモーダル初期化時に 1 回だけ行い、経理用会社／事業場を変更しても再判定しない（D-US-12）。
      registBtnEnabled / deleteBtnEnabled は true が『非活性』を意味する（R60Plc D-PL-15 と同じ反転命名）。

  - id: L-US-11
    name: 単項目チェック
    design_locator: "09_画面単項目チェック（13 件）"
    checks:
      - { code: R60W0106, target: 組織ユニット, rule: 半角数字 8 文字 }
      - { code: R60W0103, target: 社員コード, rule: 半角英数 8 文字以内 }
      - { code: R60W0108, target: 発令日, rule: 半角数字 8 文字以内 }
      - { code: R60W0016, target: 全項目, rule: 変更なしなら登録しない }
      - { code: R60W0103, target: メールアドレス２, rule: 半角英数 50 文字以内 }
      - { code: R60W2001, target: メールアドレス２, rule: 入力ありなら '@' を含む }
      - { code: R60W0012, target: "役割・帳票共有グループ・帳票参照・帳票権限・ユーザタイプ", rule: 緊急配信オン時は必須 }
      - { code: R60W0007, target: 全項目, rule: 戻る時の破棄確認 }
    behavior:
      - "エラー時は背景色を赤にし、対象にフォーカスを移す。"
      - "実行順は 変更なし → 緊急配信必須 → メール 2（桁 → @）→ 項目間。"
    note: "09 シートの 13 件は、項目ごとに 1 行のため、上表はメッセージ単位にまとめている。"

  - id: L-US-12
    name: 項目間・DB 整合チェック
    design_locator: "10_画面項目間・DB整合チェック（4 件）"
    checks:
      - { code: R60W0010, rule: 検索 0 件 }
      - { code: R60W0005, rule: 検索上限超過 }
      - { code: R60W2002, rule: 経理用会社と経理用事業場はセット（片方のみ不可） }
      - { code: R60W0006, rule: 排他（KSN_DAT 不一致） }
    order: "検索時：単項目 → 0 件 → 上限。登録時：単項目 → セット → 確認 → 排他 → 更新。"

  - id: L-US-13
    name: 排他チェック
    design_locator: "BP r321-r333 / 10_項目間 No6"
    handler: "R60UserController.py:1366-1380"
    rules:
      - "画面が保持する KSN_DAT と DB の KSN_DAT を比較する。"
      - "更新区分='1'（オンライン）かつ不一致 → R60W0006。"
      - "一致時は KSN_DAT をシステム日時で更新し、REV_NO を +1 する。"
    deviation: >-
      対象行が存在しない場合も R60W0006 を返す（D-US-07）。
      KSN_KBN の比較に R60Const.REG_KBN_ONLINE を使っており、名前と対象列が一致しない（D-US-08、値は共に '1' と推測）。

  - id: L-US-14
    name: 登録ステータス判定
    design_locator: "14_項目移送表(DB) No16"
    handler: "R60UserController.py:1442-1458"
    rules:
      - "役割・帳票共有グループ・帳票参照・帳票権限・ユーザタイプの 5 項目がすべて非空なら '1'。"
      - "いずれかが空なら '0'。"
    note: "R60Plc の REG_STS（18＋タンク 6）と違い、条件付き必須は無い。"

  - id: L-US-15
    name: 更新（15 列）
    design_locator: "BP r335-r336 / 14_項目移送表(DB)"
    handler: "R60UserController.py:1388-1438"
    rules:
      - "UPDATE のみ。WHERE は STF_CD。"
      - "業務 10 列：メール 2・S 会社・S 事業場・REG_STS・SEND_STS・役割・帳票共有グループ・帳票参照・帳票権限・ユーザタイプ。"
      - "管理 5 列：KSN_KBN='1'・KSN_STF_ID・KSN_DAT=システム日時・KSN_PGM_ID・REV_NO+1。"
      - "成功時は R60I0001。"
    deviation: >-
      端点は単項目・項目間・緊急配信必須のチェックを行わない。画面側のみの防御である（D-US-06）。
      KSN_STF_ID はクライアントから受け取る（D-US-15）。

  - id: L-US-16
    name: 緊急配信
    design_locator: "BP r340-r344"
    handler: "R60UserController.py:1462-1471"
    rules:
      - "SEND_STS='9' のとき緊急配信パッケージを呼ぶ。"
      - "引数はテーブル ID（R60_USER_M_TBL）・ログインユーザの社員コード・プログラム ID（R60User）。"
      - "commit の前に呼ぶ。"
    note: "設計の引数と実装の引数は一致する（良い対比）。"

  - id: L-US-17
    name: 確認・完了メッセージ
    design_locator: "11_その他メッセージ"
    messages:
      - { code: R60A0008, rule: 業務終了の確認 }
      - { code: R60A0003, rule: 登録の確認 }
      - { code: R60I0001, rule: 登録完了 }
      - { code: R60W0007, rule: 変更破棄の確認 }
    deviation: >-
      画面は更新応答の message を使わず、完了文言を固定表示する。
      さらに errorCode='1' で R60W0006 以外のエラーは TODO のまま成功表示へ落ちる（D-US-11）。

design_vs_implementation_summary:
  matched:
    - "検索条件（完全一致・前方一致）と件数 0／上限超過の扱い"
    - "既定ソート DEL_FLG, 所属会社, 社員コード"
    - "7 ドロップダウンの情報源と情報 ID"
    - "REG_STS の 5 項目判定"
    - "排他 → 更新 → 緊急配信 → commit の順序"
    - "0 件時の一覧非表示"
  mismatched:
    - "検索の会社初期値が S 会社（D-US-02）"
    - "自工／他工判別の OR 条件の単純化（D-US-05）"
    - "登録ボタン活性の再判定なし（D-US-12）"
    - "LIKE の % / _ 未エスケープ（D-US-13）"
    - "未知の更新エラーを成功扱い（D-US-11）"
  unimplemented_design_artifacts:
    - "新規ボタン・ダウンロードボタン（空実装）"
    - "R60UserCreate.vue（参照なし）"
    - "削除ボタン（常時非活性）"

open_questions:
  - "検索会社の初期値は所属会社か S 会社か（D-US-02）。"
  - "更新 API の検証をサーバー側へ寄せるか（D-US-06）。"
  - "未知エラー時に成功表示する挙動を許容するか（D-US-11）。"
