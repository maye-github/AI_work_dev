  - { no: 16, name: 半製品コード,         type: textbox,  condition: 前方一致,  initial: 空白, len: 6 }
  - { no: 17, name: 半製品コード検索,     type: icon,     condition: "-",      initial: "-", note: "ダミー半製品も検索対象" }
  - { no: 18, name: 半製品名称,           type: textbox,  condition: 中間一致,  initial: 空白, note: "日本語名・略名・カナ名・略称2 の OR 検索" }
