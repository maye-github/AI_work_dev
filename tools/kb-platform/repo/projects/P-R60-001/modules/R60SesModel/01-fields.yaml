  - { no: 25, name: 検索結果非表示,       type: button,   condition: "-",      initial: "-" }

result_columns:
  sortable: [生産モデルコード, 生産モデル名]
  columns:
    - { name: 送信,               source: 生産モデルマスタ.送信ステータス, display: "'' / 未 / 済 / 緊", note: "コード値マスタ(明細) 情報ID 000000057" }
    - { name: 生産モデルコード,   source: 生産モデルマスタ.生産モデルコード, link: true }
    - { name: 生産モデル名,       source: 生産モデルマスタ.生産モデル名,     link: true }
    - { name: 親コード区分,       source: 生産モデルマスタ.親コード区分,     note: "コード値マスタ(明細) 情報ID 000000091" }
    - { name: 削除,               source: 生産モデルマスタ.論理削除フラグ,   display: "'' / 削", note: "コード値マスタ(明細) 情報ID 000000063" }
  count: 5
  buttons: [複製, 明細]
  note: >-
    一覧の列は 5 つと少ない。主従構造のため、詳細（子コード・所要量・基準値）は
    明細画面へ遷移して表示する。

detail_columns:
  count: 11
  columns:
    - { name: 送信,             source: 生産モデル明細マスタ.送信ステータス, note: "情報ID 000000057" }
    - { name: 子コード区分,     source: 生産モデル明細マスタ.子コード区分,   note: "情報ID 000000092" }
    - { name: 子コード,         source: 生産モデル明細マスタ.子コード }
    - { name: 子コード名称,     source: "半製品M / 購入品目M から名称を取得", note: "R60_Get_Hsh_Information_FNC / R60_Get_KonHmk_Information_FNC" }
    - { name: 所要量,           source: 生産モデル明細マスタ.所要量,         display: "99,999.99999" }
    - { name: 所要量単位,       source: 購入品目M.在庫管理単位コード → コード値名称 }
    - { name: 基準値,           source: 生産モデル明細マスタ.基準値,         display: "9,999,999,999" }
    - { name: 基準値単位,       source: "所要量単位と同じ",                  note: "設計は『所要量単位と同様』とだけ書く" }
    - { name: 調達対象外フラグ, source: 生産モデル明細マスタ.調達対象外フラグ, note: "情報ID 000000455" }
    - { name: 展開区分,         source: 生産モデル明細マスタ.展開区分,       note: "情報ID 000000457" }
    - { name: 削除,             source: 生産モデル明細マスタ.論理削除フラグ, display: "'' / 削" }
  sortable: []

master_items:
  header_modal:
    editable:
      - 生産モデルコード：親番（新規・複製。自動採番 OFF 時）
      - 生産モデルコード：枝番（新規・複製。自動採番 OFF 時）
      - 生産モデル名
      - 半製品コード自動採番（オプション区分='2'・新規/複製・会社が 0093/0452 の時のみ表示）
    label_only:
      - 操作モード
      - 親コード区分（オプション区分によりアイテム／半製品／原材料）
    modify_only:
      - 緊急配信（送信ステータス='9' の時チェック）
      - 削除（論理削除フラグ='1' の時チェック）
    buttons: [戻る, 削除, 登録]
  detail_modal:
    editable:
      - 子コード区分（ドロップダウン）
      - 子コード（区分が空白なら非活性）
      - 所要量（0.001〜99,999.999）
      - 基準値（1〜9,999,999,999）
      - 調達対象外フラグ（ドロップダウン）
      - 展開区分（ドロップダウン）
    label_only:
      - 操作モード
      - 子コード名称
      - コメント挿入１（"(0.001 ～ 99,999.999)"）
      - コメント挿入２（"(1 ～ 9,999,999,999)"）
    modify_only:
      - 削除（論理削除フラグ）
    buttons: [戻る, 削除, 登録]
  conditional_disable:
    - "飲料社接続フラグ='1' の時、生産モデル名・所要量・基準値は非活性"
    - "子コード区分が空白の時、子コードと子コード検索は非活性"
    - "半製品コード自動採番 ON の時、親番・検索・枝番は非活性"

