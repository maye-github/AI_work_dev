  - { no: 10, name: アイテム名称,         type: textbox,  condition: 中間一致,  initial: 空白, note: "オプション区分='1' の時のみ表示。シートの種別は誤って『ボタン』（D-SM-17）" }
  - { no: 11, name: 削除含む,             type: checkbox, condition: "未チェックなら DEL_FLG='0'", initial: チェックなし }
