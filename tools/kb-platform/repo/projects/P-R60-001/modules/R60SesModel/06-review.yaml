deviations:
  - id: D-SM-01
    title: 調査票の endpoints=16 は実測 12
    category: survey
    severity: medium
    finding: >-
      reports/module-survey/scores/R60SesModel.yaml は complexity.signals.endpoints を 16 と
      記録するが、同ファイル自身が【推測】と注記している。実測は @router.post 12 件、
      Service メソッド 12 件。
    evidence:
      - "R60SesModelController.py: 12 の @router.post"
      - "R60SesModelService.ts: 12 メソッド"
      - "reports/module-survey/scores/R60SesModel.yaml: endpoints: 16（【推測】）"
    impact: "複雑度スコアの端点シグナルが 33% 過大。"
    treatment: "本カードは実測 12 を採る。"

  - id: D-SM-02
    title: 単体テスト 760 項目は小計行の二重計上
    category: design_internal
    severity: medium
    finding: >-
      仕様兼結果のヘッダは 760 項目だが、節の小計行を含む。
      実項目は 679。760 = 679 + 53 + 21 + 7。
      B5 小計 53 は配下の子 48 と一致しない（差 5）。
    evidence:
      - "00_単体ﾃｽﾄ仕様兼結果.txt: AN 列合計"
      - "カテゴリ別: 38 + 149 + 160 + 371 + 42 = 760 / 実項目 679"
    impact: "テスト規模を 81 件（約 12%）過大に見積もる。小計の誤差 5 の原因も不明。"
    treatment: "本カードは 760（生セル）と 679（実項目）を併記する。"

  - id: D-SM-03
    title: メッセージ台帳が 3 箇所に分散し件数が一致しない
    category: design_vs_implementation
    severity: medium
    finding: >-
      『その他メッセージ』は 8 ID、単項目・項目間チェックが参照するのは 33 ID、
      実装は 36 ID を取得し 37 ID を参照する。どの台帳も全量を持たない。
    evidence:
      - "19_その他メッセージ: 8 distinct"
      - "17/18 チェック: 33 distinct"
      - "R60SesModelController.py get_message_info: 36 ID"
      - "参照 37 ID（R60W0001 を含む）"
    impact: "メッセージだけを台帳で照合すると、チェック系文言の欠落を見落とす。"
    treatment: "本カードは 04-errors に全 37 ID を列挙する。"

  - id: D-SM-04
    title: Pydantic モデルが extra='ignore'
    category: implementation_only
    severity: medium
    finding: >-
      BaseCamelModel は extra='ignore' を指定する。骨架規則の extra='forbid' と異なる。
    evidence:
      - "R60SesModelController.py:63-69"
      - ".claude/rules/03-design-coding.md §2"
    impact: "定義外の入力が 422 にならず静黙無視される。"
    treatment: "移行案件の既存事実として記録。骨架の既定は forbid のまま変更しない。"

  - id: D-SM-05
    title: SQL の文字列連結とコード値の未エスケープ
    category: implementation_only
    severity: high
    finding: >-
      search の件数 SQL は ses_mdl_cd をシングルクォートで囲まずに連結する。
      get_ses_mdl_cd_condition は kon_hmk_cd / hsh_cd を未エスケープで LIKE に埋め込む。
      download は WHERE 全体を f-string で組み立てる。
    evidence:
      - "R60SesModelController.py:1946-1948（count_sb へ生値）"
      - "R60SesModelController.py:5189, 5195（KO_CD LIKE '値%'）"
      - "R60SesModelController.py:2172-2286（download の WHERE 連結）"
    impact: "SQL 断片の混入面が広い。骨架の bind 原則から外れる。"
    treatment: "骨架の製造細則では bind 必須。移行案件では既存実装の事実として記録する。"

  - id: D-SM-06
    title: search と download で DEL_FLG 条件の書き方が異なる
    category: design_vs_implementation
    severity: low
    finding: >-
      search は is_deleted != '1' で DEL_FLG='0' を加え、
      download は is_deleted == '0' の時だけ加える。
      現行の入力値（0/1）では同値だが、想定外の値で挙動が分かれる。
    evidence:
      - "R60SesModelController.py:1981"
      - "R60SesModelController.py:2229"
    impact: "画面から 2 以外の値が来ると、検索と DL の対象がずれる。"
    treatment: "本カードは事実として併記。"

  - id: D-SM-07
    title: 指定ソート時に副キー SES_MDL_CD が落ちる
    category: design_vs_implementation
    severity: medium
    finding: >-
      既定は ORDER BY DEL_FLG, SES_MDL_CD, ROWID。指定ソート時は
      ORDER BY DEL_FLG, {列} {ASC|DESC}, ROWID となり、SES_MDL_CD の副キーが落ちる。
    evidence:
      - "R60SesModelController.py:2063-2078"
      - "21_業務処理説明: 並び順の記述"
    impact: "同値行の並びが設計と変わる。ROWID で順序は安定する。"
    treatment: "実装を事実として記録。設計の副キー意図は未確定。"

  - id: D-SM-08
    title: ページングが OFFSET/FETCH
    category: design_vs_implementation
    severity: low
    finding: >-
      骨架の規則は Oracle 検索一覧のページングを原則 ROWID 方式とするが、
      実装は OFFSET {n} ROWS FETCH FIRST {m} ROWS ONLY を使う。
    evidence:
      - "R60SesModelController.py:2111"
      - ".claude/rules/00-project-global.md §5"
    impact: "深いページで性能が落ち得る。"
    treatment: "移行案件の既存事実。骨架の既定は変更しない。"

  - id: D-SM-09
    title: Service の dataInit が未使用
    category: implementation_only
    severity: low
    finding: >-
      R60SesModelService.ts は dataInit を持つが、画面のデータ初期化は
      subDataInit('R60SesModel/dataInit', ...) を直接呼ぶ。Service メソッドは死んでいる。
    evidence:
      - "R60SesModelService.ts:40-44"
      - "R60SesModel.vue:1767-1772"
    impact: "修正時にどちらを直すか誤り得る。"
    treatment: "実装の事実として記録。"

  - id: D-SM-10
    title: R60W0001 を取得せずに返す
    category: implementation_only
    severity: medium
    finding: >-
      dataInit は sim_kbn='0' で R60W0001 を返すが、init の message_info（36 件）に
      R60W0001 が含まれない。画面が文言を引けない可能性がある。
    evidence:
      - "R60SesModelController.py:2305"
      - "R60SesModelController.py get_message_info: 36 件に W0001 なし"
    impact: "通常環境で初期化を押すと、メッセージ解決に失敗し得る。"
    treatment: "不具合候補として記録。"

  - id: D-SM-11
    title: 業務処理説明に設計者自身の疑問メモが残る
    category: design_internal
    severity: low
    finding: >-
      BP r1720 に『※このパターンは存在しない？』という自己疑問の注記が残っている。
      分岐の網羅性が確定していない。
    evidence:
      - "21_業務処理説明 r1720"
    impact: "その分岐の仕様が未確定のまま実装されている可能性。"
    treatment: "未確定事項として記録。"

  - id: D-SM-12
    title: 顧客固有の会社コードが BP に直書き
    category: design_internal
    severity: medium
    finding: >-
      BP の条件に '0093'（飲料社）・'0452'（カルピス社）・'0001'（ビール社工場）・
      'P030' が直書きされている。実装も定数として持つ。
    evidence:
      - "21_業務処理説明 r350, r602-604, r975, r1184, r1836"
      - "R60SesModelController.py:50-51"
    impact: "会社追加・変更のたびにコード修正が要る。greenfield では設定化を検討する。"
    treatment: "移行案件の事実として記録。骨架へ持ち込まない。"

  - id: D-SM-13
    title: 項目移送表 12 枚に対して実テーブルは 6 つ
    category: design_internal
    severity: low
    finding: >-
      DB1〜DB12 のうち、同一テーブルが登録・更新・削除の別シートに分かれている。
      更新列はシートごとに読み分ける必要がある。
    evidence:
      - "22-33_項目移送表(DB)1-12"
      - "SES_MODEL=DB1/7, SES_MODEL_MES=DB2/8/11/12, HAN_SEIHIN=DB4/10, KJO=DB6/9"
    impact: "1 テーブル 1 シートと誤解すると更新列を取り違える。"
    treatment: "01-fields に 12→6 の対応表を置く。"

  - id: D-SM-14
    title: A/B レポートが無い
    category: ab_report
    severity: high
    finding: >-
      調査票の impl_alignment は null。R60SesModel には A/B 比較レポートが無く、
      実装が設計どおりかは単体テストの『不具合 0』以外に証拠が無い。
    evidence:
      - "reports/module-survey/scores/R60SesModel.yaml: impl_alignment: null"
      - "doc/03_AI/AB_Reports/reports/R60SesModel/ 不存在"
