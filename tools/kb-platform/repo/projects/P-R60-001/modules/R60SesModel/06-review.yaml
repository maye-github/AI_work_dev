    treatment: "RAG では『A/B 未測定』を明示し、実装一致と断定しない。"

  - id: D-SM-15
    title: 調査票の項目数・イベント数は No の最大値
    category: survey
    severity: low
    finding: >-
      調査票は『33 項目 / 39 項目 / 31 イベント』と記録するが、これはシートの No 最大値。
      節見出し行と欠番を除くと、単項目チェック 29、項目間チェック 36、イベント 28。
    evidence:
      - "17_画面単項目チェック: No1-33、節行 [1,10,23,32]"
      - "18_画面項目間: No1-39、節行 [1,4,25]"
      - "20_イベント一覧: No1-31、節行 [1,20,26]"
    impact: "件数で設計を照合すると 4〜7 件ずれる。"
    treatment: "本カードは実件数を採る。"

  - id: D-SM-16
    title: 明細マスタ項目 No13 展開区分の初期値欄が誤り
    category: design_internal
    severity: medium
    finding: >-
      『展開区分』の初期値が『リンクを押下した同行の調達対象外フラグ』になっている。
      コピー＆ペースト誤りで、展開区分自身の値が正。
    evidence:
      - "16_画面項目内容(マスタ項目_明細): No13"
    impact: "初期値をそのまま実装すると、展開区分に調達対象外フラグを入れる。"
    treatment: "設計の誤りとして記録。実装は展開区分を独立に扱う。"

  - id: D-SM-17
    title: 検索 No10 アイテム名称の種別が『ボタン』
    category: design_internal
    severity: medium
    finding: "アイテム名称はテキストボックスだが、種別欄が『ボタン』になっている。"
    evidence:
      - "06_画面項目内容(検索): No10"
    impact: "種別で項目を分類すると、入力項目を取りこぼす。"
    treatment: "テキストボックスが正。実装もテキストボックス。"

  - id: D-SM-18
    title: 単項目 No8 半製品名称の桁が本文 30 とメッセージ引数 40 で食い違う
    category: design_internal
    severity: medium
    finding: >-
      チェック本文は『30byte』だが、メッセージの ##2 は 40。
      項目定義（半製品名称 40）と合わせると 40 が正と読める。
    evidence:
      - "17_画面単項目チェック: No8"
      - "06_画面項目内容(検索): No18 半製品名称"
    impact: "30 で実装すると、40 桁の名称を登録できない。"
    treatment: "40 を正と推定し、未確定事項に残す。"

  - id: D-SM-19
    title: DB5 / DB6 の削除で監査列を更新しない
    category: implementation_only
    severity: low
    finding: >-
      R60_HSH_SES_MODEL_REF_M_TBL と R60_KJO_SES_MODEL_M_TBL の削除は
      SEND_STS / DEL_FLG / KSN_DAT / KSN_PGM_ID の 4 列のみ。
      他の削除系が更新する KSN_KBN / KSN_STF_ID / REV_NO を更新しない。
    evidence:
      - "26_項目移送表(DB)5"
      - "27_項目移送表(DB)6"
    impact: "監査証跡と楽観ロック値が残らない。意図か漏れか不明。"
    treatment: "未確定事項として記録。"

  - id: D-SM-20
    title: 端点の無い Pydantic モデル定義が 2 組残る
    category: implementation_only
    severity: medium
    finding: >-
      GetItem*（1001-1115 行）と GetKoCdNm*（1675-1732 行）は定義だけがあり、
      @router.post が無い。getKonHmk と役割が重複する。
    evidence:
      - "R60SesModelController.py:1001-1115"
      - "R60SesModelController.py:1675-1732"
    impact: "死んだ契約定義が API 一覧を膨らませる。"
    treatment: "実装の事実として記録。移行時は getKonHmk を正とする。"

  - id: D-SM-21
    title: InitEditHeaderData に mode が無く、渡した値が捨てられる
    category: design_vs_implementation
    severity: medium
    finding: >-
      init_edit は mode=3 の分岐で InitEditHeaderData(mode='修正', ...) を組み立てるが、
      モデルに mode フィールドが無いため extra='ignore' で応答から落ちる。
      画面は親から受け取った mode を表示に使う。
    evidence:
      - "R60SesModelController.py:2455-2475"
      - "R60SesModelController.py:571-655（InitEditHeaderData）"
    impact: "API 単体では操作モードが分からない。レスポンス定義と実装意図が食い違う。"
    treatment: "実装の事実として記録。"

  - id: D-SM-22
    title: 検索 No12/16 のエンティティ桁 7 と表示桁 6
    category: design_internal
    severity: low
    finding: >-
      購入品目コード・半製品コードはエンティティ桁 7、表示桁 6。
      枝番が 6 桁であることと整合するが、桁欄の意味が混在している。
    evidence:
      - "06_画面項目内容(検索): No12, No16"
    impact: "桁チェックをどちらで実装するか迷う。"
    treatment: "実装（W0108 は購入品目 6 桁）に合わせ、表示桁を採る。"

  - id: D-SM-23
    title: 更新系 API が message_id を返さない
    category: design_vs_implementation
    severity: medium
    finding: >-
      EditResponse / DeleteResponse / EditChildResponse / DeleteChildResponse は
      message_id を持つが、実装の成功応答は error_code / error_id / ses_mdl_cd のみ。
      画面が R60I0001 / R60I0002 を固定表示する。
    evidence:
      - "R60SesModelController.py:2822, 3310, 3737, 4379, 4569"
      - "R60SesModelEdit.vue:900-902"
    impact: "設計のメッセージ契約と実装が一対一でない。文言変更時に両方を直す必要がある。"
    treatment: "実装の事実として記録。"

  - id: D-SM-24
    title: Enabled という名前のフラグが disabled を制御する
    category: implementation_only
    severity: medium
    finding: >-
      deleteBtnEnabled / registBtnEnabled は disabled 属性へバインドされる。
      true が『非活性』を意味する。
    evidence:
      - "R60SesModelEdit.vue:484-486"
      - "R60SesModelMesEdit.vue:483-486"
    impact: "名前から活性と読むと挙動を逆に理解する。R60Plc の D-PL-15 と同型。"
    treatment: "実装の事実として記録。骨架の製造では名前と意味を一致させる。"

