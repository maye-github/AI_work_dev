deviations:
  - id: D-SS-01
    title: 画面項目数が骨架の I-ID 枠（56）と一致しない
    type: design_vs_skeleton
    evidence:
      - "画面項目内容(検索)：番号行 39、実項目 35（見出し 4 行を除く）"
      - "画面項目内容(マスタ項目)：番号行 13、実項目 10（見出し 3 行を除く）"
      - "骨架の I-201..I-256 は 56 件"
    impact: "I-ID を 1 対 1 で対応付けると、検索 35 件・マスタ 10 件のどちらとも合わない。"
    cause: "56 は骨架構築時に置いた仮の枠であり、設計書から導いた数ではない。"
    action: "R60Ssk では I-ID を画面項目数として使わない。I-ID を起こす場合は設計書の項目番号を source_locator に持つ。"
    machine_detectable: false
