ab_comparison:
  status: partially_measured
  results: { pass: 3, structural: 3, warn: 0, fail: 0, skip: 2 }
  action_ids: [head, init, check, search, search, detail, modify, download]
  measured:
    - "✅ head / init / check / search / search：SQL 行数と API 行数が一致。"
    - "🔷 detail：API が UI 用の項目を余分に返す（10 差分）。設計差であり bug ではない。"
  not_measured:
    - "⏭️ modify（登録更新）"
    - "⏭️ download（CSV）"
  implication: >-
    参照系は一致、更新系とダウンロードは未測定。impl_alignment は 3（5 ではない）。
    実装を正解として提示せず、設計書と単体テスト仕様を正として学習する。

teaching_value:
  strengths:
    - "検索一覧＋修正モーダルの最小構成で、8 工程の写像（画面項目→チェック→イベント→DB→テスト）を一通り学べる。"
    - "更新のみ・項目移送表の ○ 列・ボタン初期値が互いに整合しており、『設計の複数箇所を突合する』教材になる。"
    - "146 件のテスト項目が 5 分類で整理され、分類ごとの件数を数えられる。"
    - "設計書自身に矛盾（D-SS-05 / 10 / 14）と欠番（D-SS-11）があり、レビュー訓練の題材になる。"
  cautions:
    - "『廃止_画面項目内容(入力)』は Maker の残骸で、Ssk の仕様ではない（D-SS-06）。"
    - "AB の modify / download は未測定のため、更新系の実装一致を語れない（D-SS-02 / ab_comparison）。"
    - "単体テストの個別ケース本文が未抽出で、件数以上の網羅性は判断できない。"
