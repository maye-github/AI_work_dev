    type: measurement
    evidence:
      - "reports/module-survey/scores/R60Ssk.yaml:12 は complexity.signals.endpoints=8 と書く。"
      - "同ファイル:13 の注記は『AB actionId は8件』と書く。"
      - "R60SskController.py の @router.post は init / search / download / initEdit / edit の 5 件。"
      - "R60SskService.ts のメソッドも 5 件。"
    impact: "端点数の signal を complexity 判定に使うと、R60Ssk を実際より複雑に見積もる。"
    cause: "調査時に AB レポートの actionId 行数を端点数として転記した。"
    action: "本カードでは実測 5 端点を採る。調査票の signals は次回更新時に分けて記録する。"
    machine_detectable: true
    detection_hint: "controller の @router 数と AB レポートの actionId 行数を別々に数える。"
    layer: knowledge

  - id: D-SS-03
