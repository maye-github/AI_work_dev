    type: design_clarity
    evidence:
      - "項目移送表(DB) r15-r33：登録（W 列）と削除（Y 列）に ○ が 1 つも無く、更新（X 列）だけに 9 列の ○ がある。"
      - "画面項目内容(マスタ項目) r27：削除ボタンは初期値 非活性。修正モードでも活性化する記述が無い。"
      - "画面項目内容(検索) r53：新規ボタンは初期値 非活性。"
      - "BP には新規・削除のイベントが無い（イベント 16 件中、登録は No16 のみ）。"
    impact: "『マスタメンテナンス』という名称から新規・削除を想定すると、設計に無い機能を作ってしまう。"
    cause: "IDM から受信済みのデータを更新する画面であり、新規・削除は上流（IDM）の責務である。ただしその旨は概要の前提条件にしか書かれていない。"
    action: "RAG では『更新専用』を本画面の第一命題として扱う。削除ボタンの存在は UI の残骸と読む。"
    machine_detectable: true
    detection_hint: "項目移送表の登録・削除列に ○ があるか、イベント一覧に新規・削除があるかを見る。"
    layer: knowledge

  - id: D-SS-04
