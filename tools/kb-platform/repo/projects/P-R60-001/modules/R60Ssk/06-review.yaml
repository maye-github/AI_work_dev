      - "画面項目内容(マスタ項目) r20-r21 も同じ対応（No5 事業場組織ユニット→JIG_SSK_UNIT、No6 組織ユニットコード→SSK_UNIT）で、検索シートと逆になる。"
    impact: "名称で列を選ぶと、検索一覧とマスタ項目で別の DB 列を指す。"
    cause: "画面項目名と DB 項目名の対応が、シート間で統一されていない。"
    action: "RAG では名称ではなく DB 列名をキーにする。設計へ確認事項として返す。"
    machine_detectable: true
    detection_hint: "同じ項目名のエンティティ項目が、シート間で一致するか突合する。"
    layer: knowledge

