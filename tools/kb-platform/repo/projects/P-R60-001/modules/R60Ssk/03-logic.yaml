---
id: KNOW-LEGACY-R60-MODULE-R60SSK-LOGIC
type: knowledge
req_ids: []
status: open
sensitivity: internal
owner: AI-SE
version: 0.1.0

module: R60Ssk
artifact_type: logic-card

source:
  design_process: reports/module-survey/R60Ssk/design/13_業務処理説明.txt
  design_events: reports/module-survey/R60Ssk/design/12_イベント一覧.txt
  design_checks: reports/module-survey/R60Ssk/design/09_画面単項目チェック.txt
  design_db_checks: reports/module-survey/R60Ssk/design/10_画面項目間・DB整合チェック.txt
  implementation: api/fastapi_oracle_pjt/app/routers/R60SskController.py

summary:
  screen: 部署マスタメンテナンス（R60Ssk）
  screen_kind: 検索一覧＋修正（更新のみ）
  premise: "IDM からのデータ受信が完了していること（01_概要 r29）"
  frequency: 月次／随時（01_概要 r38-r39）
  business_key: [CMP_CD, SSK_UNIT]
  transaction_scope: "UPDATE のみ。INSERT / DELETE は項目移送表に ○ が無い"

logic_cards:
  - id: SS-LOGIC-01
    name: 共通前処理（セッション・オンライン）
    trigger: 全イベント
    steps:
      - "セッション情報の有無を共通関数で確認する。無ければセッション情報エラー画面へ遷移する。"
      - "オンライン利用可否フラグを共通関数で確認する。NG ならオンライン制御エラー画面へ遷移する。"
    implementation: "5 端点すべての先頭で r60util.chk_onl_flg()。NG は OnlineException"
    design_locator: "BP r13-r20"
    note: "セッション確認はフロント／共通基盤側。コントローラには現れない。"

  - id: SS-LOGIC-02
    name: 一覧画面の初期表示
    trigger: イベントNo1
    steps:
      - "呼び出し元から所属会社コード・組織コード・社員コードを引き継ぐ（BP r25-r28）。"
      - "ユーザ情報・権限情報を取得する（標準仕様参照）。"
      - "R60_GET_MESSAGE_FNC で使用メッセージを取得する。"
      - "検索条件のドロップダウン（会社・1 頁件数）を生成する。"
      - "会社の初期値はログインユーザの会社を選択状態にする。"
      - "会社未選択なら組織ユニット項目を入力不可、組織ユニット検索を非活性にする。"
    implementation: "init（R60SskController.py:391-515）"
    design_locator: "BP r23-r47"
    data_sources:
      company_list: "R60_CODE_MES_M_TBL 情報ID='000000104'、DEL_FLG='0'、HYJ_SEQ・KEY_ID 昇順"
      page_list: "R60_CODE_MES_M_TBL 情報ID='000000065'、KOB_KMK_NM_10='D' が初期値"
      messages: "16 件（うち 5 件は本画面で未使用。D-SS-07）"

  - id: SS-LOGIC-03
    name: 会社ドロップダウン変更
    trigger: イベントNo2
    steps:
      - "会社が未選択：組織ユニットの内容を削除し入力不可にする。組織ユニット検索を非活性にする。"
      - "会社が選択済：組織ユニットを入力可にし、組織ユニット検索を活性にする。"
    implementation: "フロントのみ（R60Ssk.vue）"
    design_locator: "BP r49-r57"

  - id: SS-LOGIC-04
    name: 組織ユニット検索（入力支援）
    trigger: イベントNo3
    steps:
      - "『一覧型入力支援(択一式)』を組織ユニットで起動する。"
      - "引数1='SSK_UNIT'、引数2=会社の選択値。"
      - "選択された組織ユニットを項目へ反映する。"
    implementation: "フロントのみ（R60Ssk.vue）"
    design_locator: "BP r59-r67"

  - id: SS-LOGIC-05
    name: 表示（検索）処理
    trigger: イベントNo4
    steps:
      - "単項目チェックを行う：会社コード必須（R60W0009）、組織ユニット形式（R60W0106）、正式名称形式（R60W0131）。"
      - "WHERE を生成する：会社は完全一致、組織ユニットは前方一致、正式名称は部分一致。未入力項目は条件に加えない。"
      - "件数を取得し、0 件なら R60W0010、上限超過なら R60W0005 を返す。"
      - "抽出項目は R60_GET_SELECT_COLUMN_FNC('R60_SSK_M_TBL', 'L') で取得する。"
      - "既定ソートは DEL_FLG 昇順 → CMP_CD 昇順 → SSK_UNIT 昇順。"
      - "1 頁件数でページングし、総頁数と総件数を返す。"
      - "ボタン活性：戻る・ダウンロードは 1 件以上で活性、0 件で非活性。表示・業務終了は常時活性。新規は非活性。"
    implementation: "search（R60SskController.py:520-633）"
    design_locator: "BP r69-r108"
    checks_locator: "09_画面単項目チェック r14-r16 / 10_画面項目間・DB整合チェック r14-r15"
    notes:
      - "件数取得とデータ取得で同じ WHERE を使う（bind パラメータ）。"
      - "上限件数はコード値マスタ(明細) 情報ID='000000024' から取得する（BP r83-r84 は『標準仕様参照』）。"
      - "設計の処理番号は (1)(2)(4)(5)(6)(7)(8) で (3) が欠番（D-SS-11）。"

  - id: SS-LOGIC-06
    name: ページ移動
    trigger: イベントNo6
    steps:
      - "<< / < / 頁番号 / > / >> のクリックで該当頁を取得する。"
      - "設計本文は『標準仕様参照』で、頁番号の丸め規則は書かれていない。"
    implementation: "search の current_page / page_limit を差し替えて再呼出（フロント）"
    design_locator: "12_イベント一覧 r19"
    note: "実装は current_page を 1〜総頁へクランプする。設計由来ではなく実装の防御。"

  - id: SS-LOGIC-07
    name: 一覧ソート
    trigger: イベントNo7/8/9
    steps:
      - "会社・事業場組織ユニット・組織ユニットコードの列見出しクリックでソートする。"
      - "設計本文は『標準仕様参照』で、各列がどの DB 列に対応するかは書かれていない。"
    implementation: "search の sort_field / sort_order。許可項目は CMP_CD / SSK_UNIT / JIG_SSK_UNIT"
    design_locator: "12_イベント一覧 r20-r22"
    notes:
      - "許可外の sort_field は既定ソートへフォールバックする（SQL 断片の直接連結を避ける）。"
      - "設計の列名と DB 列名の対応が一意でない（D-SS-12）。"

  - id: SS-LOGIC-08
    name: 一覧データリンク（修正モード起動）
    trigger: イベントNo10
    steps:
      - "選択行の CMP_CD と SSK_UNIT をキーにマスタ項目画面を修正モードで起動する。"
      - "経理用会社リストを生成する（会社マスタ、DEL_FLG='0'、CMP_CD 昇順、先頭にブランク行）。"
      - "経理用事業場リストを生成する（会社＋事業場、双方 DEL_FLG='0'、HYJ_SEQ NOT NULL、HYJ_SEQ・CMP_CD・JIG_CD 昇順、先頭にブランク行）。"
      - "登録ボタンは権限区分:Y の時のみ活性。"
      - "削除ボタンは修正モードでも非活性。"
    implementation: "initEdit（R60SskController.py:690-783）とフロント"
    design_locator: "BP r111-r147"
    notes:
      - "実装はドロップダウンの全件を返し、経理用会社→経理用事業場の絞り込みはフロントで行う。"
      - "削除ボタンが非活性の理由は設計に書かれていない。項目移送表に削除 ○ が無いことと整合する（D-SS-03）。"

  - id: SS-LOGIC-09
    name: 経理用会社ドロップダウン変更
    trigger: イベントNo14
    steps:
      - "経理用事業場のリストを削除する。"
      - "経理用会社がブランク以外：選択された会社コードに該当する事業場リストを作り、空白行を初期値にする。"
      - "経理用会社がブランク行：選択行の経理事業場に値があり、かつ選択行の会社と経理会社が同じ場合、ブランク行とその経理事業場だけのリストを作る。"
    implementation: "フロントのみ"
    design_locator: "BP r178-r188"
    note: "『HR から受信したばかりのデータは経理事業場が未設定』という前提が本文に書かれている。"

  - id: SS-LOGIC-10
    name: ダウンロード
    trigger: イベントNo13
    steps:
      - "ファイル名を R60_GET_CODE_CHI_MEISAI_FNC('000000099', 'R60_SSK_M_TBL', '1') で取得する。"
      - "CSV ヘッダを R60_GET_SELECT_COLUMN_FNC('R60_SSK_M_TBL', 'H') で取得する。"
      - "CSV データ項目を R60_GET_SELECT_COLUMN_FNC('R60_SSK_M_TBL', 'D') で取得する。"
      - "表示ボタンで使った検索条件とソート順でデータを取得し、CSV を出力する。"
    implementation: "download（R60SskController.py:638-683）"
    design_locator: "BP r150-r174"
    note: "実装の WHERE は文字列連結（D-SS-09）。"

  - id: SS-LOGIC-11
    name: 登録（更新）処理
    trigger: イベントNo16
    steps:
      - "単項目チェック：全項目に変更が無ければ R60W0016。経理用会社と経理用事業場の片方だけなら R60W2002。"
      - "項目間・DB 整合チェック：KSN_DAT を再読込し、他端末更新済みなら R60W0006。"
      - "登録ステータスを設定する：会社・組織ユニット・事業場組織ユニット・正式名称のいずれかが未設定なら '0'。"
      - "会社コードと組織ユニットを条件に、項目移送表の『更新』○ の列だけを UPDATE する。"
      - "commit し、マスタ項目画面を閉じて検索結果を最新化する。"
    implementation: "edit（R60SskController.py:788-885）"
    design_locator: "BP r191-r215"
    checks_locator: "09_画面単項目チェック r18-r20 / 10_画面項目間・DB整合チェック r17"
    update_columns: [S_CMP_CD, S_JIG_CD, REG_STS, SEND_STS, KSN_KBN, KSN_STF_ID, KSN_DAT, KSN_PGM_ID, REV_NO]
    fixed_values:
      SEND_STS: "'0'（未送信）"
      KSN_KBN: "'1'（オンライン）"
      KSN_DAT: "システム日時"
      KSN_PGM_ID: "'R60Ssk'"
      REV_NO: "取得値 + 1"
    exclusive:
      read: "SELECT KSN_KBN, TO_CHAR(KSN_DAT, 'YYYY/MM/DD HH24:MI:SS') FROM R60_SSK_M_TBL WHERE CMP_CD=:cmp_cd AND SSK_UNIT=:ssk_unit"
      condition: "行が無い、または KSN_DAT 不一致かつ KSN_KBN='1' なら R60W0006"
      batch_exception: "設計は『バッチの場合は OK』（10_画面項目間・DB整合チェック r17）。実装は KSN_KBN='1' の時だけ不一致をエラーにする。"

  - id: SS-LOGIC-12
    name: 戻る（マスタ項目）
    trigger: イベントNo15
    steps:
      - "設計本文は『標準仕様参照』のみ。"
      - "実装は、変更がある場合に R60W0007 で破棄確認を表示し、変更が無ければそのまま閉じる。"
    implementation: "R60SskEdit.vue:312-337（closeDialog）"
    design_locator: "12_イベント一覧 r29"
    note: >-
      R60W0007 は本設計書の『その他メッセージ』に無いが、init がメッセージを取得しており
      実装は表示する。共通仕様側の定義と読めるが、本設計書だけでは裏付けられない（D-SS-13）。"

  - id: SS-LOGIC-13
    name: 業務終了
    trigger: イベントNo12
    steps:
      - "業務終了ボタン押下で R60A0008『業務終了しますか？』を表示する。"
      - "以降の遷移は標準仕様参照。"
    implementation: "フロントのみ"
    design_locator: "11_その他メッセージ r14"

  - id: SS-LOGIC-14
    name: 権限による活性制御
    trigger: 初期表示・マスタ項目表示
    steps:
      - "利用者は利用権限保持者のみ（01_概要 r36）。"
      - "登録ボタンは権限区分:Y の時のみ活性（BP r147）。"
      - "権限区分の取得方法は『標準仕様参照』で、本設計書に条件は無い。"
    implementation: "フロントのみ。サーバ側に権限チェックは無い（未確認ではなく、コントローラに存在しない）"
    design_locator: "BP r33-r34 / r145-r147"

  - id: SS-LOGIC-15
    name: 登録ステータス（REG_STS）の設定
    trigger: 登録処理
    steps:
      - "会社・組織ユニット・事業場組織ユニット・正式名称の 4 項目を判定する。"
      - "すべて非空なら '1'、いずれかが空なら '0' を設定する。"
    implementation: "set_reg_sts（R60SskController.py:877-885）"
    design_locator: "BP r206-r208"
    design_defect: >-
      設計本文の直後に『UPDATEのset句は、R60Const.REG_STS_ON で定数"確定"を設定しているので
      この設定は無効。』という実装メモが混在している（AV 列）。設計の規則とメモが矛盾し、
      実装は規則どおり :reg_sts を bind している（D-SS-10）。

  - id: SS-LOGIC-16
    name: 検索上限件数
    trigger: 表示ボタン
    steps:
      - "上限件数は標準仕様から取得する。"
      - "HIT 件数が上限を超えたら R60W0005 を表示し、一覧を表示しない。"
    implementation: "search の max_count（コード値マスタ(明細) 情報ID='000000024'）"
    design_locator: "BP r83-r84 / 10_画面項目間・DB整合チェック r15"
    note: "設計の例は上限 3000 固定。実装はマスタ値であり、案件ごとに変わり得る。"

state_transitions:
  search_result_buttons:
    initial: { back: 非活性, download: 非活性, new: 非活性 }
    after_hit: { back: 活性, download: 活性, new: 非活性 }
    after_zero: { back: 非活性, download: 非活性, new: 非活性 }
  master_buttons:
    edit_mode: { back: 活性, delete: 非活性, register: "権限区分:Y の時のみ活性" }

implementation_only_rules:
  - "current_page のクランプ（1〜総頁）。設計に丸め規則は無い。"
  - "sort_field が許可外なら既定ソートへフォールバック。設計は標準仕様参照のみ。"
  - "排他判定で KSN_KBN='1' の時だけ不一致をエラーにする（設計の『バッチの場合は OK』に対応）。"

open_questions:
  - "R60W0106 の文言は『##1は半角数字##2文字で入力して下さい。』だが、チェック内容は『半角英数字以外、または8文字超過』。英字を許可するのか数字だけか、設計が矛盾している（D-SS-14）。"
  - "『事業場組織ユニット』と『組織ユニット：コード』の名称と DB 列の対応が入れ替わって見える（D-SS-05）。"
  - "戻るボタン押下時の未登録変更の扱いが本設計書に無い（D-SS-13）。"
