# 知識ベースの更新・削除権限（誰がどこを触れるか）
# ------------------------------------------------------------
# 正本はこのファイル。`tools/kb_acl.py` が読み、`kb-policy.md` §6 が運用を定める。
#
# 権限モデル（2026-11-02 ユーザー指示）:
#   - 会社級（repo/company/**）  … 会社の責任者だけが更新・削除できる
#   - 案件級（repo/projects/<P>/**）… その案件の責任者（PM）だけが更新・削除できる
#   - 結案済みの案件（CLOSED.md がある）… 読み取り専用。誰も更新・削除できない
#
# ★ owner を空欄のままにしない。空欄は「未任命」を意味し、その範囲は誰も更新できない
#   （`tools.kb_acl check` が止める）。名前を書けない段階では、空欄のまま置いておくのが正しい。
#   部署名（例: 共通基盤チーム）は owner にならない。**人が要る。**

version: "1.0"

company:
  # 会社級の更新・削除を承認できる人（1 名）。例: 情報システム部長
  owner: Nan
  # 代理（owner が不在のときに代行できる人）。空配列なら代理なし。
  delegates: []

projects:
  P-DEMO-001:
    owner: Li          # 上流デモ。参照用に PM を置く
    members: [Li]      # 読权限：この人たちの検索にこの案件が出る
    status: open
  P-R60-001:
    owner: Li          # ← 案件責任者（PM）を書く
    members: [Li]      # ← メンバーを足すと、その人の検索にこの案件が出る
    status: open         # open | closed（closed は CLOSED.md の有無と一致させる）
