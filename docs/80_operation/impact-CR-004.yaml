summary: >-
  節点2 承認版 §1 備考① は画面ルート接頭辞を `/R60Login/` とするが、API 端点も
  `POST /R60Login/init`・`/R60Login/login`・`/R60Login/generateUrl` であり、そのまま採ると
  画面ルートと API 端点の接頭辞が同一になって区別できない。節点4 は節点3 側を採り、
  画面 `/R60/{gmnId}` ／ API `/R60Login/` としてルート規約を最終確定した（Q-223 の範囲）。

