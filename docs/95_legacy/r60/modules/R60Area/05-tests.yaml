viewpoint_mapping:
  note: >-
    旧単体テスト仕様は「正常/境界/異常」の分類を持たない。
    骨架の 正常3/境界2/異常3 へ写像するときは、下記の読み替えを使う。
  equivalence_partition:
    - "入力チェック（3.入力チェック）の各項目：有効値・無効値・空値"
    - "権限マトリクス（5-1-1 / 5-1-2）：権限区分 × 自工場/他工場更新権限"
  boundary_value:
    - "エリアコード 7 文字（7 文字 OK / 8 文字 NG）"
    - "エリア名 30Byte（30Byte OK / 31Byte NG）"
    - "エリア略称 16Byte（16Byte OK / 17Byte NG）"
    - "届先名 25 全角文字（25 OK / 26 NG）"
    - "ロケーション 8 文字（8 OK / 9 NG）"
    - "検索上限 3000 件（3000 OK / 3001 NG）"
    - "ページ最終頁・先頭頁"
  decision_table:
    - "操作パターン（新規/複製/修正）× 削除チェック × 緊急配信チェック（4-30-1..8）"
    - "削除パターン（削除のみ/他項目変更有）× 緊急配信（4-29-1..4）"
    - "権限区分 Y/N × 自工場更新権限 × 他工場更新権限（5-1-1: 12 パターン、5-1-2: 10 パターン）"

