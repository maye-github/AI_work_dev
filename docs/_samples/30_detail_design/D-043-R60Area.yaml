logic_ids:
- logic_id: L-014
  name: search 業務（検索ロジック）
  description: 一覧検索の WHERE 組み立て・総件数取得・ページング・56 項目マッピング。
  sql_location: R60AreaController.py L1499-L1647
  steps:
  - online 利用可否チェック（chk_onl_flg）
  - WHERE 組み立て（会社コード完全一致／事業場コード分割／エリアコード前方一致／削除フラグ）
  - COUNT(*) による総件数とページング境界
  - select_column 動的取得と OFFSET-FETCH + ROWID ソート
  - 56 項目マッピング
- logic_id: L-015
  name: initEdit/edit/delete 業務（排他+参照+重複）
  description: 登録・修正・複製・論理削除の重複／排他／被参照チェックと DML 実行。
  sql_location: R60AreaController.py L1713-L2915
  steps:
  - mode1/mode2 登録前キー重複チェック
  - mode3 修正前 排他チェック
  - 削除フラグ=1 時の被参照チェック
  - ロケーション 2 件存在チェック
  - set_reg_sts 15 項目判定
  - INSERT / UPDATE / 論理削除 DML 実行
  - 緊急配信（SEND_STS=9）
  - conn.commit()
error_branch_table:
- error_id: E-001
  condition: 検索結果が 0 件
  msg_placeholder: MSG_R60W0010
  next_action: 一覧を 0 件表示し再検索を促す（画面復帰）
- error_id: E-002
  condition: 更新・削除時に 改竄日時 が不一致（排他）
  msg_placeholder: MSG_R60W0006
  next_action: エラー表示後、最新データの再読込を促す
- error_id: E-003
  condition: 新規・複製時に三鍵が既存レコードと重複
  msg_placeholder: MSG_R60W0014
  next_action: キー項目へフォーカス移動
- error_id: E-004
  condition: 削除対象が他機能から被参照
  msg_placeholder: MSG_R60W0024
  next_action: 削除を中止し一覧へ復帰
- error_id: E-005
  condition: システムエラー（内部例外・判定不能）
  msg_placeholder: MSG_R60E0025
  next_action: トランザクションをロールバックし画面復帰
- error_id: E-006
  condition: 原材料ロケーションが未登録（error_flg=1）
  msg_placeholder: MSG_R60W0033
  next_action: ロケーション項目へフォーカス移動
- error_id: E-007
  condition: 半製品ロケーションが未登録（error_flg=2）
  msg_placeholder: MSG_R60W0033
  next_action: ロケーション項目へフォーカス移動
- error_id: E-008
  condition: 削除確認（論理削除の実行確認）
  msg_placeholder: MSG_R60A0039-0040
  next_action: 確認ダイアログを表示（OK／キャンセル）
