db_model:
  table: R60_KKU_CHI_M_TBL
  table_id: 規格値マスタ
  columns_total: 32
  primary_key: [KNR_KMK_CD, KEY_KMK_1, KEY_KMK_2, KEY_KMK_3, KEY_KMK_4, KEY_KMK_5, KEY_KMK_6]
  operation_columns:
    insert: all_32
    update: [KKU_CHI_KAG, KKU_CHI_JOG, KKU_CHI_JOG_KAG_KBN, KKU_CHI_JOG_KAG_CHK_LVL, KKU_CHI_JOG_KAG_MSG_ID, KKU_CHI_KAG_CHI, KKU_CHI_JOG_CHI, KKU_CHI_JOG_KAG_CHI_KBN, KKU_CHI_JOG_KAG_CHI_CHK_LVL, KKU_CHI_JOG_KAG_CHI_MSG_ID, HJN_KKU_CHI, DEL_FLG, KSN_KBN, KSN_STF_ID, KSN_DAT, KSN_PGM_ID, REV_NO]
    delete: same_as_update
    physical_delete: false
  fixed_values:
    - { column: REG_STS, value: "1", timing: insert }
    - { column: SEND_STS, value: "0", timing: insert }
    - { column: SEND_KBN, value: "0", timing: insert }
    - { column: REG_KBN, value: "1", timing: insert }
    - { column: KSN_KBN, value: "1", timing: insert_and_update }
    - { column: DEL_FLG, value: "1", timing: delete }
  numeric_columns_note: >-
    規格値の 6 列（下限％・上限％・下限値・上限値・標準規格値・その他）は
    画面のカンマを除去して保存する（実装 .replace(",", "")）。

design_defects_in_field_sheet:
  - "各検索／マスタシートの項目数は No 採番の個数で、節見出し行を含む。実項目数として使わない。"
  - "「会社」「事業場」は項目ドロップダウンには出るが管理項目には出さない。設計 r64 の注記どおり。"
  - "事業場は複合値（会社コード,事業場コード）で持つが、KEY_KMK_2 には 2 番目のみを入れる。分解規則は本文に明記が無い。"
  - "画面区分のチェックボックスは抽出で記号が落ちており、どれが印されているか未確認。"
  - "キー項目の物理位置はパターンごとに異なるが、設計の対応表は『意味のあるキー』の一覧で、位置までは書かない。"

open_questions:
  - "端点の単項目チェックをサーバー側へ寄せるか（D-KK-02）。"
  - "未知の mode をエラーにするか（D-KK-11）。"
  - "一括コピー画面を本画面の一部とみなすか、別モジュールとみなすか（D-KK-15）。"
  - "KEY_KMK_1〜6 の詰め方の正本は設計のどこにあるか（実装の build_where が唯一の実装）。"
