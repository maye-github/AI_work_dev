master_items:
  mode_label: "固定値「〔 修正 〕」"
  label_only:
    - 会社（所属会社コード）
    - 社員コード
    - 氏名（社員日本語名称）
    - 発令日
    - 組織ユニット（コード／名称）
    - メールアドレス１
    - パスワード設定日
  editable:
    - メールアドレス２（半角英数 50）
    - 経理用会社（ドロップダウン）
    - 経理用事業場（ドロップダウン）
    - 役割（ドロップダウン、緊急配信時必須）
    - 帳票共有グループ（ドロップダウン、緊急配信時必須）
    - 帳票参照（ドロップダウン、緊急配信時必須）
    - 帳票権限（ドロップダウン、緊急配信時必須）
    - ユーザタイプ（ドロップダウン、緊急配信時必須）
    - 緊急配信（チェックボックス）
  buttons:
    - { no: 21, name: 戻る, initial: 活性 }
    - { no: 22, name: 削除, initial: 非活性 }
    - { no: 23, name: 登録, initial: 活性 }
  emergency_checkbox:
    column: SEND_STS
    on: "9（緊急送信指示）"
    off: "0（未送信）"

dropdowns:
  common_rule: 先頭に空白行（未選択）を追加する。
  items:
    - { item: 経理用会社,   table: R60_COMPANY_M_TBL,                    key: CMP_CD,                  filter: "DEL_FLG=0", order: "CMP_CD" }
    - { item: 経理用事業場, table: "R60_COMPANY_M_TBL × R60_JIG_M_TBL",  key: "CMP_CD + ',' + JIG_CD", filter: "双方 DEL_FLG=0、HYJ_SEQ NOT NULL", order: "HYJ_SEQ, CMP_CD, JIG_CD" }
    - { item: 役割,         table: "R60_HANY_MES_M_TBL × R60_MENU_KINO_ACS_M_TBL", key: KEY_ID, filter: "情報ID 000000046、双方 DEL_FLG=0", order: "HYJ_SEQ, KEY_ID" }
    - { item: 帳票共有グループ, table: R60_HYO_KYO_GRP_M_TBL,            key: HYO_KYO_GRP_CD,          filter: "DEL_FLG=0", order: "HYO_KYO_GRP_CD" }
    - { item: 帳票参照,     table: R60_CODE_MES_M_TBL,                   key: KEY_ID,                  filter: "情報ID 000000116、DEL_FLG=0", order: "HYJ_SEQ, KEY_ID" }
    - { item: 帳票権限,     table: "R60_HANY_MES_M_TBL × R60_HYO_ACS_M_TBL", key: KEY_ID,             filter: "情報ID 000000051、双方 DEL_FLG=0", order: "HYJ_SEQ, KEY_ID" }
    - { item: ユーザタイプ, table: R60_USER_TYP_M_TBL,                   key: USER_TYP_CD,             filter: "DEL_FLG=0", order: "USER_TYP_CD" }

db_model:
  table: R60_USER_M_TBL
  table_id: ユーザマスタ
  columns_total: 28
  primary_key: [STF_CD]
  operation_flags:
    insert_columns: 0
    update_columns: 15
    delete_columns: 0
    physical_delete: false
    note: "本画面は UPDATE のみ。新規・削除の operation は実装されていない（D-US-01）。"
  update_columns_detail:
    business: [MAIL_ADRS_2, S_CMP_CD, S_JIG_CD, YAK_CD, HYO_KYO_GRP_CD, GRP_KJN_FLG, HYO_ACS_CD, USER_TYP_CD, REG_STS, SEND_STS]
    management: [KSN_KBN, KSN_STF_ID, KSN_DAT, KSN_PGM_ID, REV_NO]
    check: "業務 10 ＋ 管理 5 ＝ 15。項目移送表の更新 ○ と一致。"

key_columns:
  - { name: STF_CD,        label: 社員コード,     len: 8,  note: 主キー }
  - { name: SZK_CMP_CD,    label: 所属会社コード, len: 4,  note: 検索条件・既定ソート }
  - { name: HTR_YMD,       label: 発令日,         len: 8 }
  - { name: STF_NM,        label: 社員日本語名称, len: 30 }
  - { name: SSK_UNIT,      label: 組織ユニット,   len: 8 }
  - { name: MAIL_ADRS_2,   label: メールアドレス２, len: 50, note: 本画面で編集可 }
  - { name: S_CMP_CD,      label: Ｓ会社コード,   len: 4,  note: 経理用会社 }
  - { name: S_JIG_CD,      label: Ｓ事業場コード, len: 4,  note: 経理用事業場。画面の複合キーから 2 番目を保存（D-US-04） }
  - { name: REG_STS,       label: 登録ステータス, len: 1,  note: "5 項目（役割・帳票共有グループ・帳票参照・帳票権限・ユーザタイプ）が揃えば 1" }
  - { name: SEND_STS,      label: 送信ステータス, len: 1,  note: "緊急配信チェックで 9" }
  - { name: KSN_DAT,       label: 更新時刻,        note: 排他チェックの比較対象 }
  - { name: REV_NO,        label: リビジョン,     len: 5,  note: 更新時 +1 }

reg_sts_rule:
  on: "役割・帳票共有グループ・帳票参照・帳票権限・ユーザタイプがすべて選択済み"
  off: "上記のいずれかが未選択"
  source: "14_項目移送表(DB) No16、R60UserController.py set_reg_sts:1442-1458"

design_defects_in_field_sheet:
  - "検索シート No11 組織ユニット名称のエンティティが『部署マスタ.組織ユニット』で、名称ではない（D-US-03）。"
  - "検索シート No30 組織ユニット名称のエンティティが『ユーザマスタ.社員コード』で、名称ではない（D-US-03）。"
  - "検索シート No8 会社のエンティティが『ユーザマスタ.会社コード』。ユーザマスタの列名は SZK_CMP_CD（所属会社コード）である。"
  - "経理用事業場のリストキーが複合値（会社コード + ',' + 事業場コード）だが、移送先 S_JIG_CD は 4 桁のみで、分解規則が設計に無い（D-US-04）。"
  - "マスタ項目シートは『新規・複製操作時』の列が空で、修正・削除のみを定義する（D-US-01 の前提）。"

open_questions:
  - "検索の会社初期値は所属会社（cmp_cd）か S 会社（scmp_cd）か（D-US-02）。"
  - "部署マスタの正式名称は R60_SSK_M_TBL.SEI_NM でよいか（【推測】同一）。"
  - "新規・ダウンロードボタンは設計に機能イベントが無い。残すのか削除するのか。"
