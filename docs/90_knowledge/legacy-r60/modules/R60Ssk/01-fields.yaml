    - { no: 6,  name: Ｓ事業場コード,       column: S_JIG_CD,    length: 4,  insert: "-", update: "○", delete: "-", screen: 経理用事業場, edit: "リスト選択値" }
    - { no: 7,  name: 登録ステータス,       column: REG_STS,     length: 1,  insert: "-", update: "○", delete: "-", edit: "プログラム内設定値" }
    - { no: 8,  name: 送信ステータス,       column: SEND_STS,    length: 1,  insert: "-", update: "○", delete: "-", edit: "固定値 '0':未送信" }
    - { no: 9,  name: 送信区分,             column: SEND_KBN,    length: 1,  insert: "-", update: "-", delete: "-" }
    - { no: 10, name: 論理削除フラグ,       column: DEL_FLG,     length: 1,  insert: "-", update: "-", delete: "-" }
    - { no: 11, name: 登録区分,             column: REG_KBN,     length: 1,  insert: "-", update: "-", delete: "-" }
    - { no: 12, name: 登録者ＩＤ,           column: REG_STF_ID,  length: 10, insert: "-", update: "-", delete: "-" }
    - { no: 13, name: 登録時刻,             column: REG_DAT,                insert: "-", update: "-", delete: "-" }
    - { no: 14, name: 登録プログラムＩＤ,   column: REG_PGM_ID,  length: 20, insert: "-", update: "-", delete: "-" }
    - { no: 15, name: 更新区分,             column: KSN_KBN,     length: 1,  insert: "-", update: "○", delete: "-", edit: "共通仕様参照" }
    - { no: 16, name: 更新者ＩＤ,           column: KSN_STF_ID,  length: 10, insert: "-", update: "○", delete: "-", edit: "共通仕様参照" }
    - { no: 17, name: 更新時刻,             column: KSN_DAT,                insert: "-", update: "○", delete: "-", edit: "共通仕様参照" }
    - { no: 18, name: 更新プログラムＩＤ,   column: KSN_PGM_ID,  length: 20, insert: "-", update: "○", delete: "-", edit: "共通仕様参照" }
    - { no: 19, name: リビジョン,           column: REV_NO,      length: 5,  insert: "-", update: "○", delete: "-", edit: "共通仕様参照" }
  operation_flags:
    insert_columns: []
    update_columns: [S_CMP_CD, S_JIG_CD, REG_STS, SEND_STS, KSN_KBN, KSN_STF_ID, KSN_DAT, KSN_PGM_ID, REV_NO]
    delete_columns: []
    implication: >-
      項目移送表に登録（INSERT）・削除（DELETE）の ○ が 1 つも無い。本画面は
      IDM から受信済みの行を更新するだけであり、新規作成・論理削除は提供しない。
      削除ボタンが初期非活性であることと一致する（D-SS-03）。

field_naming_rules:
  definition_layer: snake_case（YAML / Python）
  interface_layer: camelCase（TS / JSON wire）
  conversion_point: "BaseCamelModel（alias_generator=to_camel）"
  note: "実装の BaseCamelModel は extra='ignore'（骨架規則は 'forbid'）。02-api.yaml / D-SS-04 を参照。"

open_points:
