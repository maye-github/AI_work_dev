  table_name: 部署マスタ
  column_count: 19
  business_key: [CMP_CD, SSK_UNIT]
  business_key_locator: "BP r117-r118（一覧リンクの検索条件）/ r211（更新条件）"
  columns:
    - { no: 1,  name: 会社コード,           column: CMP_CD,      length: 4,  insert: "-", update: "-", delete: "-" }
    - { no: 2,  name: 組織ユニット,         column: SSK_UNIT,    length: 8,  insert: "-", update: "-", delete: "-" }
    - { no: 3,  name: 事業場組織ユニット,   column: JIG_SSK_UNIT, length: 8, insert: "-", update: "-", delete: "-" }
    - { no: 4,  name: 正式名称,             column: SEI_NM,      length: 40, insert: "-", update: "-", delete: "-" }
