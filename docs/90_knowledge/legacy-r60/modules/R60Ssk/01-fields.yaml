  - { no: 2, name: 操作モード, control: ラベル, value: "検索結果一覧リンククリック → 修正" }
  - { no: 4, name: 会社,                 control: ラベル,     source: "部署マスタ.CMP_CD", lookup: "コード値マスタ(明細)(HR会社) 情報ID='000000104'" }
  - { no: 5, name: 事業場組織ユニット,   control: ラベル,     source: "部署マスタ.JIG_SSK_UNIT" }
