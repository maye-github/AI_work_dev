search_conditions:
  - { no: 8,  name: 会社,       input: ドロップダウン, source: "コード値マスタ(明細) 情報ID='000000104'（HR会社）", initial: "ログインユーザの会社", note: "先頭にブランク行。ブランク時は WHERE に加えない" }
  - { no: 9,  name: 組織ユニット, input: テキストボックス, max: 8, match: 前方一致, note: "ワイルドカード入力不要。入力支援は SSK_UNIT + 会社選択値" }
  - { no: 10, name: 組織ユニット検索, input: アイコン, behavior: "一覧型入力支援(択一式)を起動" }
  - { no: 11, name: 正式名称,   input: テキストボックス, max: 40, match: 中間一致, note: "ワイルドカード入力不要" }
  - { no: 12, name: １頁件数,   input: ドロップダウン, note: "標準仕様参照" }

search_result_columns:
  note: >-
    一覧のデータ列は No23-29 の 7 列。No22『送信』は送信ステータスの表示ラベルで、
    列そのものか行ラベルかは抽出範囲では確定できない（画面レイアウトシート未抽出）。
  columns:
    - { no: 22, name: 送信,                 source: "部署マスタ.SEND_STS", lookup: "コード値マスタ(明細)(送信ステータス) 情報ID='000000057', KEYID=SEND_STS", status: "位置づけ未確定" }
    - { no: 23, name: 会社,                 source: "部署マスタ.CMP_CD", lookup: "コード値マスタ(明細)(HR会社) 情報ID='000000104', KEYID=CMP_CD", sortable: true }
    - { no: 24, name: 事業場組織ユニット,   source: "部署マスタ.SSK_UNIT", lookup: 単純移送, sortable: true }
    - { no: 25, name: 組織ユニット：コード, source: "部署マスタ.JIG_SSK_UNIT", lookup: 単純移送, sortable: true }
    - { no: 26, name: 組織ユニット：正式名称, source: "部署マスタ.SEI_NM", lookup: 単純移送 }
    - { no: 27, name: 経理用：会社,         source: "部署マスタ.S_CMP_CD", lookup: 単純移送 }
    - { no: 28, name: 経理用：事業場,       source: "部署マスタ.S_JIG_CD", lookup: 単純移送 }
    - { no: 29, name: 削除,                 source: "部署マスタ.DEL_FLG", lookup: "コード値マスタ(明細)(論理削除) 情報ID='000000063', KEYID=DEL_FLG" }
  naming_caution: >-
    No24 の項目名称は『事業場組織ユニット』だが、エンティティ項目は SSK_UNIT（組織ユニット）。
    No25 は名称が『組織ユニット：コード』で、エンティティ項目は JIG_SSK_UNIT。
    名称と項目の対応が入れ替わって見えるため、実装・移送表と突合して読むこと（D-SS-05）。

