  - "項目移送表は主キー列を持たない。業務キーは BP の検索条件・更新条件から CMP_CD + SSK_UNIT と読んだ。"
  - "『廃止_画面項目内容(入力)』は R60Maker の項目を残したまま廃止されており、R60Ssk の履歴資料としては使えない。"
