search_conditions:
  - { no: 8,  name: 会社,             type: dropdown, condition: 完全一致, initial: ログインユーザーの所属会社 }
  - { no: 9,  name: 事業場,           type: dropdown, condition: 完全一致, initial: ログインユーザーの所属事業場 }
  - { no: 10, name: エリア,           type: dropdown, condition: 完全一致, initial: ブランク }
  - { no: 11, name: ロケーションコード, type: textbox,  condition: 前方一致, initial: 未設定 }
  - { no: 13, name: ロケーション名,    type: textbox,  condition: 中間一致, initial: 未設定 }
  - { no: 14, name: 削除含む,          type: checkbox, condition: チェックなしなら DEL_FLG=0, initial: チェックなし }
  - { no: 15, name: ロケーショングループ, type: dropdown, condition: 完全一致, initial: ブランク }
  - { no: 16, name: ロケーションタイプ, type: dropdown, condition: 完全一致, initial: ブランク }
  - { no: 17, name: １頁件数,          type: dropdown, condition: 明細 情報ID 000000174, initial: 個別項目名10='D' }
  - { no: 12, name: ロケーションコード検索, type: button, role: 入力支援画面 R60PlcSup を起動 }

result_columns:
  sortable: [会社, 事業場, ロケーション：コード]
  groups:
    - { group: キー,     columns: [会社, 事業場, エリア, ロケーション：コード] }
    - { group: 名称,     columns: [ロケーション：名称, ロケーション：略称] }
    - { group: 分類,     columns: [ロケグループ：コード, ロケグループ：名称, ロケタイプ：コード, ロケタイプ：名称, ロケ属性] }
    - { group: 容量・深度, columns: [最大容量(L), 最大容量(KG), 最大深さ, 開始検定深さ] }
    - { group: 管理フラグ, columns: [FIFO, 後残管理, 流量管理, 検尺管理, 検尺検定, 検尺単位, 実／仮区分：タンク, 実／仮区分：サイロ, 複数品目, 受入品目チェック, マイナス在庫, 外貨受入, ALC別在庫管理, 補助材料投入可能, 並び順区分] }
    - { group: 状態,     columns: [削除] }
  count: 31

master_items:
  editable:
    - エリア / ロケーションコード（新規・複製のみ） / ロケーション名称 / ロケーション略称
    - ロケグループ / ロケタイプ / ロケ属性 / 最大容量(L) / 最大容量(KG)
    - FIFO / 後残管理 / 流量管理 / 検尺管理 / 検尺検定 / 検尺単位
    - 最大深さ / 開始検定深さ / 仮想タンク区分 / 仮想サイロ区分
    - 複数品目 / 受入品目チェック / マイナス在庫 / 外貨受入 / ALC別在庫管理 / 補助材料投入可能 / 並び順区分
  label_only:
    - 会社（新規・複製はドロップダウン、修正はラベル）
    - 事業場（同上）
  delete_checkbox: 削除（エンティティは設計上エリアマスタ／論理削除フラグと書かれるが、実装はロケーションマスタ）

db_model:
  table: R60_PLC_M_TBL
  table_id: ロケーションマスタ
  columns_total: 41
  business_key: [CMP_CD, JIG_CD, PLC_CD]
  operation_flags:
    insert_columns: 41
    update_columns: 33
    delete_columns: 33      # 論理削除（DEL_FLG=1 の UPDATE）
    physical_delete: false
  check: >-
    更新 ○ は No4-30（27 列）、No32（DEL_FLG）、No37-41（5 列）で計 33 列。
    No31（SEND_KBN）と No33-36（登録系）は更新対象外。
  survey_note: >-
    reports/module-survey/scores/R60Plc.yaml は『42 カラム』と記録するが、
    項目移送表の実列は No1-41 の 41 列である。調査票の数え方は未確認。本カードは 41 を採る（D-PL-14）。

key_columns:
  - { name: CMP_CD,        label: 会社コード,   len: 4, note: 業務キー }
  - { name: JIG_CD,        label: 事業場コード, len: 4, note: 業務キー }
  - { name: PLC_CD,        label: ロケーションコード, len: 8, note: 業務キー、半角英数大文字と記号 _ - ( ) のみ }
  - { name: ARA_CD,        label: エリアコード, len: 7 }
  - { name: PLC_NM,        label: ロケーション名, len: 24 }
  - { name: PLC_RNM,       label: ロケーション略称, len: 16 }
  - { name: DEL_FLG,       label: 論理削除フラグ, len: 1, note: 本画面の『削除』はこの列を 1 にする UPDATE }
  - { name: REG_STS,       label: 登録ステータス, len: 1, note: 必須 18 項目＋タンク時 6 項目が揃えば 1 }
  - { name: KSN_DAT,       label: 更新時刻, note: 排他チェックの比較対象 }
  - { name: REV_NO,        label: リビジョン, len: 5, note: 更新時 +1 }

conditional_required:
  trigger: ロケーション属性区分 = 02（タンク）
  extra_required: [検尺管理区分, 検尺検定区分, 検尺単位, 最大深さ, 開始検定深さ, 仮想タンク区分]
  note: >-
    設計は同じ条件を箇所により「2:タンク」「02:タンク」と書く。実装は "02" で判定する（D-PL-06）。

deprecated_sheet:
  path: reports/module-survey/R60Plc/design/14_廃止_画面項目内容(入力).txt
  actual_items: 19
  finding: >-
    シート名は『廃止_画面項目内容(入力)』だが、内容はメーカーコード・メーカー日本語名・
    メーカーカナ名・緊急配信・削除で、R60Maker の項目が残っている。
    R60Plc の入力仕様として読んではならない。
  retracted: true

