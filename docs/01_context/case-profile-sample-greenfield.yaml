# ---------------------------------------------------------------------------
# 0. 本ファイルの位置づけ（★既定形態の規範サンプル。実案件ではない）
# ---------------------------------------------------------------------------
# 骨架の既定は build_mode: greenfield（從無到有）である。本ファイルは、その既定形態の案件で
# 案件プロファイル（docs/01_context/case-profile-<案件>.yaml）を起こすときの書式を示す。
# 対になる変種サンプルは case-profile-R60.yaml（build_mode: migration / 既存システムあり）。
#
# 重要: build_mode の宣言は docs/00_plan/coach/<module>/case.yml が唯一の故郷である。
#       本ファイルには書かない（一層一故郷。同一値の二重宣言を作らない＝NFR-1）。

# ---------------------------------------------------------------------------
# 1. スタック（greenfield では「工程04 で我方が提案し人が承認した採用スタック」）
# ---------------------------------------------------------------------------
# greenfield には既存スタックが無い。したがって工程01〜03 の時点ではここは空でよい。
# 工程04（框架・環境構築）で我方が候補を提案し、人が承認した時点で値を記入する。
# 紅线④が求めるのは「承認されたスタックを、以降の人の承認なく変更しない」ことである。
# 承認前の候補を確定値として書かない（紅线③）。
stack: []
# 記入例（値は案件ごとに異なる。以下は書式を示すもので、既定値を意味しない）:
# stack:
#   - component: "<フレームワーク名>"
#     version: "<採用した版>"
#     version_source: "<版を読んだ実ファイル、または採用の判断根拠>"

# ---------------------------------------------------------------------------
# 2. 案件固有の禁止事項・技術定数（★ここに再記述しない — NFR-1 単一ソース）
# ---------------------------------------------------------------------------
# 禁①〜⑤ は全案件共通。greenfield では禁①②（既存資産の改変禁止）は適用対象を持たない。
prohibitions_source: "CLAUDE.md §2（禁止事項 5 条）"
tech_constants_source: ".claude/rules/00-project-global.md"

# ---------------------------------------------------------------------------
# 3. 本案件で新規定義する共通資産の在処（greenfield では既存資産が無い）
# ---------------------------------------------------------------------------
# 工程04 で共通部品を一覧化し、工程05 で本案件の資産として新規定義する。
# 定義後はそれが唯一真源となり、以降の改変禁止はそこに働く。定義前は null でよい。
reused_assets_source: null
frontend_common_root: null
backend_util_root: null

# ---------------------------------------------------------------------------
# 4. 上流（本案件の要求メタ）
# ---------------------------------------------------------------------------
upstream_requirement: null
requirement_context: null
ingest_manifest: null

note: >-
  本ファイルは実案件のプロファイルではない。既定の build_mode: greenfield で案件プロファイルを
  起こすときの書式サンプルである。実案件では本ファイルを複製し case-profile-<案件名>.yaml と
  リネームして記入する。migration 案件の実例は case-profile-R60.yaml を参照。
