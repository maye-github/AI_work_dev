notes: |
  演習の教学号段（R-201 / F-201 / I-301… / L-201 / D-201 / E-201… / TC-201…）は
  ids.yml に登録しない。gate1〜3 は tutorial/ を走査しないため検証は通る。
  gate6（機密走査）は tutorial/ を走査するので、実在の敏感値は一切書かない。

  build_mode: greenfield — 骨架の既定（根拠: `docs/90_knowledge/ppt-deviation-register.md` A-22）。
  本演習は「**從無到有（新規構築）**」として走る。節点 2〜8 の産出は**すべて新規**であり、
  既存システムの実装・設計書を**入力にしない**。

  ★題材の扱い（最も誤解しやすい点）:
    - 題材は実在の R60 案件（`D:\AI_work`）だが、**それは「答案」であって「入力」ではない**。
    - 節点 1 の入力（顧客要求書）は、実在資産から**倒推して作る仮想の要求書**である。
      倒推は `virtual-requirement-author` skill が行い、産出根拠は
      `reports/drill/<module>/provenance.yaml` に台帳として残す。
      **倒推は「節点 1 の入力を作る」ところで止まる。**
    - 要求書を凍結した後、**下流のどの節点も `D:\AI_work` を読み返さない**。
      人版（`D:\AI_work`）を読むのは**事後の対比（`drill-comparator`）だけ**である。
    - したがって既存資産は「**答案の出所**」ではなく「**客户要求的材料**」である（A-22 逐語）。

  本演習の目的は「**同じ画面を AI 全链路で作ったとき、人間が書いた版とどこで分岐するか**」を
  測ることである（`docs/90_knowledge/legacy-r60/07-traceability.md` §6.1）。
  したがって**差分は作業の無駄ではなく測定値**である。

  本画面（R60Login）は**試点 #0（汚染あり）**として扱う:
    - 汚染源 1: 本節点の資料が 2026-10-14 17:44 に一度 migration 版へ書き換えられ、
      現行実装を読んで逆算した（2026-10-15 に撤回。
      `tutorial/R60Login/节点1_需求/_archive-2026-10-14-migration版/` を参照）。
      → **この退避先は 2026-10-26 に削除した**（内容は v1.0.4 承認版に反映済み）。
    - 汚染源 2: 画面カード `docs/90_knowledge/legacy-r60/screens/R60Login.md` の作成時に現行を読んでいる。
    - 汚染源 3（2026-10-20）: ユーザー指示により**隔離セッション**が `D:/AI_work` の設計書・分析資料・実装を読み、
      节点1 の参考答案 `reports/drill/R60Login/answer-key.md` を作成した。
      同ファイルは**鎖の外**に置いたが、同日ユーザーが**一括採用**し、19 件を `02_確認事項一覧.md` と
      `n01.yml` の `open_questions` へ「AI 代拟」として転記した。**本節点の答案は人版由来**である。
      したがって本演習は「AI がどこで人版と分岐するか」の測定ではなく、**流程貫通の実演**として扱う。
    - 汚染源 4（2026-10-21）: ユーザー指示
      「**基本设计书请参考 `D:\AI_work\doc\02_INPUT\50.設計書` 这个文件夹下的文件的内容去写、
      因为基本设计书也是要给客户看的、不要直接把节点1的输出照搬**」により、
      **節点2 が人版の基本設計書（`89_R60Login_共通マスタログイン`）の構成・粒度・表の列構成・
      Excel の体裁を読んだ**。読んだのは**骨格**であり、業務内容（項目・値域・条件・メッセージ）は
      上流 v1.0.4 から取っているが、**「どこに何を書くか」の判断を人版に倣った**ことは事実である。
      上記「節点 2〜8 は `D:\AI_work` を読み返さない」の凍結は、**本件について解除された**（記録として残す）。
    - 汚染源 5（2026-10-23）: ユーザー指示
      「**'未决 5 条全是「客户才有的东西」'先按照历史代码倒推虚拟一版回答、请完善**」により、
      **節点4 が未確定 5 件（OQ-01〜OQ-05）の答案を作るために人版の旧 Struts 実装・現行実装を読んだ**。
      産出は `00_输入模板.yaml` v0.3.0 の `open_questions[].answer` で、**`answer_status` に
      「仮想回答（AI 倒推・人未確認）」と明記**してある（顧客の回答ではない）。
      **`answer_basis` は greenfield の根拠（E1/E3/E4）に使っていない**——`answer-engine.md` §3.2 により
      E2（既存実装の実測）は greenfield の根拠にならないため、`design_handover` の提案根拠は
      上流記述とブラウザ仕様（E4）に置いたままである。
      帰結: **節点4 の「未確定事項を AI が倒推できたか」は測定にならない**（答えを人版から取ったため）。
      また本件により、凍結は**節点4 についても解除された**（記録として残す）。
      仮想答案のうち 3 件（OQ-01／OQ-02／OQ-05）は**上流設計の前提と食い違う**（設計は変えていない）。
      読んだ対象（役割で記録。実ファイル名・部品名は**下流成果物に書かない**——封印検査 seal の規約）:
        旧 Struts — ログイン画面スクリプト、画面遷移設定、共通ユーティリティ、ログ設定、
        画面共通仕様書の該当節（Session 保持時間・画面遷移）。
        現行 Vue／FastAPI — ログイン画面、共通 HTTP 部品、各画面共通のヘッダ部品、ストア初期化、
        設定読込、認証モジュール、DB セッション生成、暗号化処理、デプロイ手順書・コンテナ定義。
      `tutorial/R60Login/节点4_框架构筑/` 配下は seal を PASS させてある（実識別子の引用は無い）。
    - したがって R60Login の対比データは**跨画面の集計に算入しない**（記録はする）。
      真の測定は**第 2 画面以降**（未読の画面）で行う。
      汚染源 4 の帰結として、**節点2 の構成・粒度に関する対比結果（`comparison.md` 節点2）は
      人版との一致を「AI の達成」と読んではならない**——倣った結果である。

  ★ 汚染源 4 の例外: 節点2 の基本設計書 v2.0.0 だけは、**人版設計書の「構成」を読んだ**。
    本文の事実は上流から取っているが、「独立産出」ではない。他の節点は凍結を維持する。

  既存システムの知識庫（**倒推の材料。節点 2〜8 は参照しない**。上記の汚染源 4 の例外を除く）:
    - 唯一の入口: `docs/90_knowledge/legacy-r60/00-index.md`
    - 本画面のカード: `docs/90_knowledge/legacy-r60/screens/R60Login.md`
  `D:\AI_work` は**永久に読取専用**（一切書き換えない。読むだけ）。
