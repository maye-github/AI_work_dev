  answer: '本リリースに含める（ユーザー裁定「都按方案」・2026-10-27）。節点2 承認版 §11 の「ログイン試行 5 回／10 分でロック、10 分後に自動解除」は**承認済み設計**であり、下流に無いのは移送漏れである（規則 02 §9 上流欄位の移送検査）。手順: n09 へ起票済（**BUG-002**・2026-10-27 台帳発番）→ n03 で停止条件と解除条件を詳細設計へ追加
    → n05 で再製造 → n06／n07 に観測を追加 → n08 のリリース判定条件に 1 条追加する。**本リリース判定はこの移送の完了を条件に含む**——移送が終わるまで「リリース可」とは判定できない。'
