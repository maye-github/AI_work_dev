  - q_ref: Q-205
    text: Session 保持方式・タイムアウト・userInfo/mngInfo 項目：Session の保持方式（サーバセッション／Cookie／トークン）、タイムアウト、
      多重ログインの扱い、userInfo／mngInfo の項目定義 （会社・事業場・氏名等の具体項目名・型）、ログアウトが本件対象外かを確認したい。
    kind: question
    category: B
    block: true
    answer: |
      **ご提案（ご承認ください）**：Session は**サーバ側に保持**し、ブラウザには HttpOnly Cookie で識別子のみを持たせる。idle 30 分・絶対 8 時間で失効し、画面の「閉じる」で破棄する。多重ログインは許可する。Session に保持する項目は `userInfo{cmpCd,cmpNm,jigCd,jigNm,stfCd,stfNm}`（6 項目）と `mngInfo{scmpCd,sjigCd,jiKjoKsnFlg,taKjoKsnFlg,loginAcsKais}`（5 項目）の 11 項目とする。**根拠**：ご要望書 §3.4 は「会社・事業場・氏名等」とだけ書き、項目と保持方式を定めていない（E1）。共用端末での放置を防ぐにはサーバ側での失効が必要で（E3）。保持項目をログイン・メニューの処理に必要な最小限に絞ることで、個人情報の保持を抑える（E3）。**測定（歴史資産・2026-10-20）**：旧版はセッション間隔を設定値から読む（実値は資産に無く、30 分は E2 弱）。新実装はログイン情報を localStorage に永続保存し、失効処理を持たない。**絶対 8 時間・「閉じる」で破棄はどの資産にも出典が無い（E4 の提案値）**。**ご承認いただきたい点**：①保持方式（サーバ Session＋HttpOnly Cookie）②期限（idle 30 分・絶対 8 時間）③多重ログインの許可 ④保持項目 11 件の過不足。
    answered_by: "SE-001"
    answered_at: "2026-10-20"
