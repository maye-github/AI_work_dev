  - q_ref: Q-207
    text: 稼働状態チェックの判定方式と各端点の挙動：§3.7 の「オンライン利用が許可されていない状態」の判定方式 （フラグ、テーブル、共通 API、日時帯など）を確認したい。
      3 端点すべてで前処理するとあるが、不可時の応答コードと画面挙動 （init／login／generateUrl で同じか）も確認したい。
    kind: question
    category: B
    block: true
    answer: |
      **ご提案（ご承認ください）**：稼働可否は**システム共通の稼働フラグ**で判定する。フラグが有効のときのみ利用可とし、それ以外・データなし・例外は不可とする。3 つの処理（初期表示・ログイン・URL 出力）すべてで前処理として確認し、不可時は HTTP 403 と「オンライン利用エラー」区分を返してオンライン利用エラー画面へ遷移させる。**根拠**：ご要望書 §3.7 は「稼働状態をチェックする」とするが、判定方式と不可時の応答が未規定（E1）。フラグ方式は運用者が任意の時点で停止・再開でき（E4）、3 処理で挙動を揃えることで利用者の混乱を防ぐ（E3）。**ご承認いただきたい点**：判定をフラグ方式とすること、およびフラグの所在（貴社共通基盤に合わせる）。
    answered_by: "SE-001"
    answered_at: "2026-10-20"
