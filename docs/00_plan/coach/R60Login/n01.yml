  - q_ref: Q-215
    text: 平文 stfCd と http URL の通信セキュリティ：/generateUrl は平文の社員コードをリクエストで受け、生成 URL は http://
      形式である。 ①通信は HTTPS 必須か、アプリ層の暗号化のみでよいか。 ②URL を http 固定とするか、環境により https とすることも許容するか。
      ③ログイン試行の回数制限・ロックは必要か。 ④パスワード関連が対象外のため、社員コードのみでログインする仕様と理解したが、 これが意図どおりか（なりすまし対策は別層か）。
    kind: question
    category: B
    block: true
    answer: |
      **ご提案（ご承認ください）**：①API 通信は **HTTPS 必須**（開発環境のみ http を許容）。②生成 URL の scheme は**環境設定で切り替え**（本番は https）。③ログイン試行は **5 回／10 分でロック**し、10 分後に自動解除する。④社員コードのみのログインはご要望書どおりとし、なりすまし対策はネットワーク層・端末認証に委ねる。**測定（歴史資産・2026-10-20）**：**5 回／10 分は弊社の提案値**であり、要求書・設計書・単測・実装のいずれにも出典が無い（E4）。実装にも回数制限・ロック・自動解除の処理は無い。**根拠**：ご要望書 §3.6・§4.4 は遷移 URL を http 形式で示すが、通信の保護と試行制限が未規定（E1）。平文の社員コードを送る以上、通信路の保護は必須であり（E3・機密紅線の趣旨）、試行制限は総当たりへの一般的な対策（E4）。**ご承認いただきたい点**：HTTPS 必須化・URL スキームの環境切替・試行制限の値。
    answered_by: "SE-001"
    answered_at: "2026-10-20"
  - q_ref: Q-216
    text: 当日鍵の有効期限・タイムゾーン・日跨ぎ：「当日の日付（yyyymmdd）を鍵の材料に用いる」「当日内でのみ有効」の 基準タイムゾーン（JST か UTC
      か）と日跨ぎの扱い （前日生成 URL の復号失敗を業務エラーとするか）を確認したい。 システム日時の表示も同じタイムゾーンか。
    kind: question
    category: C
    block: false
    answer: |
      **裁定**：当日鍵は**サーバのローカル日付（JST）を `yyyymmdd` で**使用する。鍵は当日内のみ有効で、翌日は復号失敗として業務エラー（Session エラー）とする。画面表示の時刻も同じ時刻系に揃える。**根拠**：日付の取得元をサーバに一本化しないと、端末時刻のずれで復号が不一致になる（E3）。日跨ぎをエラーにするのは、鍵の有効期間を 1 日に限定する方式の帰結である（E4）。
    answered_by: "SE-001"
    answered_at: "2026-10-20"
  - q_ref: Q-217
    text: 初期表示/API 失敗時の画面挙動と Session エラー画面遷移の主体：初期表示で /init がシステムエラーになった場合、画面は何を表示し、再試行できるのか。
      ログイン失敗（errorCode "1"、復号失敗、稼働不可）のときに 「Session エラー画面へ遷移する」のはクライアントかサーバか。 遷移時に渡すエラー情報は何か。
    kind: question
    category: C
    block: false
    answer: |
      **裁定**：初期表示の失敗→**システムエラー画面**、`errorCode="1"`・復号失敗→**Session エラー画面**、稼働不可→**オンライン利用エラー画面**へ遷移する。**遷移主体はクライアント**（errorCode／HTTP status を判定）。初期表示の失敗時は**自動再試行せず**、システムエラー画面に「再読み込み」ボタンを表示する。3 回連続で失敗した場合は運用ログに記録し、システムエラーとして扱う。**根拠**：ご要望書 §3.4・§5 は遷移先を定めるが遷移主体を定めていない（E1）。サーバは判定結果を返すことに徹し（E3）、自動再試行を入れないのは稼働不可時に負荷を増やさないため（E4）。
    answered_by: "SE-001"
    answered_at: "2026-10-20"
  - q_ref: Q-218
    text: システム日時の取得元・更新頻度と閉じる確認文言：#2 システム日時の①取得元（サーバ時刻かクライアント時刻か）、 ②更新頻度（秒刻みか初期表示のみか）、③12/24
      時間表記、④タイムゾーンを確認したい。 また、閉じるボタンの確認メッセージの標準文言を提示されたい。
    kind: question
    category: C
    block: false
    answer: |
      **裁定**：日時表示は **`YYYY/MM/DD HH:mm:ss`・24 時間制・1 秒更新**とし、**クライアント端末の時刻**を用いる。画面を閉じる際の確認文言は「**画面を終了してよろしいですか？**」とする。**根拠**：表示形式と文言は当方の表記の決め事であり、顧客の業務判断を伴わない（E3）。サーバ時刻の取得は毎秒の通信を生むため、表示用途では端末時刻を用いる（E4）。
    answered_by: "SE-001"
    answered_at: "2026-10-20"
