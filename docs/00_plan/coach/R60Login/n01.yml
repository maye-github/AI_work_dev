    kind: question
    category: B
    block: true
    answer: |
      **ご提案（ご承認ください）**：ログイン成功時は**新規ウィンドウ／タブ**で選択画面を開く。遷移先は画面 ID を本システムの画面ルートに解決し、シミュレーション版は末尾の区分を除いたうえで区分をクエリに付す。**権限区分は URL に載せず**、ログイン後の保持領域で引き継ぐ。**根拠**：ご要望書 §3.5 は「選択された画面を開く」とするのみで、方式・遷移先 URL の形式・権限区分の受渡しが未規定（E1）。ログイン画面を残して業務画面を並べる運用が一般的であること（E4）、URL に権限区分を載せないことが改変による権限昇格を防ぐこと（E3）による。**ご承認いただきたい点**：①新規ウィンドウ方式 ②権限区分を URL に載せないこと。
