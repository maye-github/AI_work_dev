  - q_ref: Q-201
    text: 暗号化方式の互換仕様：§4.5 は「方式および鍵の運用は貴方の提案」とする一方、§3.6 は 「他システムが本 URL を組み立てて遷移してくる」ため互換必須とする。
      他システムが既に暗号化社員コードを生成しているなら、方式は当方提案だけでは決められない。 既存の暗号化仕様（アルゴリズム、鍵長、鍵の導出、文字コード、URL
      エンコード、パディング）を 提示されたい。併せて、当方提案方式を他システム側が実装するのか、 既存方式に当方が合わせるのかを確認したい。
    kind: question
    category: A
    block: true
    answer: |
      既存互換方式は **「各桁を+1（先頭桁はゼロ埋めなし、2桁目以降は2桁ゼロ埋め）→ 4桁超は先頭4桁と後続に分割 → 各ブロックの変換値に当日 `yyyymmdd` を整数加算 → 5桁以上は `_` で連結」**。例（架空の値）：`1234567` / `20251201` → `22281606_20311909`。復号は `R60_DECRYPTION_FNC`。**AES-256-ECB ではない。** **実装分担（AI 合理案）**：本案件の新規実装が既存方式に合わせ、他システム側の変更は求めない。URL のパラメータ順は `stfCd`→`stfKbn`→`gmnId`→`kgnKbn` 固定。
    answered_by: "SE-001"
    answered_at: "2026-10-20"
