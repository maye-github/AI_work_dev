    answer: "提案（顧客の承認を要する・B）：①アプリ側は stdout に JSON Lines（1 行 1 事象）を書くだけで、自前のログ基盤を持たない。②収集と保存は顧客の既存ログ基盤に委ねる。顧客に基盤が無い場合はコンテナ標準出力の輪転で 1 年保存する。③運行ログの項目は 5 つに固定する——時刻・画面 ID・結果コード・インスタンス ID・要求 ID。暗号化値と平文の社員コードは書かない（rules/01 §12）。根拠：E4（logs as event streams）＋E3（骨架規則にログ規定が無い）。"
