  - ref: OQ-02
    text: "顧客の共通基盤の Session 管理 API の仕様（Session 破棄要求の URL・方式・認証・応答形式）。"
    block: "backend の破棄要求実装／L-208 ステップ 3／infra の共通基盤への到達経路"
    answer_status: "仮想回答（AI 倒推・人未確認）"
    answer: |
      破棄要求の API は存在しない。「閉じる」は confirm の後に window.close() するだけで、
      HTTP 通信・トークン破棄・Cookie 削除をしない。サーバ側の session invalidate／logout の実装は無い。
      Auth0 の logout() は定義済みだが未使用（Auth0 初期化自体が main.ts でコメントアウトされている）。
      旧 Struts も parent.window.close() のみで、実効的な破棄は 120 分のタイムアウトだった。
      仮に Auth0 を使う場合の形は GET https://DOM_1/v2/logout（client_id／returnTo、Cookie 認証、
      成否は returnTo への到達で判定）。
    answer_basis: |
      現行: ログイン画面の「閉じる」処理・認証モジュールの logout 定義・アプリ初期化／
      旧: ログイン画面スクリプト・画面共通仕様書 E87。読取元は人版資産（**汚染源 5**）。
    confidence: "高（現行実装）／中（Auth0 採用時の形）"
    design_gap: |
      本設計の L-208 は「共通基盤の Session 管理 API へ破棄要求する」を前提にしている（裁定 Q-232）。
      **実測にはその相手が存在しない。** 実案件でも破棄要求の相手が無い可能性が高い。
      本設計は変えない。軽重は人が裁定する。
    answered_by: "AI 代行（仮想答案・人による確認前）"
    answered_at: "2026-10-23"

  - ref: OQ-03
    text: "ログ基盤の提供元（顧客の既存ログ基盤へ送出するのか、当方が観測基盤を持つのか）と、運用ログの保存期間（上流に規定なし）。"
