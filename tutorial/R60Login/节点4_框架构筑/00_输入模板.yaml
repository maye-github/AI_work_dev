    answer: |
      設定ファイル .env 由来の環境変数のみで、KMS／キーストア／OS 資格情報／Secrets Manager は不使用。
      DB パスワードは DB_PASSWORD を pydantic-settings が .env から読み、接続文字列は実行時に組み立てる。
