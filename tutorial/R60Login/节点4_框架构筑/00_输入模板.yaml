# 【输入来源】上一节点承認版
source_design:
  file: tutorial/R60Login/节点3_详细设计/05_承認版_详细设计书.md
  version: "1.0.0"
  status: baselined
  logic_ids: [L-201, L-202, L-203, L-204, L-205, L-206, L-207, L-208]
  data_ids: [D-201, D-202, D-203, D-204, D-205]
  notes: |
    節点3 承認版（2026-10-23・SE-001 承認）は L-201〜L-208／D-201〜D-205／SQL-1〜SQL-6／
    E-201〜E-210／境界値 B-01〜B-43 を持つ。本節点は**上流の設計値を変更しない**。
    本節点が決めるのは「スタック・環境・依存・ビルド・CI・機密の扱い」だけである。
    **技術スタックは節点3 で確定していない**（節点3 §9「技術スタックは本書で確定しない」）。
    したがって、ここが選型の本体である（紅线④）。

# 【技术栈】
#   ★greenfield（本演習）: ここが選型の本体。4 件はいずれも**当方の提案**であり、
#     `approved_by` に人の識別子が入るまで**確定にしない**。
#     grounds は「どの設計事実を満たすための選型か」を書く。設計から導けない部分は
#     「一般論（E4）」と明記した（製品行・ライブラリ品種そのものの選定）。
tech_stack:
  selection_mode: greenfield（本節点が選型節点。以下は全て**提案**であり承認前は確定でない）
  frontend:
    proposal: "Vue 3（Composition API + `<script setup>`）+ TypeScript + Vite + PrimeVue + Pinia"
    status: 提案（承認待ち）
    grounds:
      - "I-306／I-307 はドロップダウン、I-310 は入出力テキスト（表示 120 桁・超過分は表示上スクロール）、I-308／I-311 は候補 0 件で非活性、I-301 は背景色を持つ → 選択部品・入力部品・ボタン活性制御・ダイアログ・配色変更を一式持つ UI 基盤が要る（05 §4.1・§7.4 B-22）。"
      - "端点フィールドは camelCase、物理列は snake_case、I-307 は画面 `Y`／`N` に対し内部値 `1`／`0`（05 §4.1・§4.4）→ 3 系統の符号を取り違えないよう、型で縛れる TypeScript を採る（`strict` 有効）。"
      - "エラー区分の判定と 4 画面への振り分けは**クライアントが主体**である（05 §6.3・§2.5）→ 3 端点の応答（`errorCode`／HTTP status）を見て遷移する層をクライアントに置く。"
      - "L-207 の 3 部品（`subCheckSubmit`／`subSetSubmitFlg`／`subInitSubmitFlg`）は**本案件で新規定義**する（05 §2.8 ステップ 1・8・9、§8.5）→ クライアント共通部品を置けるモジュール構成が要る。"
      - "入力の正規化（trim しない・全角→半角・非 ASCII 除去）は L-207 の**1 箇所だけ**で行う（05 §8.4）→ 共通関数 1 本に閉じられる構成にする。"
      - "Session 識別子は HttpOnly Cookie で、**クライアントは読まない**（05 §8.2）→ 認証ヘッダを自前で組まず、ブラウザ標準 Cookie で送る（同一オリジン配信を前提・一般論（E4））。"
      - "I-302 は画面表示中 1 秒ごとにクライアント端末の時刻へ更新する（05 §4.1）→ クライアント側タイマーで実装する。"
      - "対応ブラウザは Chrome／Edge の最新 2 バージョン、解像度 1280×800 以上、同時利用 100、ログイン応答 3 秒以内（95 パーセンタイル）（節点2 §11）→ ビルド対象を最新 2 バージョンに絞れ、旧ブラウザ向けポリフィルを持たなくてよい。"
      - "本画面は 1 枚であり、遷移先 URL はサーバが組み立てて返す（05 §2.6・§2.5）→ クライアント側ルータは不要。品種（Vue／PrimeVue／Pinia）の選定自体は設計からは決まらない（**一般論（E4）**。要件は上記 8 点までである）。"
    notes: |
      Pinia を採る理由は「ログイン成立の有無をクライアントが保持する」（05 §2.9 ステップ 2）と
      共通部品の状態を 1 箇所に置くためである。**`kgnKbn` の保持は Pinia ではなくブラウザ保存**である
      （新規タブへ引き継ぐ必要があるため。`design_handover` HO-04）。
  backend:
    proposal: "Python 3.12 + FastAPI + Pydantic v2 + SQLAlchemy Core（`text()`。ORM マッピングは使わない）+ oracledb（Thin）"
    status: 提案（承認待ち）
    grounds:
      - "**SQL は明示的に手書きし、値はすべて `:name` のバインド変数**で受ける。列名・表名を利用者入力から組み立てず、動的ソートも無い（白名单は適用対象が無い）（05 §5.1 #1〜#6）→ **ORM の自動生成に委ねない**構成が要る。SQLAlchemy Core の `text()` は SQL 本文をそのまま保持し、バインドと接続プールだけを使う。"
      - "3 端点・すべて POST・JSON 応答（`errorCode`／`errorDetailCode`）に加え、E-203／E-206 は **HTTP 403**（05 §1.3・§6.1）→ status と本文を明示制御できる HTTP 層が要る。"
      - "URL の組立と 150 桁判定は**サーバ**が行う（05 §2.6・裁定 Q-233）→ scheme／host／port／context を環境設定から読む（値は本ファイルに書かない）。"
      - "Session は**サーバ側保持**・11 項目・idle 30 分／絶対 8 時間・多重ログイン許可・識別子のみ HttpOnly Cookie（05 §8.2）→ サーバ側ストアと Cookie 発行が要る。破棄の要求先は**顧客の共通基盤の Session 管理機能**で、本画面専用の端点を追加しない（05 §2.9 ステップ 3・§10.5・裁定 Q-232）。"
      - "L-206 は同一入力＋同一日付で同一出力であり、乱数・現在時刻・UUID を埋め込まず、日付は**引数として注入**する（05 §2.7・§8.3。規則 03 §7.1）→ 純粋関数として切り出し、テストで日付を固定できることが要る。"
      - "接口層は camelCase・定義層は snake_case で、未定義項目は拒否する（`.claude/rules/03-design-coding.md` §2・§4）→ 変換を 1 箇所に閉じ、余剰入力を弾ける（Pydantic v2）。"
      - "文字コードは UTF-8、日時は JST（05 §8.4・節点2 §11）→ 明示指定する。DB に日付・時刻を埋め込まない（05 §5.1 #4）。"
      - "ログイン応答 3 秒以内（95 パーセンタイル）・同時利用 100（節点2 §11）→ 非同期 I/O で足りる規模。言語・フレームワークの選定自体は設計からは決まらない（**一般論（E4）**。要件は上記 7 点までである）。"
    notes: |
      ORM のモデル定義は作らない（物理定義は 05 §3 の表・列が唯一真源であり、二重定義を避ける）。
      Session の保持先（プロセスメモリか外部ストアか）は冗長化構成に依存するため `open_questions` に置いた。
  database:
    proposal: "Oracle Database 19c（参照専用の 5 表。エディションは顧客の運用標準に従う）"
    status: 提案（承認待ち。製品＝Oracle・版＝19c は人の指示 2026-10-23 による。エディションは運用標準待ち）
    grounds:
      - "**人の指示（2026-10-23）**: R60 歴史案件の運用標準は Oracle であり、本件もそれに合わせる。greenfield のため設計からは導けない（節点3 は DB 製品を決めていない＝05 §0.3・§3.1・§9）。**この根拠は「設計由来」ではなく「発注元の運用標準の継承」である**（E4。ステップ4 の承認対象）。"
      - "**人の指示（2026-10-23）**: 「最新版ではなく安定した版を選ぶ」→ **19c**。19c は長期サポート系のリリースであり、21c は短期（イノベーション）リリースで既にサポート終了、23ai は新しい。**版の選定は一般論（E4）**であり、顧客の運用標準が 19c でない場合は OQ-05 で確定する（版が変われば §3 の識別子規約とドライバ依存を見直す＝CR）。"
      - "05 §5.1 #1: 値はすべて `:name` の名前付きバインド変数で受ける → **Oracle のネイティブなバインド記法とそのまま一致する**（`?` でも `%s` でもない。変換層を挟まない）。"
      - "05 §3.1: DB 製品依存の大小文字規約はスタック承認後に反映する。Oracle は非引用の識別子を**大文字**へ折畳むため、物理名は**すべて大文字**で作成し、アプリからの参照も大文字で統一する。**名前の実体は変えない**（`STF_MST` 等の名称そのものは 05 §3 のまま）。"
      - "05 §3.1: 型は「文字列(n)／数値(p)／1 桁フラグ」→ `VARCHAR2(n CHAR)`／`NUMBER(p)`／`CHAR(1)` へ写す。**製品固有の型名を設計へ書き戻さない**（05 §3.1 の表現を維持する）。"
      - "05 §3.1・§10.2: 5 表・すべて read・SELECT のみ／SQL-4 の内部結合／PK・UNIQUE（§3.4・§3.9）／`ORDER BY disp_order, gmn_id` の安定順序（§5.3）→ 標準 SQL で足りる。"
      - "05 §5.1 #4・§8.4: 日付・時刻を SQL に埋め込まない／文字コードは UTF-8。Oracle セッションの `NLS_DATE_FORMAT` は **`RR-MM-DD` 固定**（`.claude/rules/00-project-global.md` §2。変更禁止）。"
      - "05 §5.1 #2: 本画面に動的ソートは無く、`ALLOWED_SORT_FIELDS` の適用対象が存在しない。将来ソートを足す場合は設計変更（CR）。ページングも無い（一覧は候補のみ）。"
      - "同時利用 100・ログイン応答 3 秒以内（95 パーセンタイル）（節点2 §11）／参照専用 5 表 → 小規模。版・エディション・バックアップ・監視・ライセンスは顧客の運用標準に従う（未確定 → `open_questions`）。"
    notes: |
      接続は **oracledb の Thin モード**（クライアント端末に Oracle Client を入れない）。
      接続情報（ユーザ・パスワード・ホスト・ポート・SID／サービス名）は環境設定／シークレット管理から注入し、
      本ファイルには書かない（占位 `TBL_1/COL_1@PWD_1:PORT_1/SID_1`）。
      承認後に製品・版が変わる場合は、この規約（大文字）とドライバ依存が変わる＝設計変更（CR）である。
      **PostgreSQL の提案は 2026-10-23 に撤回した**（人の指示）。
  infra:
    proposal: "コンテナ実行基盤 ＋ TLS 終端のリバースプロキシ ＋ dev/stg/prod の 3 環境 ＋ ログ収集基盤（送出は標準出力経由）"
    status: 提案（承認待ち）
    grounds:
      - "API は **HTTPS 必須**（開発環境のみ http 許容）で、URL の scheme は環境設定（05 §8.3・節点2 §11）→ TLS 終端をリバースプロキシに置く。"
      - "当日鍵の日付判定は **JST**（05 §8.4）→ サーバのタイムゾーンを Asia/Tokyo に固定する（I-302 の端末時刻とは別物であり、混同しない）。"
      - "Session 破棄の要求先は**顧客の共通基盤の Session 管理機能**（05 §2.9 ステップ 3・§10.5・裁定 Q-232）→ 共通基盤への到達経路（ネットワーク・証明書）が要る。"
      - "メニューヘッダ・Session エラー画面・オンライン利用エラー画面・システムエラー画面は**顧客の共通基盤が提供**し、本件は呼び出し／遷移のみ（05 §1.2）→ 配置先オリジンが同一か別かで、Cookie と保持領域の方式が変わる（未確定 → `open_questions`／HO-04）。"
      - "アクセスログは**マスク済み**社員コード等を保存 1 年（05 §8.1）→ ログ収集・保存基盤が要る（HO-02）。"
      - "E-203／E-206 は HTTP 403（05 §6.1）→ プロキシが status を改変しないこと。"
      - "同時利用 100・可用性 99.5%（業務時間帯）・応答 3 秒以内（95 パーセンタイル）（節点2 §11）→ 単一リージョン・小規模構成で足りる（**一般論（E4）**）。製品・ホスティングは顧客の運用標準に従う（未確定 → `open_questions`）。"
    notes: |
      ホスト名・接続先・バケット名・テナント名は**社内の別管理**であり、本ファイルには書かない（占位のみ）。
      証跡の保存先・監視の閾値も本節点では決めない（顧客の運用標準に従う）。
  approved_by: ""

# 【需要的环境】（用途のみ。実ホスト名・実 URL・案件番号は書かない）
env_list:
  - env: dev
    purpose: 開発・単体テスト。API は http 許容（05 §8.3）。当日鍵の日付は引数注入して固定（05 §2.7）。マスタはテストデータ（社員コード等は占位 `COL_1`）。ログはローカル標準出力のみ。
  - env: stg
    purpose: 結合総合テスト・受入前確認。本番同等構成（HTTPS・JST・リバースプロキシ）。顧客の共通基盤（4 画面・Session 管理）への接続と、マスク済みアクセスログの送出を検証する。マスタはテストデータ。
  - env: prod
    purpose: 本番。可用性 99.5%（業務時間帯）。アクセスログは 1 年保存（05 §8.1）。実アドレス・実ホスト名は社内の別管理であり、本ファイルには書かない（占位 `IP_1` 等）。
  - env: all
    purpose: 3 環境共通。文字コード UTF-8、サーバのタイムゾーンは Asia/Tokyo（05 §8.4）。環境ごとの値は環境変数／シークレット管理から注入し、コード・リポジトリに持たない。

