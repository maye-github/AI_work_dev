      現行はアクセスログ・操作ログの実装が無い（logging.basicConfig による stderr のみ）。
      マスキングも保存期間の定義も無い。旧 Struts は log4j の RollingFileAppender で
      r60_online_access.log／_operation.log／_error.log の 3 本を出し、1MB×3 世代でローテーションし、
      日数保持の定義は無かった。R60Util.writeLog は受け取った文字列をそのまま出力し、マスキングしない。
      社員番号はログイン後の R60StartAction が平文で操作ログへ出していた。
