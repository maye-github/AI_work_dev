# 【构建/启动配置】
build_settings:
  install: |
    frontend: npm ci
    backend : py -3 -m pip install -r requirements.txt
              （CI は python -m pip install -r requirements.txt。規則 09 のコマンド表記差）
  build: |
    frontend: npm run build（= vue-tsc --noEmit && vite build）
    backend : なし（Python はビルドを持たない。構文検査として py -3 -m compileall -q app）
  start: |
    dev : py -3 -m uvicorn app.main:app --reload --port 8000（バインド先は uvicorn の既定＝ループバック。実 IP は書かない）
    prod: uvicorn をリバースプロキシ配下で起動（TLS 終端はプロキシ）。
          サーバのタイムゾーンは Asia/Tokyo（05 §8.4）。値は起動時に環境変数／シークレット管理から注入。
  required_settings: |
    値は書かない。必要な設定キーだけを列挙する（工程05 の実装時に名前を確定する）。
    - 稼働フラグの共通キー（SQL-1 の :operation_key。05 §5.2・裁定 Q-234）
    - URL 組立用の scheme／host／port／context（05 §2.6・裁定 Q-233）
    - 顧客の共通基盤の 4 画面（メニューヘッダ・Session エラー・オンライン利用エラー・システムエラー）の遷移先
    - 顧客の共通基盤の Session 管理 API の接続先
    - Session の idle／絶対の失効秒数（30 分／8 時間。05 §8.2）
    - シークレット参照名（当日鍵・DB 接続情報。実値・実パスは持たない）
  notes: |
    起動は冪等でなければならない（規則 03 §7.1）。起動時に現在時刻・乱数・UUID を設定値へ埋め込まない。

# 【CI/CD 流水线要点】
cicd:
  gates:
    - "py -3 -m tools.trace_check --strict（必須。**`--skip` による門隙突破を禁止**）。門番は 6 道のまま（`stats.gates_run = 6`）"
    - "CI（ubuntu-latest）では `python -m tools.trace_check --strict`。ローカル（Windows）の `py -3` と表記が違うだけで、同じ検査である（規則 09 §9 のコマンド表記差）"
    - "機密走査は strict に含まれる（gate6）。単独実行は `py -3 -m tools.trace_check --strict --only-check secrets`。**1 件でもヒットしたら commit 禁止**"
    - "単体テスト全緑: pytest（server）＋ vitest run（client）。**テスト 0 件を緑と読まない**（未整備を合格にしない）"
    - "型検査: vue-tsc --noEmit（ビルドより前に失敗させる）"
    - "ビルド: npm run build が零 error（構築ゲート相当。本骨架の門番ではない＝規則 04 §9.1 の G2）"
    - "依存の固定: npm ci と pip の固定バージョンで導入し、lockfile の差分をレビュー対象にする"
    - "**承認前でもゲートを緩めない。** ローカルで通したことを理由に CI 側を外さない（紅线⑥）"
  notes: |
    本骨架が持つ品質ゲートは G1（静的検査）相当のみであり、G2〜G5（構築・Console・スモーク・画像対比）は
    未実装である（`.claude/rules/04-testing.md` §9.1）。上表のビルド／型検査は案件側 CI へ接続する前提の草案であり、
    本骨架の門番（6 道）を増減させるものではない。

# 【密钥/敏感值处理（只写方式，不写值）】
secrets_handling:
  method: |
    方式のみを書く。実値・実パス・接続文字列は本ファイルにもリポジトリにも置かない。
    - 実行時取得: 環境変数（コンテナの secret 注入）又はシークレット管理サービスから**起動時に読む**。
      設定はコードから分離し、DI で渡す。テストは固定値、当日鍵の日付は引数注入（05 §2.7）。
    - 当日鍵: 取得方式＝シークレット管理サービス（種別）から起動時に取得し、プロセスメモリに保持する。
      日付はサーバの JST から決め、L-206 へ**引数として渡す**（05 §2.7・§8.3）。
      **実値・実際の格納先パス・取得 URL は書かない**（格納先の種別までを書く。HO-03）。
    - ログに出さない: 当日鍵・平文／暗号化前後の社員コード実値・Session 識別子・氏名（05 §8.1・§9）。
      アクセスログはマスク済み社員コードのみ（05 §8.1・HO-02）。
    - リポジトリに置かない: `.env`・鍵ファイル・接続文字列（`.gitignore` 済みの経路を使う）。
    - 未確定: シークレット管理基盤の有無・接続方式は顧客の運用標準に依存する（`open_questions`）。
  placeholders: "IP_1 / PORT_1 / PWD_1 / TBL_1 / SID_1 / BUCKET_1 / DOM_1 / KEY_1（規則 01 §1 の占位。実値は書かない）"

# 【约束】
constraints:
  - "greenfield（本演習）: 採用スタックは**人が承認して初めて確定する**（紅线④）。承認前は「提案」と書き、確定として扱わない。`approved_by` が空のまま次工程へ進まない（紅线③）"
  - "承認後のスタックは紅线④の対象である。置換・変更には人の承認（変更環 CR）を要する"
  - "本ファイルは節点3 承認版を入力とし、**上流の設計値を変更しない**（L／D／E／SQL／境界値。05 §2〜§7）"
  - "環境値・機密をファイルに記載しない。実ホスト名・実 URL・接続文字列・バケット名・テナント名・社員コードは占位のみ（規則 01 §1）"
  - "**DB 製品依存の大小文字規約はスタック承認後に反映する**（05 §3.1）。Oracle は非引用の識別子を大文字へ折畳むため、**物理名は大文字**で作成し、アプリからの参照も大文字で統一する。名前の実体（`STF_MST` 等）は変えない"
  - "SQL は明示し、値はすべて `:name` のバインド変数で受ける。列名・表名を利用者入力から組み立てない。動的ソートは無く `ALLOWED_SORT_FIELDS` は適用対象が存在しない（05 §5.1）"
  - "Session はサーバ側に保持し、**識別子のみ HttpOnly Cookie**。idle 30 分／絶対 8 時間・多重ログイン許可・11 項目のみ（05 §8.2）"
  - "当日鍵の実値・格納先パスを書かない（05 §8.3）。ログに当日鍵・社員コード実値・Session 識別子・氏名を出さない（05 §8.1・§9）"
  - "共通部品（暗号化・復号 1 本／`subCheckSubmit`／`subSetSubmitFlg`／`subInitSubmitFlg`）は**本案件で新規定義**する。既存部品の存在を前提にしない（05 §8.5・§9）"
  - "API は HTTPS 必須（開発環境のみ http 許容）。URL の scheme は環境設定から取得する（05 §8.3）"
  - "I-302 はクライアント端末の時刻、当日鍵の日付判定は JST。**両者は別物**として実装する（05 §8.4）"
  - "ルート規約・ログ基盤・当日鍵の取得方式・保持領域の実体は `design_handover`（HO-01〜HO-04）の**提案**であり、承認前は確定値として実装しない（05 §9）"
  - "生成・再実行は冪等であること。現在時刻・乱数・UUID・順序不定の反復を出力へ埋め込まない（規則 03 §7.1）"
  - "顧客の共通基盤（4 画面・Session 管理 API）の仕様は**顧客しか持たない事実**であり、当方で決めない（A。`open_questions`）"

# 【设计移交事项】—— 節点3 §9 末尾の「工程04 へ送る事項」4 件（模板に欄が無いため新設）
#   各項: 提案／根拠／状態／open_questions との対応。**4 件を落とさない。**
design_handover:
  - ref: HO-01
    subject: ルート規約の最終形と、シミュレーション版を区別するクエリ名（Q-223 の範囲）
    source: "05 §2.5 ステップ 2・3／§9「工程04 へ送る事項」1"
    proposal: |
      - 遷移先のルートは `/R60/{gmnId}`（path パラメータ。末尾スラッシュ無し）。
      - シミュレーション版は `GMN_MST.gmn_kbn` を持つ別レコードである。`gmnId` の**末尾 1 文字（区分）を
        除いた値**でルートを解決し、区分はクエリ `gmnKbn=VAL_1` で付す。
      - 遷移 URL のクエリ順は `stfKbn`→`gmnKbn`（`kgnKbn` は URL に載せない）。
    grounds:
      - "05 §2.5 ステップ 2・3: シミュレーション版は末尾の区分を除いた gmnId で解決し、区分をクエリに付す。ルートは `/R60/` ＋ gmnId。**ただし『工程04 のルーティング規約で最終確定』と明記されている**。"
      - "05 §2.5 ステップ 4・上流 §6(10): `stfKbn` のみクエリ、`kgnKbn` は保持領域。したがって遷移 URL に足せるのは区分の 1 個だけである。"
      - "05 §7.9 B-38 の 4 個固定順は **`generateUrl` の表示用 URL** の規則である（05 §2.6）。遷移 URL とは別物なので、ここに 5 個目を足しても B-38 を壊さない。"
    status: 提案（承認待ち）
    open_question_ref: null
    notes: |
      **表記の食い違いを 1 件検出した**（上流は書き換えていない）。節点2 承認版 §1 備考①は
      「画面のルート接頭辞は `/R60Login/`」と書き、05 §2.5 は `/R60/` ＋ gmnId と書く。
      本提案は「`/R60Login/` は API の接頭辞（`/R60Login/init` 等・05 §1.3）、`/R60/` は遷移先の画面ルート」
      と読んで両立させた。**最終判断は人**。決まらないまま実装しない（05 §2.5 分岐 2「上流に規定なし」）。

      **実在実装の実測（参考。greenfield では E2 を根拠にできない）**: `/R60/` は Web アプリの
      コンテキストルート／Struts のアクション接頭辞（全画面共通）で、`/R60Login/` はログイン画面の
      アクション名／物理フォルダ（`Pages/R60Login/`）だった。現行 Vue は `#/R60Login` のハッシュルートで
      `/R60/` 接頭辞を使わない。**本提案の根拠は上流記述の整合のまま**であり、この実測は根拠にしない。
  - ref: HO-02
    subject: ログ基盤（マスク方法・運用ログの送出経路・保存先）
    source: "05 §8.1／§2.3 ステップ 9／§2.9 ステップ 5／§9「工程04 へ送る事項」2"
    proposal: |
      - 送出経路: アプリは**標準出力へ 1 行 1 JSON**（構造化ログ）を出し、収集エージェントが社内ログ基盤へ送る。
        アプリから外部へ直接送らない（送信先が増えると機密の出口も増える）。
      - マスク方法: 社員コード 7 桁は**先頭 1 桁と末尾 1 桁を残し、中間 5 桁を `*`** に置換する（例 `1*****7`）。
        ソルト無しの決定的変換とする（同一利用者の再試行を相関させるため）。氏名は出力しない。
      - 出力する項目: アクセスログ＝時刻・画面ID・権限区分・結果コード・マスク済み社員コード。
        運用ログ（E-204 連続 3 回・Session 破棄失敗）＝時刻・画面ID・結果コードのみ（社員コードは出さない）。
      - 保存期間: アクセスログは 1 年（05 §8.1）。運用ログは上流に規定が無いため、**同じ 1 年**を当方案とする。
    grounds:
      - "05 §8.1: 出力する／しないの別が表で確定している。**マスクの方法だけが本書で決まっていない**（『工程04 のログ基盤で確定する』）。"
      - "05 §2.3 ステップ 9・§2.9 ステップ 5: 運用ログの項目は時刻・画面ID・結果コードのみで、社員コード・Session 識別子を出さない。"
      - "05 §9: ログに当日鍵・社員コード実値・Session 識別子・氏名を出さない（機密紅線）。"
    status: 提案（承認待ち。送出先が顧客のログ基盤か当方の観測基盤か、運用ログの保存期間は未確定）
    open_question_ref: OQ-03
  - ref: HO-03
    subject: 当日鍵の取得方式と格納先 → 「取得する鍵は存在しない」への是正
    source: "05 §2.7（算式 #4）／§8.3／§9「工程04 へ送る事項」3"
    proposal: |
      - **当日鍵に相当するのは「日付（yyyymmdd）」そのものである**（05 §2.7 算式 #4: 各ブロックの
        変換値に当日の yyyymmdd を整数加算する）。したがって**外部から取得する鍵は無く、格納先も無い**。
      - 日付はサーバの JST から取り、L-206 へ**引数として渡す**（テストで固定できる。05 §2.7）。
        日付の取得は 1 箇所に閉じ、他の箇所で再計算しない。
      - シークレット管理の対象は **DB 接続情報のみ**（ユーザ・パスワード・ホスト・ポート・SID／サービス名）。
        マネージドのシークレット管理が使えるならそこへ、無ければ環境変数（コンテナの secret 注入）。
      - 日跨ぎ: 日付が変われば変換結果が変わる。前日生成の I-313 を翌日復号すると業務エラー E-205。
    grounds:
      - "05 §2.7 算式 #4 が当日の yyyymmdd を加算すると定めている → **鍵＝日付**であり、取得も保管も要らない。"
      - "05 §8.3 の『当日鍵の実値・格納場所を本書に書かない』は、**書くべき実値が無い**ことの裏返しでもある。"
      - "05 §2.7・§8.3: 日付は引数注入（テストで固定）。JST・当日内のみ（Q-216）。"
      - "05 §9 の『工程04 へ送る事項 3』は、上記により**設題の前提が空振りしている**。工程04 が決めるのは DB 接続情報の取得方式である。"
    status: 提案（是正版。承認待ち）
    open_question_ref: OQ-04
    notes: |
      **本節点で前提を 1 件是正した**（上流は書き換えていない）。05 §9 は「当日鍵の取得方式と格納先」を
      工程04 の決定事項に挙げているが、05 §2.7 の算式では鍵は日付そのもので、取得する実体が無い。
      節点3 の記述どうしの食い違いであり、**最終判断は人**（設計を直すなら変更環）。
  - ref: HO-04
    subject: 画面の「保持領域」の実体（ブラウザ側の保存方式）
    source: "05 §2.5 ステップ 4・5／§4.1 I-307／§9「工程04 へ送る事項」4"
    proposal: |
      - `kgnKbn`（権限区分）を**同一オリジンの localStorage** に 1 キーで保持する
        （キー名 `r60login.kgnKbn`、値は `Y`／`N`）。
      - 理由: 遷移は新規ウィンドウ／タブであり、**localStorage は同一オリジンのウィンドウ間で共有される**
        （`window.open` に限らず、利用者が手動で開いたタブでも共有される）。sessionStorage は
        **opener 経由の `window.open` でしか複製されない**ため、経路によって引き継げない場合がある。
      - 残留対策: ログイン成立時に必ず上書きし、**画面終了時に明示的に削除する**（前回の権限区分を
        次回起動へ持ち越さない）。`kgnKbn` は **URL に載せない**（05 §2.5 ステップ 4）。
      - 前提: **SCR-202 が同一オリジンであること。** 別オリジンでは localStorage も共有されず、
        URL に載せられない以上、代替の引継ぎ手段が無い。
    grounds:
      - "05 §2.5 ステップ 4: `kgnKbn` は保持領域、`Session` 識別子は Cookie、`stfKbn` はクエリ。**保持領域の実体だけが未決**（§9 の 4 番）。"
      - "05 §4.1 I-307: 遷移時は URL に載せず保持領域で引き継ぐ。"
      - "同一オリジンの localStorage がウィンドウ間で共有されること、sessionStorage の複製が opener 経由に限られることはブラウザ仕様（**一般論（E4）**）。"
    status: 提案（条件付き承認待ち。同一オリジンが前提であり、共通基盤の構成が決まるまで確定できない）
    open_question_ref: OQ-01
    notes: |
      実在実装（参考・E2）は同一オリジンの localStorage に利用者情報を保持し、新規ウィンドウは
      ストア初期化時にそれを読み込んでいた。**greenfield では E2 を根拠にできない**（answer-engine §3.2）
      ため、本提案の根拠はブラウザ仕様（E4）に置いた。実測は「localStorage で引き継げる」ことの傍証である。

# 【未决事项】—— 当方で決められない（顧客の事実・運用標準に依存する）もののみ。
#   `answer` / `answered_by` は**人が埋める欄**である。AI は値を入れない（紅线③）。
open_questions:
  # ★★ 2026-10-23: 下の 5 件は**仮想答案**である（人の指示により人版実装から倒推）。
  #   顧客の回答ではない。`answer_status` で区別し、承認（ステップ3・4）まで確定値として扱わない。
  #   汚染源 5 として `case.yml` に登記した。greenfield では E2（既存実装の実測）を根拠にできない
  #   （`tools/kb-platform/repo/company/standards/requirements/answer-engine.md` §3.2）ため、**設計の根拠には使っていない**。
  - ref: OQ-01
    text: "顧客の共通基盤の仕様（メニューヘッダ・Session エラー画面・オンライン利用エラー画面・システムエラー画面の遷移先 URL と提供オリジン。同一オリジンか別オリジンか）。"
    block: "frontend の遷移方式／HO-04 の保持領域／別オリジンなら CORS と Cookie 属性の設計"
    answer_status: "仮想回答（AI 倒推・人未確認）"
    answer: |
      4 画面はいずれも同一オリジン・同一ウィンドウで、独立した外部基盤ではなかった。
      旧 Struts はメニューヘッダを frameset の head フレームに置き、遷移しない（画面の一部）。
      3 つのエラー画面はサーバ転送で /R60/Pages/R60Common/*.html を表示する。
      現行 Vue 実装は、ヘッダを各画面共通のヘッダ部品（遷移なし）とし、3 つのエラー画面を
