---
document:
  title: "R-201 共通マスタログイン（R60Login）画面 要求構造化表（AI 初稿）"
  doc_type: requirements-structured
  requirement_code: R-201
  requirement_name: "共通マスタログイン（R60Login）画面"
  source_document: tutorial/R60Login/节点1_需求/00_输入_客户需求书.md
  source_title: "共通マスタログイン（R60Login）画面 ご要望書"
  source_version: v2.0
  source_date: "2025-09-12"
  source_sensitivity: 社外秘
  status: draft
  sensitivity: internal
  owner: AI-SE
  version: 0.1.0
  generated_at: "2026-10-19"
  note: >-
    AI 初稿。人による審査・承認前であり、合格・承認ではない。
    原文に無い業務ルールは追加していない。曖昧・矛盾・欠落は open_questions に残した。

requirements:
  - code: R-201
    name: "共通マスタログイン（R60Login）画面"
    summary: >-
      調達・生産系マスタメンテナンス業務の新しい基盤における共通ログイン画面。
      各業務画面に入る前に必ず通る入口であり、業務データは更新しない。
    build_mode: greenfield
    scope_in:
      - "共通マスタログイン（R60Login）の画面"
      - "その API"
      - "遷移先の扱い"
      - "関連共通部品（メニューヘッダ、Session エラー画面）の呼び出し"
    scope_out:
      - "各業務画面（マスタメンテナンス画面群）そのものの構築"
      - "パスワード関連（変更・有効期限・複雑性など）"
      - "メニューヘッダ・Session エラー画面の新規作成"
      - "画面マスタの内容・並び順の保守"
      - "非機能の個別規定（弊社標準に従う）"
    screen_role: "マスタメンテナンス画面へ遷移するためのログイン処理を行う画面"
    target_users: "利用権限保持者のみ"
    usage_frequency: "日次・随時"
    screen_type: "参照ほか"
    preconditions: []
    updates_business_data: false
    exclusive_control_required: false
    reference_check_required: false
    duplicate_check_required: false
    user_identification: "社員コード"

rules:
  - seq: 1
    category: データ更新
    rule: "本画面は業務データを更新しない。参照と画面遷移のみを行う。"
    source: "§1"
    certainty: explicit
  - seq: 2
    category: データ更新
    rule: "排他制御・被参照チェック・重複チェックは不要。"
    source: "§1"
    certainty: explicit
  - seq: 3
    category: 利用者
    rule: "利用対象者は利用権限保持者のみ。"
    source: "§3.1"
    certainty: explicit
  - seq: 4
    category: ログイン判定
    rule: >-
      ログイン可否に用いるのは社員コードの存在（およびその社員が論理削除されていないこと）だけ。
    source: "§3.4"
    certainty: explicit
  - seq: 5
    category: ログイン判定
    rule: "所属・権限・有効期限はログイン可否には用いない。"
    source: "§3.4"
    certainty: explicit
  - seq: 6
    category: ログイン判定
    rule: "社員コードを暗号化して送り、サーバ側で復号して社員の存在を確認する。"
    source: "§3.4"
    certainty: explicit
  - seq: 7
    category: ログイン判定
    rule: >-
      確認できた場合は、会社・事業場・氏名等の情報を Session に保存し、
      後続の業務画面から参照できるようにする。
    source: "§3.4"
    certainty: explicit
  - seq: 8
    category: 入力チェック
    rule: "ユーザーＩＤは必須かつ半角 7 桁。"
    source: "§3.2 #3 / §3.4"
    certainty: explicit
  - seq: 9
    category: 入力チェック
    rule: >-
      桁数・文字種が合わない場合も、ログインさせずエラーとする。
      存在しない社員コードと同じ扱い。
    source: "§3.4"
    certainty: explicit
  - seq: 10
    category: 起動区分
    rule: >-
      起動区分はログインの可否を変えない。用途は遷移用 URL の stfKbn と
      メニュー遷移時の引継ぎの 2 つだけ。
    source: "§3.2 #4"
    certainty: explicit
  - seq: 11
    category: 画面候補
    rule: >-
      画面の候補は画面マスタから取得する。全社共通の一覧であり、利用者ごとに絞り込まない。
      初期値は先頭の候補。
    source: "§3.2 #6"
    certainty: explicit
  - seq: 12
    category: 画面候補
    rule: "候補には同一画面のシミュレーション版（名称の末尾に区分が付くもの）が含まれる。"
    source: "§3.2 #6"
    certainty: explicit
  - seq: 13
    category: 権限区分
    rule: >-
      権限区分は更新あり／更新なし。初期値は更新あり。
      選択した区分は遷移先の業務画面に引き継がれ、その画面での更新操作の可否に用いられる。
    source: "§3.2 #7 / §3.5"
    certainty: explicit
  - seq: 14
    category: 画面遷移
    rule: "ログイン成功時は選択された画面を開き、権限区分を遷移先へ引き継ぐ。"
    source: "§3.5"
    certainty: explicit
  - seq: 15
    category: 画面遷移
    rule: "メニューボタン押下時はメニュー画面へ遷移し、起動区分を引き継ぐ。"
    source: "§3.5"
    certainty: explicit
  - seq: 16
    category: 画面遷移
    rule: "遷移先の特定・遷移方式（同一ウィンドウ／別ウィンドウ）は弊社標準規約による。"
    source: "§3.5 / §3.8"
    certainty: explicit
  - seq: 17
    category: URL 出力
    rule: "URL 出力ボタンで、暗号化した社員コードを含む URL を生成し、画面の URL 欄に表示する。"
    source: "§3.6"
    certainty: explicit
  - seq: 18
    category: URL 出力
    rule: >-
      URL のパラメータの並びと値は指定どおりにする。
      他システムも本 URL を組み立てて遷移してくる。
    source: "§3.6"
    certainty: explicit
  - seq: 19
    category: 稼働状態
    rule: >-
      オンライン利用が許可されていない状態では、ログインさせず業務エラーとして扱う。
      判定は弊社標準規約の方式による。
    source: "§3.7 / §5"
    certainty: explicit
  - seq: 20
    category: API
    rule: "API は 3 端点。すべて POST。パスは /R60Login/<name>。"
    source: "§4.1"
    certainty: explicit
  - seq: 21
    category: API
    rule: >-
      POST /R60Login/init は入力を持たない。初期表示に必要な画面候補・権限区分候補を返す。
      前処理に稼働状態チェックを行う。
    source: "§4.2"
    certainty: explicit
  - seq: 22
    category: API
    rule: >-
      POST /R60Login/login は暗号化済みの社員コードを受け、復号・存在確認を行い、
      会社・事業場・氏名等を返す。
    source: "§4.3"
    certainty: explicit
  - seq: 23
    category: API
    rule: "/login の該当なしは errorCode 1 を返す。他のフィールドは返さない。"
    source: "§4.3"
    certainty: explicit
  - seq: 24
    category: API
    rule: >-
      POST /R60Login/generateUrl は平文の社員コードを受け、
      サーバ側で暗号化して遷移用 URL を返す。
    source: "§4.4"
    certainty: explicit
  - seq: 25
    category: API
    rule: >-
      stfCd の扱いは端点によって逆になる。/login は暗号化済み、/generateUrl は平文。
      混同しないこと。
    source: "§4.4"
    certainty: explicit
  - seq: 26
    category: API
    rule: "社員コードが未入力の場合、/generateUrl は NaN を社員コードとして扱う。"
    source: "§4.4"
    certainty: explicit
  - seq: 27
    category: 暗号化
    rule: >-
      当日の日付（yyyymmdd）を鍵の材料に用い、当日内でのみ有効な値とする。
      復号はサーバ側で行う。
    source: "§4.5"
    certainty: explicit
  - seq: 28
    category: 暗号化
    rule: >-
      §3.6 の遷移 URL の形式と互換でなければならない。
      方式および鍵の運用は貴方の提案による。
    source: "§4.5"
    certainty: explicit
  - seq: 29
    category: エラー
    rule: "正常／業務エラー／システムエラーを区別できること。形式は標準規約による。"
    source: "§5 / §3.8"
    certainty: explicit
  - seq: 30
    category: 共通部品
    rule: "メニューヘッダおよび Session エラー画面は呼び出す。本件で新規に作成しない。"
    source: "§3.8"
    certainty: explicit
  - seq: 31
    category: マスタ
    rule: "画面マスタの内容は別途提供される。本画面は取得して表示するのみ。"
    source: "§3.8"
    certainty: explicit
  - seq: 32
    category: 非機能
    rule: "対応ブラウザ・画面解像度・同時利用数・性能は弊社標準に従う。"
    source: "§3.8"
    certainty: explicit

screen_items:
  - seq: 1
    name: 画面タイトル
    kind: label
    spec: "固定値「共通マスタ　ログイン」を表示する。"
    direction: output
    initial_value: null
    required: false
    source: "§3.2 #1"
    note: "固定文字列（全角スペースを含む）。"
  - seq: 2
    name: システム日時
    kind: label
    spec: "弊社標準規約による。YYYY/MM/DD hh:mm:ss 形式で表示する。"
    direction: output
    initial_value: null
    required: false
    source: "§3.2 #2"
    note: "取得元・更新頻度は Q-218。"
  - seq: 3
    name: ユーザーＩＤ
    kind: textbox
    spec: "社員コードを入力する。半角 7 桁。初期値は空白。入力必須。"
    direction: input
    initial_value: ""
    required: true
    source: "§3.2 #3 / §3.4"
    note: "半角数字のみか英数字かは Q-210 で確認。"
  - seq: 4
    name: 起動区分
    kind: textbox
    spec: "1：本店ユーザー／2：工場ユーザー／3：システム管理者。初期値は 3。ログインの可否は区分によって変わらない。"
    direction: input
    initial_value: "3"
    required: null
    source: "§3.2 #4"
    note: "編集可否・許容値・不正時の扱いは Q-210。"
  - seq: 5
    name: 説明文
    kind: label
    spec: "起動区分の選択肢の説明を表示する。内容は「1：本店ユーザー、2：工場ユーザー、3：システム管理者」。"
    direction: output
    initial_value: null
    required: false
    source: "§3.2 #5"
    note: null
  - seq: 6
    name: 画面
    kind: dropdown
    spec: "遷移先の業務画面を選ぶ。候補は画面マスタから取得する。全社共通の一覧であり、利用者ごとに絞り込まない。初期値は先頭の候補。"
    direction: input
    initial_value: "先頭の候補"
    required: null
    source: "§3.2 #6"
    note: "マスタ仕様・シミュレーション版・0 件時は Q-211。"
  - seq: 7
    name: 権限区分
    kind: dropdown
    spec: "更新あり／更新なし。初期値は更新あり。選択した区分は遷移先の業務画面に引き継がれ、その画面での更新操作の可否に用いられる。"
    direction: input
    initial_value: "更新あり"
    required: null
    source: "§3.2 #7"
    note: "ワイヤ上の値は Y/N（§3.6）。"
  - seq: 8
    name: ログイン
    kind: button
    spec: "初期状態は活性。"
    direction: input
    initial_value: "活性"
    required: false
    source: "§3.2 #8"
    note: "二度押し防止は原文に記載なし。"
  - seq: 9
    name: メニュー
    kind: button
    spec: "初期状態は活性。"
    direction: input
    initial_value: "活性"
    required: false
    source: "§3.2 #9"
    note: null
  - seq: 10
    name: URL
    kind: textbox
    spec: >-
      半角。入力上限 150 文字（値として受け付ける上限）、表示幅 120 文字
      （入力欄の見た目の幅。超える分は表示上スクロールする）。初期値は空白。
      利用者が直接編集できる。URL 出力で生成した遷移用 URL を表示する。
    direction: input_output
    initial_value: ""
    required: null
    source: "§3.2 #10"
    note: "150 文字と生成 URL の矛盾・編集値の扱いは Q-213。"
  - seq: 11
    name: URL出力
    kind: button
    spec: "初期状態は活性。"
    direction: input
    initial_value: "活性"
    required: false
    source: "§3.2 #11"
    note: null
  - seq: 12
    name: 閉じる
    kind: button
    spec: "初期状態は活性。"
    direction: input
    initial_value: "活性"
    required: false
    source: "§3.2 #12"
    note: "確認メッセージの文言は Q-218。"

events:
  - seq: 1
    name: 初期表示
    summary: "画面タイトルの設定、画面ドロップダウンの作成、権限区分ドロップダウンの作成、画面項目の初期表示。"
    endpoint: "POST /R60Login/init"
    source: "§3.3 #1"
    note: "失敗時の画面挙動は Q-217。"
  - seq: 2
    name: ログインボタンクリック
    summary: "§3.4 の判定を行い、成功時は選択された画面を開く（§3.5）。"
    endpoint: "POST /R60Login/login"
    source: "§3.3 #2"
    note: "遷移方式は Q-203。"
  - seq: 3
    name: メニューボタンクリック
    summary: "メニュー画面へ遷移する（§3.5）。"
    endpoint: null
    source: "§3.3 #3"
    note: >-
      原文内で矛盾。§4.1 の表は /login をイベント 2・3 対応とするが、
      同節の注記はイベント 3 は端点を持たないとする。Q-202 で確認。
  - seq: 4
    name: URL出力ボタンクリック
    summary: "遷移用の URL を生成し、画面の URL 欄に表示する（§3.6）。"
    endpoint: "POST /R60Login/generateUrl"
    source: "§3.3 #4"
    note: "未入力時 NaN の扱いは Q-214。"
  - seq: 5
    name: 閉じるボタンクリック
    summary: "確認メッセージを表示したうえで、本画面を閉じる。メッセージの文面は弊社標準規約（§3.8）による。"
    endpoint: null
    source: "§3.3 #5"
    note: "文言・閉じ方は Q-218。"

inputs:
  screen_inputs:
    - item_no: 3
      name: ユーザーＩＤ
      data: 社員コード
      required: true
      format: "半角 7 桁"
      initial_value: ""
      source: "§3.2 #3 / §3.4"
    - item_no: 4
      name: 起動区分
      data: 起動区分
      required: null
      format: "1 / 2 / 3（テキストボックス）"
      initial_value: "3"
      source: "§3.2 #4"
    - item_no: 6
      name: 画面
      data: 画面 ID
      required: null
      format: "画面マスタの候補から選択"
      initial_value: "先頭の候補"
      source: "§3.2 #6"
    - item_no: 7
      name: 権限区分
      data: 権限区分
      required: null
      format: "更新あり／更新なし"
      initial_value: "更新あり"
      source: "§3.2 #7"
    - item_no: 10
      name: URL
      data: 遷移用 URL
      required: null
      format: "半角・入力上限 150 文字・表示幅 120 文字。直接編集可"
      initial_value: ""
      source: "§3.2 #10"
  api_inputs:
    - endpoint: "POST /R60Login/init"
      request_wire: '{"params": {}}'
      fields: []
      note: "入力を持たない（初期表示は入力に依存しない）。"
      source: "§4.2"
    - endpoint: "POST /R60Login/login"
      request_wire: '{"params": {"stfCd", "stfKbn", "gmnId", "kgnKbn"}}'
      fields:
        - wire_name: stfCd
          logical_name: 社員コード
          format: "暗号化済み（画面側で暗号化して送る）"
          note: "サーバ側で復号する。"
          source: "§4.3"
        - wire_name: stfKbn
          logical_name: 起動区分
          format: "1 / 2 / 3"
          note: "サーバ側の用途は Q-212。"
          source: "§4.3 / §3.6"
        - wire_name: gmnId
          logical_name: 画面 ID
          format: "画面マスタの画面 ID"
          note: "サーバ側の用途は Q-212。"
          source: "§4.3 / §3.6"
        - wire_name: kgnKbn
          logical_name: 権限区分
          format: "Y＝更新あり / N＝更新なし"
          note: "サーバ側の用途は Q-212。"
          source: "§4.3 / §3.6"
    - endpoint: "POST /R60Login/generateUrl"
      request_wire: '{"params": {"stfCd", "stfKbn", "gmnId", "kgnKbn"}}'
      fields:
        - wire_name: stfCd
          logical_name: 社員コード
          format: "平文。サーバ側で暗号化する。"
          note: "★/login と逆。"
          source: "§4.4"
        - wire_name: stfKbn
          logical_name: 起動区分
          format: "1 / 2 / 3（そのまま）"
          note: null
          source: "§4.4 / §3.6"
        - wire_name: gmnId
          logical_name: 画面 ID
          format: "画面マスタの画面 ID（そのまま）"
          note: null
          source: "§4.4 / §3.6"
        - wire_name: kgnKbn
          logical_name: 権限区分
          format: "Y / N"
          note: null
          source: "§4.4 / §3.6"

outputs:
  screen_outputs:
    - item_no: 1
      name: 画面タイトル
      content: "固定値「共通マスタ　ログイン」"
      source: "§3.2 #1"
    - item_no: 2
      name: システム日時
      content: "YYYY/MM/DD hh:mm:ss"
      source: "§3.2 #2"
    - item_no: 5
      name: 説明文
      content: "1：本店ユーザー、2：工場ユーザー、3：システム管理者"
      source: "§3.2 #5"
    - item_no: 6
      name: 画面ドロップダウン
      content: "画面マスタの候補（全社共通）"
      source: "§3.2 #6"
    - item_no: 7
      name: 権限区分ドロップダウン
      content: "更新あり／更新なし"
      source: "§3.2 #7"
    - item_no: 10
      name: URL
      content: "URL 出力で生成した遷移用 URL"
      source: "§3.2 #10 / §3.6"
    - item_no: null
      name: エラーメッセージ
      content: "標準規約による（文言は未提供）"
      source: "§3.8 / §5"
  api_outputs:
    - endpoint: "POST /R60Login/init"
      success_wire: '{"errorCode", "pageList": [{"value","label"}], "kbnList": [{"value","label"}]}'
      fields:
        - wire_name: errorCode
          description: "エラーコード。体系は Q-206。"
        - wire_name: pageList
          description: "画面マスタから取得（有効なもののみ）。表示順はマスタの保守による。"
        - wire_name: kbnList
          description: "更新あり／更新なしの候補。値は kgnKbn と同じ符号。"
      failure: "前処理の稼働状態チェック不可は業務エラー。"
      source: "§4.2"
    - endpoint: "POST /R60Login/login"
      success_wire: '{"errorCode":"0", "userInfo": {...}, "mngInfo": {...}}'
      fields:
        - wire_name: errorCode
          description: "0＝成功、1＝該当なし。その他のコードは未定義（Q-206）。"
        - wire_name: userInfo
          description: "項目定義は未提示（Q-205 / Q-208）。"
        - wire_name: mngInfo
          description: "項目定義は未提示（Q-205 / Q-208）。"
      failure: '該当なしは {"errorCode":"1"}。他のフィールドは返さない。'
      source: "§4.3"
    - endpoint: "POST /R60Login/generateUrl"
      success_wire: '{"errorCode":"0", "url": "http://<host>:<port>/R60/Pages/index.jsp?stfCd=…&stfKbn=…&gmnId=…&kgnKbn=…"}'
      fields:
        - wire_name: errorCode
          description: "エラーコード。体系は Q-206。"
        - wire_name: url
          description: "遷移用 URL。パラメータの並びと値は指定どおり。"
      failure: "原文にエラー応答の定義なし（Q-206）。"
      source: "§4.4"
  session_outputs:
