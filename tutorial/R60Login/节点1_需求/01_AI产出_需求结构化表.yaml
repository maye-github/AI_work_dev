      システム日時の表示も同じタイムゾーンか。
    why: >-
      日跨ぎで全 URL が無効になる。タイムゾーンが不定だとテストの境界が決まらない。
    affected_design:
      - "§4.5"
      - "§3.6"
      - "#2"
      - "/generateUrl"
      - "/login"
      - "テストケース"
    ai_provisional_answer: >-
      JST 00:00 切替。日跨ぎは復号失敗→業務エラー→Session エラー画面。表示も JST。
    ai_provisional_category: B
    blocking: false
    status: open
  - q_ref: Q-217
    title: 初期表示/API 失敗時の画面挙動と Session エラー画面遷移の主体
    question: >-
      初期表示で /init がシステムエラーになった場合、画面は何を表示し、再試行できるのか。
      ログイン失敗（errorCode "1"、復号失敗、稼働不可）のときに
      「Session エラー画面へ遷移する」のはクライアントかサーバか。
      遷移時に渡すエラー情報は何か。
    why: >-
      異常時の画面挙動と責務分担が未定義。共通部品の I/F とも関係する。
    affected_design:
      - "イベント 1"
      - "イベント 2"
      - "§5"
      - "Session エラー画面"
      - "共通部品"
      - "テストケース"
    ai_provisional_answer: >-
      クライアントが errorCode を判定し、共通部品の Session エラー画面へ遷移。
      init 失敗はエラーメッセージ＋再試行ボタン。
      遷移時はエラーコードと利用者向けメッセージを渡す。
    ai_provisional_category: B
    blocking: false
    status: open
  - q_ref: Q-218
    title: システム日時の取得元・更新頻度と閉じる確認文言
    question: >-
      #2 システム日時の①取得元（サーバ時刻かクライアント時刻か）、
      ②更新頻度（秒刻みか初期表示のみか）、③12/24 時間表記、④タイムゾーンを確認したい。
      また、閉じるボタンの確認メッセージの標準文言を提示されたい。
    why: >-
      表示仕様と標準文言が未定義。
    affected_design:
      - "#2"
      - "イベント 5"
      - "標準規約"
      - "テストケース"
    ai_provisional_answer: >-
      /init でサーバ時刻を取得し、クライアントで 1 秒ごとに更新。24 時間表記・JST。
      閉じる文言は「画面を閉じます。よろしいですか？」を仮置き。
    ai_provisional_category: B
    blocking: false
    status: open
  - q_ref: Q-219
    title: 非機能（ブラウザ・解像度・同時数・性能）の標準規約
    question: >-
      §3.8 の非機能（対応ブラウザ、画面解像度、同時利用数、性能）の具体値を提示されたい。
      ログイン応答時間の目標、同時ログイン数の想定、対応ブラウザのバージョンを含む。
    why: >-
      非機能は標準規約に従うとあるが、値が提示されていない。テストの合否基準が作れない。
    affected_design:
      - "非機能設計"
      - "結合／総合テスト"
      - "運用"
      - "テストケース"
    ai_provisional_answer: >-
      主要ブラウザ最新版、解像度 1280×800 以上、同時 100 ユーザー、
      ログイン応答 3 秒以内を仮置き。
    ai_provisional_category: A
    blocking: true
    status: open

customer_not_stated_actions:
  - seq: 1
    item: 標準規約一式の受領
    why: "エラー応答・コード体系・メッセージ・ログ・画面遷移・非機能・セキュリティの実体が無い。"
    proposed_action: "顧客に一式の提示を依頼し、受領後に Q-206/207/219 を確定する。"
    suggested_category: A
  - seq: 2
    item: 画面マスタのスキーマとサンプルデータ
    why: "/init の pageList と #6 の候補生成に必須。"
    proposed_action: "スキーマ・有効フラグ・表示順・シミュレーション版区分の提示を依頼。"
    suggested_category: A
  - seq: 3
    item: 社員マスタのスキーマとサンプルデータ
    why: "存在確認・論理削除・Session 保存項目に必須。"
    proposed_action: "テーブル／API 仕様と項目マッピングの提示を依頼。"
    suggested_category: A
  - seq: 4
    item: 既存他システムの URL 組み立て仕様・暗号化仕様
    why: "§3.6 の互換性に必須。"
    proposed_action: "既存方式の提示を依頼（Q-201）。"
    suggested_category: A
  - seq: 5
    item: 共通部品（メニューヘッダ、Session エラー画面）の I/F 仕様
    why: "呼び出し方・引数・遷移方法が未提供。"
    proposed_action: "I/F 仕様書と遷移パラメータの提示を依頼。"
    suggested_category: A
  - seq: 6
    item: 環境ごとの host/port と設定管理方法
    why: "URL 生成に必須。環境差異の管理方法が未定義。"
    proposed_action: "環境別設定ファイル／設定 API の方式を提案。"
    suggested_category: B
  - seq: 7
    item: 入力値の正規化方針
    why: "前後空白、全角→半角、コピー＆ペースト時の扱いが未定義。"
    proposed_action: "前後空白は trim しない／全角は受け付けない等を提案し承認を得る。"
    suggested_category: B
  - seq: 8
    item: 文字コード・URL エンコード・タイムゾーン
    why: "暗号化・URL 生成・日時の境界に影響。"
    proposed_action: "UTF-8、パーセントエンコード、JST を提案。"
    suggested_category: B
  - seq: 9
    item: ログの個人情報マスキング方針
    why: "社員コード・氏名をログに出す可能性がある。"
    proposed_action: "社員コードはマスク、氏名は出力しない案を提示。"
    suggested_category: A
  - seq: 10
    item: テスト環境・テストデータ・受入基準
    why: "結合／総合テストの合否基準が未定義。"
    proposed_action: "テスト環境の提供と受入基準の合意を依頼。"
    suggested_category: A
  - seq: 11
    item: 画面遷移のブラウザ制約
    why: "別ウィンドウ／新規タブはポップアップブロックの影響を受ける。"
    proposed_action: "遷移方式の制約を確認し、必要なら同一ウィンドウ案を提示。"
    suggested_category: B
  - seq: 12
    item: 利用権限の付与・剥奪の運用
    why: "「利用権限保持者のみ」の実現方法が未定義。"
    proposed_action: "運用側で付与する前提を確認し、本画面では判定しない案を提示。"
    suggested_category: A
  - seq: 13
    item: 障害時の運用（稼働状態チェック不可時）
    why: "オンライン不可の判定・連絡・復旧手順が未定義。"
    proposed_action: "運用 Runbook の作成を提案。"
    suggested_category: A
  - seq: 14
    item: 要求書の版管理
    why: "v2.0 が最新か、以降の改訂予定があるか。"
    proposed_action: "最新版と凍結ハッシュの確認を依頼。"
    suggested_category: A
  - seq: 15
    item: 用語の社内標準との突合
    why: "「起動区分」「権限区分」「事業場」の定義が社内標準と一致するか。"
    proposed_action: "用語集との突合結果を提示。"
    suggested_category: B

