open_questions:
  - q_ref: Q-201
    title: 暗号化方式の互換仕様
    question: >-
      §4.5 は「方式および鍵の運用は貴方の提案」とする一方、§3.6 は
      「他システムが本 URL を組み立てて遷移してくる」ため互換必須とする。
      他システムが既に暗号化社員コードを生成しているなら、方式は当方提案だけでは決められない。
      既存の暗号化仕様（アルゴリズム、鍵長、鍵の導出、文字コード、URL エンコード、パディング）を
      提示されたい。併せて、当方提案方式を他システム側が実装するのか、
      既存方式に当方が合わせるのかを確認したい。
    why: >-
      互換性のない方式を選ぶと、他システムからの遷移が全て復号失敗になる。
      方式は設計・製造・結合テストの前提であり、後から変更すると全工程に波及する。
    affected_design:
      - "§4.5 暗号化"
      - "§3.6 URL"
      - "/login"
      - "/generateUrl"
      - "結合総合テスト"
    ai_provisional_answer: >-
      既存方式の提示を待つ。暫定として AES-256-ECB＋yyyymmdd 鍵（社内標準の既存方式）を置き、
      URL エンコードは UTF-8／パーセントエンコードとする。暫定のまま製造に進まない。
    ai_provisional_category: A
    blocking: true
    status: open
