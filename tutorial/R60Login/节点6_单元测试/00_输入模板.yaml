# 【製造差異から引き継ぐ観点（節点5 §6 #3 の 5 件）】
# 受諾は「今は進める」であって「テストしなくてよい」ではない。
residual_risks:
  - risk: 複数インスタンス構成では Session が共有されない（製造差異 #1・#14）
    covered_at: 節点7（IT。単体では観測できない）
  - risk: Session 破棄の失敗がサーバ運用ログに残らない（製造差異 #2）
    covered_at: 節点7（IT）
  - risk: シミュレーション版が常に非シミュレーション版として扱われる（製造差異 #5）
    covered_at: 節点7（IT。I-314 に gmn_kbn が無いため単体では判定不能）
  - risk: 日跨ぎが E-205 ではなく E-201 になる（製造差異 #9・B-33）
    covered_at: TC-215（E-205 の成立）＋節点7（差の受容を断言する IT）
  - risk: 遷移先 URL の環境変数未設定で遷移しない（製造差異 #3・#4）
    covered_at: 節点7（IT）

