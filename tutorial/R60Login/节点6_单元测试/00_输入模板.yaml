# 【测试观点（三类配比）】
# 比率の下限は 正常 3／境界 2／異常 3（規則 04 §2）。本件は E が 10 件あるため異常は 10 件。
test_viewpoints:
  normal:
    - 初期表示が成立する（候補あり・初期値が入る）
    - ログインが成立する（I-316・I-317 を取得し Session を生成）
    - メニューから遷移できる（/login を共用・同一ウィンドウ）
    - URL を出力できる（I-310 に表示）
    - 閉じるで Session を破棄してから画面を閉じる
  boundary:
    - I-303 が 7 桁ちょうど（B-02）
    - I-310 が 150 桁ちょうど（B-20）
    - 暗号化算式の分割境界 5 桁（B-35）
    - 画面候補 0 件（B-22。エラーではない）
    - E-204 の連続失敗が 3 回ちょうど（B-30）
  abnormal:
    - E-201 該当なし（SQL-3 の 0 件）
    - E-202 入力不正（7 桁固定・値域外）
    - E-203 稼働不可（/login・/generateUrl）
    - E-204 画面マスタ取得失敗
    - E-205 復号失敗（不正な暗号化値・日跨ぎ）
    - E-206 稼働不可（/init）
    - E-207 /login の該当なし（応答形式）
    - E-208 ログイン中の DB 障害
    - E-209 /generateUrl の暗号化失敗・設定不備
    - E-210 生成 URL が 151 桁

