# =============================================================================
# 节点7（结合・综合测试）输入模板 —— 文件编号: IN-307
# -----------------------------------------------------------------------------
# 【本节点的输入来自上一节点的哪个文件】
#   ① 节点6 的单元测试结果与用例（TC-201…）
#   ② 节点5 的制造源代码
#   ③ 节点2 承認版 基本设计书（F-201，用于确认端到端口径）
#   单元测试过了不等于能用；本节点验证「前端→API→DB→跳转」整条链路是否贯通。
#
# 【你要填哪些字段】
#   api_sequence …… 调用的 API 顺序与期待
#   e2e_scenarios … E2E 场景（从打开登录画面到跳转成功）
#   frontend_call_chain  前端各层调用链
#   db_transaction_boundary  DB 事务边界（本机能主要是只读）
#   ab_comparison … A/B 比较字段（**migration 案件のみ**。下記 ★参照）
#   human_review_required  必须人拍板的点
#
# 【本节点 AI 会产出什么】
#   结合テスト规格书、综合测试（E2E）场景、验收结果。
#
# 【人必须审查什么】
#   ① 端到端确实贯通（不是只测了单层）；② 期待値の出所が正しい（下記 ★）；
#   ③ 事务边界（本机能只读，不应有意外写）；④ 敏感值不落测试报告。
#
# ★期待値をどこから取るか（build_mode で変わる。規則 04 §7／§7.1）：
#   - migration … **旧版との A/B 比較**。期待値は「旧版の実測値」。結果と健康度閾値は
#       `doc/03_AI/AB_Reports/reports/<module>/summary.md` に**単一箇所で**記録する（値を複製しない）。
#   - greenfield（既定・本演習）… **A/B 比較はしない**（比較対象たる旧版が存在しない）。
#       期待値は「**承認済みの要求（R-201）・基本設計（F-201）の受入基準**」であり、
#       判定は一致比較ではなく**受入基準の充足判定**になる。
#       記録先は `verification.md`（A/B ではないので慣例名 `summary.md` を流用しない）。
#
# 规则：键名一律 snake_case；camelCase（stfCd / gmnId）只在值里。
# =============================================================================

