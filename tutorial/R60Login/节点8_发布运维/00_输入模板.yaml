# =============================================================================
# 节点8（发布・运用保守）输入模板 —— 文件编号: IN-308
# -----------------------------------------------------------------------------
# 【本节点的输入来自上一节点的哪个文件】
#   节点7 的结合・综合测试结果（E2E 合否。migration の場合は A/B 比較の結果も含む）。
#   只有测试全绿、且人做出「发布判定」后，才进入本节点。
#
# 【你要填哪些字段】
#   release_plan ……… 发布步骤（含前置检查/上线窗口）
#   rollback_plan …… 回滚步骤（必须可执行、有时间目标）
#   monitoring ………… 运用监视要点（日志/告警/健康检查）
#   handover …………… 交接物（手册/联络体制）
#   release_criteria  发布判定条件（人拍板）
#   human_review_required  必须人拍板的点
#
# 【本节点 AI 会产出什么】
#   发布步骤书、回滚步骤书、运用手册草案、监视设定要点。
#
# 【人必须审查什么】
#   ① 「发布判定」必须由人做（AI 不能自我放行）；
#   ② 回滚步骤真的能跑、且已演练；③ 手册里无敏感值；
#   ④ 上线窗口与联络体制正确。
#
# 规则：键名一律 snake_case；camelCase 只在值里。敏感值占位化。
# =============================================================================

# ---------- 顶部 7 个固定字段 ----------
---
id: IN-308
type: node-input
req_ids: [R-201]
status: filled
sensitivity: internal
owner: AI-SE
version: 0.2.0

# =============================================================================
# 正文
# =============================================================================

# 【输入来源】
source_tests:
  file: tutorial/R60Login/节点7_结合测试/05_承認版_结合测试规格书.md
  verdict: 未確定（節点7 は承認待ち。**合否は人が判定する**。実施も未了＝実行基盤が未確定）
  note: >
    節点7 の 5 件の未確定のうち「実行基盤」が block: true のままである。
    したがって本節点の release_criteria「結合・総合テスト 全 PASS」は**現時点で充足していない**。
    本節点は「リリース準備物」を作るところまでとし、リリース判定は人が行う。
source_test_cases:
  file: tutorial/R60Login/节点6_单元测试/05_承認版_测试用例集.md
  note: 単体 20 件（設計まで。実行基盤は未確定）
source_design:
  file: tutorial/R60Login/节点4_框架构筑/05_承認版_框架构筑记录.md
  note: スタック（Vue3＋FastAPI＋Oracle 19c）。工程04 の未確定 OQ は下記 open_items を参照
build_mode: greenfield

# 【发布步骤】
release_plan:
  window: 未確定（顧客の運用時間帯に依存。**人が決める**。AI が勝手に決めない）
  preconditions:
    - 節点7 の合否判定が人の識別子で記録されていること（AI の報告は判定ではない）
    - DB 変更が無いことの確認（本機能は参照のみ。DDL/DML を 1 文も発行しない）
    - 稼働状態（オンライン利用可否）の初期値が本番の運用規程どおりであること
  steps:
    - ビルド成果物の配置（backend／frontend）
    - 環境設定の投入（接続情報・URL 生成用の scheme／host／port／context／route）— 値は占位で扱い、リポジトリに置かない
    - スモークテスト: /R60Login/init → /R60Login/login → /R60Login/generateUrl の 3 端点疎通
    - 画面 1 周（初期表示 → ログイン → メニュー → URL出力 → 閉じる）
    - 監視の有効化確認
  smoke_criteria:
    - 3 端点がすべて HTTP 200（E-203／E-206 を除く正常系）
    - 画面遷移が承認済み基本設計の遷移表どおり
    - 業務データ（社員マスタ・画面マスタ）が**変化していない**こと

# 【回滚步骤（可执行 + 有时间目标）】
rollback_plan:
  trigger:
    - ログイン成功率が閾値を下回る（閾値は運用で決める。**AI が数値を決めない**）
    - 3 端点のいずれかが 5xx を返す
    - 業務データに意図しない更新が観測された
  steps:
    - 直前リリースのビルド成果物へ切り戻す
    - 環境設定を直前の値へ戻す（値は占位。切戻し手順書には実値を書かない）
    - Session の無効化（当日鍵に依存するため、切戻し後は再ログインを要する）
    - スモークテストの再実施
  target_time: 15 分以内（判断開始から切戻し完了まで）
  drill: 未実施。**演練していない回滚手順を「演練済み」と書かない**（模板の要求）

# 【运用监视】
monitoring:
  logs:
    - ログイン成功/失敗件数（社員コードは占位のまま。実値をログに残さない）
    - 稼働状態チェックの判定結果（E-203／E-206 の発生件数）
    - Session 破棄要求の成否（設計 §2.9 は失敗時に運用ログ 1 件。実装差あり＝節点5 差異 #2）
    - 3 回連続のシステムエラー時の運用ログ 1 件（E-204・B-30）
  alerts:
    - ログイン失敗が連続 N 件（N は運用で決める）
    - 3 端点の 5xx 検知
    - 稼働状態チェックが不可を返し続ける
  health_check:
    - /R60Login/init の疎通（入力を持たないため最も軽い）
    - 画面マスタ・社員マスタへの参照が成功すること（SELECT のみ）

# 【交接物】
handover:
  documents:
    - リリースノート（本節点で AI が産出）
    - 切戻し手順書（同上）
    - 運用 Runbook（同上）
    - 単体・結合テストの承認版（節点6・7）
  contacts:
    - role: リリース責任者（人の識別子。実名・連絡先は記載しない）
      channel: 社内連絡経路（具体値は書かない）
    - role: 運用一次窓口
      channel: 社内連絡経路（具体値は書かない）

# 【发布判定条件（人拍板）】
release_criteria:
  - 結合・総合テスト 全 PASS（**現時点で未充足**。実行基盤が未確定）
  - 回滚步骤の演練完了（**現時点で未実施**）
  - "`py -3 -m tools.trace_check --strict` が Exit 0"
  - "`docs/**` に `.xlsx` が無いこと"
  - 手册・報告書に敏感値が無いこと（占位のみ）
  - 節点7 の未確定 5 件と節点4 の未確定 OQ が裁定済みであること
  # 2026-10-27 追加（BUG-002 の裁定「n08 のリリース判定条件に 1 条加える」の履行）
  - ログイン試行ロック（節点2 §11・節点3 §2.4.1・境界 B-44〜B-46）が本リリースに含まれ、**結合テストで観測されていること**（**現時点で未充足**。設計 v1.0.5 で移送済み・コード実装済みだが、観測する IT がまだ無い）

# 【人必须拍板的点】
human_review_required:
  - リリース判定そのもの（AI が自己放行しない。紅线③）
  - 回滚步骤が実行可能で、演練が済んでいること
  - 手冊・リリースノートに敏感値が無いこと
  - 上線窗口と連絡体制が正しいこと
  - 節点7 の未確定 5 件（遷移様式・件数差・実行基盤・IT-209 の限界・差異の受容）をどう扱うか
  - 「結合テスト全 PASS」を主張できない現状で、本節点の産出を何と呼ぶか（リリース準備物か、それとも保留か）
