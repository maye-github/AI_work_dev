# 【未决事项】
#   节点2 の未決は 0 件だった。本節点で生じた 4 件は **2026-10-22 に SE-001 が裁定**し、
#   すべて本文へ反映済みである。したがって現在の未決は 0 件。
#   `category` は人が裁定する欄である。AI は値を入れない（紅线③）。
#
#   ── 裁定の記録（SE-001・2026-10-22）────────────────────────────────
#   Q-227 物理名・命名規約（C）
#     表 = 業務対象の英字略号 + _MST（マスタ）/ _TBL（非マスタの共通表）。
#     列 = snake_case（_cd コード / _nm 名称 / _flg 1 桁フラグ / _id 識別子 / _kais 回数 / _order 順序）。
#     論理削除 = del_flg（0=未削除。全表で同名・同義）／業務上の有効・無効 = valid_flg（0=停用）。混用しない。
#     大文字小文字の実装規約は工程04 のスタック承認後に反映する（名前の実体は変えない）。
#     → data_items の table_name / columns、sql_targets に反映。
#   Q-228 Session 破棄要求が失敗した場合（C）
#     画面は閉じ、利用者に追加の提示を出さない。失敗は運用ログ（時刻・画面ID・結果コード。
#     社員コード・Session 識別子は出さない）へ記録する。Session は idle 30 分／絶対 8 時間で失効する。
#     → L-208 の notes と constraints に反映。
#   Q-229 I-317（管理情報 5 項目）の供給元（C）
#     すべて社員マスタから参照取得する（本画面は更新しない）。上流は名称と B 提案の型のみを定めており、
#     本裁定は**供給元**を定めるもので、名称・型は変えない。将来、遷移先画面が別の意味を要求した場合は変更環へ回す。
#     → D-201 の columns と sql_targets の 5 番目に反映。
#   Q-230 E-204 の「3 回連続失敗」の計数単位（C）
#     同一クライアント（同一ブラウザセッション）内の連続 3 回。成功で 0 に戻す。時間窓は設けない。
#     初期表示はログイン前のため利用者では計数できない。
#     → error_detail の E-204 と L-202 の notes に反映。
#   ────────────────────────────────────────────────────────────
