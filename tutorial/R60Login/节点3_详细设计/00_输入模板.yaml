# ---------- 顶部 7 个固定字段 ----------
id: IN-303
type: node-input
req_ids: [R-201]
status: filled
sensitivity: internal
owner: AI-SE
version: 0.3.0

# =============================================================================
# 正文
# =============================================================================

# 【输入来源】上一节点承认版路径
source_design:
  file: tutorial/R60Login/节点2_基本设计/05_承認版_基本设计书.md
  version: "2.0.2"
  function_id: F-201

# 【细化对象机能】
#   出所: 承認版 §1（画面概要）・§5（イベント一覧）・§6（業務処理説明）
target_function:
  function_id: F-201
  name: 共通マスタ　ログイン
  screen_id: SCR-201
  redirect_screen_id: SCR-202   # 遷移先。画面本体は他機能に属し、本機能の製造対象外（承認版 §2）
  process_steps: |
    メインフロー（イベント２ ログイン。順序は固定。承認版 §6 イベント２）:
      ① 稼働チェック → ② 復号（I-313 → 平文）→ ③ 社員検証（未削除の行の有無）
      → ④ 社員情報取得（I-316 / I-317 の生成）→ ⑤ Session 生成 → ⑥ 遷移先の解決と遷移
      ※ クライアント側の入力チェックと暗号化は ① より前に行う。
    イベント１ 初期表示        : 稼働判定 → POST /init → 候補設定（I-314 / I-315）→ 初期値設定
    イベント３ メニュー        : /login を共用（専用端点なし）→ SCR-202 へ同一ウィンドウで遷移
    イベント４ URL出力         : 稼働判定 → 正規化（trim しない・全角除去）→ POST /generateUrl（平文）→ URL 組立 → 表示のみ
    イベント５ 閉じる          : 確認文言 → Session 破棄要求 → 画面を閉じる
  endpoints:                    # 3 端点・すべて POST。パス接頭辞 /R60Login/（承認版 §7.1）
    - init
    - login
    - generateUrl

# 【要拆成几条业务逻辑 L-201…】每条 = 一个可独立实现/测试的处理单位
#   ★番号 L-201〜L-208 は AI 素案。確定は人が行う（ids.yml 発号は人・紅线①）。
logic_list:
  - logic_id: L-201
    name: 稼働判定（共通前処理）
    scope: イベント１・２・４の処理の先頭（承認版 §6「共通前処理」）
    notes: |
      I-320 が有効のときのみ各処理へ進む。無効・データなし・例外のときは HTTP 403・
      errorCode=1・詳細 R60W0004 とし、オンライン利用エラー画面へ遷移する（E-203 / E-206）。
      **ログイン画面に留めない（ログインさせない）。** 稼働判定そのものの例外
      （DB 接続の取得失敗を含む）も稼働不可に区分する（承認版 §6 (0-3)・Q-207）。
  - logic_id: L-202
    name: init 業務（候補取得と初期値設定）
    scope: 承認版 §6 イベント１ (2)〜(7)
    notes: |
      処理順は「稼働判定 → 候補取得 → 初期値設定」。稼働不可のときは候補取得を行わない。
      I-314 が 0 件なら「利用可能な画面がありません」を表示し、I-308 / I-311 を非活性にする（Q-222）。
      1 件以上のとき I-306＝先頭候補、I-307＝Y、I-304＝3 を初期値とする。
      `/init` の失敗（E-204）が**同一クライアント内で連続 3 回**に達したら運用ログに記録する（Q-230）。
  - logic_id: L-203
    name: login 業務（復号〜Session 生成）
    scope: 承認版 §6 イベント２ (4)〜(8)・(11)〜(13)
    notes: |
      サーバは I-313 のみを使用し、stfKbn / gmnId / kgnKbn は検証も保存もせず無視する（Q-212）。
      復号失敗は E-205（Session エラー画面）、社員マスタに未削除の該当行が無ければ E-201
      （応答は E-207 の形式）。Session はサーバ側保持、識別子のみ HttpOnly Cookie。
      ログに暗号化値・平文とも出力しない（承認版 §11）。
  - logic_id: L-204
    name: 遷移先の解決と遷移実行
    scope: 承認版 §6 イベント２ (9)〜(10-1)
    notes: |
      I-306 から画面ルートを解決する。シミュレーション版は末尾の区分を除いた gmnId で解決し、
      区分をクエリに付す（Q-203）。ルート規約 `/R60/` ＋ `gmnId` は **C 裁定だが工程04 の
      ルーティング規約で最終確定する**（Q-223）。遷移は新規ウィンドウ／タブ、開けない場合は
      同一ウィンドウへ切り替える。I-307 は URL に載せず保持領域で引き継ぐ。
  - logic_id: L-205
    name: generateUrl 業務（正規化→暗号化→URL 組立）
    scope: 承認版 §6 イベント４ (2)〜(9)
    notes: |
      I-303 未入力なら文字列 `"NaN"` を社員コードとして扱い入力エラーとしない（Q-214）。
      入力済みなら前後空白は trim せず、全角・非 ASCII を半角へ変換して除去する（Q-210）。
      URL のパラメータ順は stfCd→stfKbn→gmnId→kgnKbn 固定、UTF-8・パーセントエンコード不要（Q-201）。
      150 桁超は切捨てず E-210。利用者の編集値は表示のみに用い、遷移には使わない（Q-213）。
  - logic_id: L-206
    name: 社員コード暗号化・復号（共通処理・1 本に統合）
    scope: 承認版 §10.3（算式の唯一の定義）・§10.2 (a)-1
    notes: |
      算式・境界規則・互換の要求は承認版 §10.3 が唯一の定義。**AES-256-ECB ではない。**
      当日鍵は JST・当日内のみ（Q-216）。ログイン時（復号）と URL 生成時（暗号化）の双方から呼ぶ。
      復号関数は本案件で新規定義する（既存の関数名を前提にしない）。
      当日鍵・平文／暗号化前後の実値・Session 識別子はログに出さない。
  - logic_id: L-207
    name: クライアント入力チェックと二度送信防止
    scope: 承認版 §8.1（単項目チェック）・§8.2（二度送信防止）・§6 イベント２ (1)(2)
    notes: |
      I-303 は半角数字 7 桁固定（1〜6 桁・8 桁以上・数字以外は E-202）。**「最大 7 桁」ではない。**
      E-202 は存在しない社員コードと同じ扱いとし、`/login` を呼ばず E-201 と同一文面を表示する。
      二度送信は subCheckSubmit → subSetSubmitFlg → subInitSubmitFlg（finally で必ず解放）。
      これらの部品は本案件で新規定義する（Q-221＝C）。
  - logic_id: L-208
    name: Session 破棄（閉じる）
    scope: 承認版 §6 イベント５ (2)〜(2-4)
    notes: |
      確認で OK のとき、**Session を破棄してから画面を閉じる**（Q-205・2026-10-22 の人の裁定）。
      ログイン成立前は Session 未生成のため破棄要求を行わない。同一ウィンドウ遷移時は
      本画面が残らないため成立せず、idle 30 分の失効に委ねる。
      **破棄要求が完了できなかった場合は、画面は閉じ、利用者に追加の提示を出さない**（Q-228 の裁定）。
      失敗は運用ログ（時刻・画面ID・結果コード。社員コード・Session 識別子は出さない）へ記録する。
      Session は idle 30 分／絶対 8 時間で必ず失効するため、放置しても無期限には残らない。

# 【要定义的数据模型 D-201】
#   ★承認版 §10.1 の 5 つの論理エンティティを 1 対 1 で受ける。本画面は write を行わない。
#   ★物理名は 2026-10-22 の裁定（Q-227）で確定した。命名規約:
#       表 = 業務対象の英字略号 + _MST（マスタ）/ _TBL（非マスタの共通表）
#       列 = snake_case。_cd（コード）/ _nm（名称）/ _flg（1 桁フラグ）/ _id（識別子）/
#            _kais（回数）/ _order（順序）
#       論理削除 = del_flg（0=未削除。全表で同名・同義）／業務上の有効・無効 = valid_flg（0=停用）
#       両者は意味が違う（行の論理削除 / 業務上の利用可否）ため混用しない。
#       大文字小文字の実装規約（DB 製品依存）は工程04 のスタック承認後に反映する。名前の実体は変えない。
data_items:
  - data_id: D-201
    table_name: STF_MST
    logical_name: 社員マスタ
    access: read
    columns:
      - "stf_cd（社員コード。I-303 / I-316 の stfCd の供給元）"
      - "stf_nm（社員名。I-316 の stfNm）"
      - "cmp_cd（会社コード。I-316 の cmpCd）"
      - "jig_cd（事業場コード。I-316 の jigCd）"
      - "del_flg（未削除判定。0=未削除）"
      - "scmp_cd（I-317 の scmpCd。Q-229）"
      - "sjig_cd（I-317 の sjigCd。Q-229）"
      - "ji_kjo_ksn_flg（I-317 の jiKjoKsnFlg。Q-229）"
      - "ta_kjo_ksn_flg（I-317 の taKjoKsnFlg。Q-229）"
      - "login_acs_kais（I-317 の loginAcsKais。Q-229）"
    notes: |
      社員の存在確認（③社員検証）と社員情報取得（④）の両方で使用。
      **未削除（del_flg=0）の行のみ**を有効とみなす。本画面では更新しない（承認版 §10.1）。
      I-317 の 5 項目も本表から参照取得する（Q-229 の裁定）。上流は名称と型のみを定めており、
      意味の確定ではない。将来、遷移先画面が別の意味を要求した場合は変更環へ回す。
  - data_id: D-202
    table_name: ORG_JIG_MST
    logical_name: 組織・事業場マスタ
    access: read
    columns:
      - "cmp_cd（会社コード）"
      - "cmp_nm（会社名称。I-316 の cmpNm）"
      - "jig_cd（事業場コード）"
      - "jig_nm（事業場名称。I-316 の jigNm）"
    notes: D-201 と結合して I-316 を生成する（承認版 §6 イベント２ (7)）。主キーは cmp_cd・jig_cd。
  - data_id: D-203
    table_name: CD_MSG_MST
    logical_name: コード・メッセージ管理マスタ
    access: read
    columns:
      - "cd_kbn（コード区分）"
      - "cd_val（コード値）"
      - "cd_nm（名称）"
      - "msg_id（メッセージID）"
      - "msg_txt（メッセージ文言）"
    notes: |
      結合キーのコード値は上流 Q-208 の指定による（**本書に再掲しない**）。
      利用者向け文言はメッセージ管理情報から取得する（Q-206）。
      I-317 の jiKjoKsnFlg / taKjoKsnFlg は D-201 から取得する（Q-229 の裁定）。
  - data_id: D-204
    table_name: GMN_MST
    logical_name: 画面マスタ
    access: read
    columns:
      - "gmn_id（画面ID。I-306 の候補値・I-314 の value）"
      - "gmn_nm（画面名。I-314 の label）"
      - "valid_flg（有効フラグ。0=停用）"
      - "disp_order（表示順）"
      - "gmn_kbn（区分。シミュレーション版は別レコードとして候補に含める）"
    notes: |
      候補は「valid_flg が有効な行を disp_order の昇順」。**全社共通の一覧であり、利用者ごとに絞り込まない。**
      59 行は行数の集計値であり、画面数として固定しない（Q-211）。
  - data_id: D-205
    table_name: SYS_CMN_TBL
    logical_name: システム共通テーブル（稼働フラグ）
    access: read
    columns:
      - "cmn_key（共通キー。稼働フラグの行を特定する）"
      - "operation_flg（稼働状態フラグ。I-320）"
    notes: |
      稼働判定（L-201）の唯一の情報源。有効のときのみ利用可（Q-207）。
      0 件・無効・例外はいずれも稼働不可として扱う。

# 【需要落 SQL 模板的步骤】
#   ★SQL の表名・列名は上記 data_items（Q-227 の裁定）に一致させる。設計変更なしに変えない。
#   ★値はすべて :BIND で受ける（実値・実コードを埋め込まない）。
sql_targets:
  - step: 共通前処理（イベント１・２・４の先頭）① 稼働判定
    sql_placeholder: |
      -- 稼働状態フラグ（I-320）を取得する。0 件・無効・例外はすべて稼働不可（E-203 / E-206）。
      SELECT operation_flg
        FROM SYS_CMN_TBL
       WHERE cmn_key = :operation_key
  - step: イベント１ (3) /init 画面候補の取得（I-314 / I-315）
    sql_placeholder: |
      -- 画面候補は有効行のみ・表示順の昇順。全社共通（利用者で絞り込まない）。
      SELECT gmn_id, gmn_nm
        FROM GMN_MST
       WHERE valid_flg = :valid
       ORDER BY disp_order, gmn_id
  - step: イベント２ (6) ③ 社員検証（未削除の行の有無）
    sql_placeholder: |
      -- 未削除（del_flg=0）の該当行が 1 行でもあれば存在とみなす。
      -- 0 件は E-201（応答は E-207 の形式）。
      SELECT 1
        FROM STF_MST
       WHERE stf_cd = :stf_cd
         AND del_flg = :not_deleted
  - step: イベント２ (7) ④ 社員情報取得（I-316 の 6 項目の生成）
    sql_placeholder: |
      SELECT s.stf_cd, s.stf_nm,
             o.cmp_cd, o.cmp_nm,
             o.jig_cd, o.jig_nm
        FROM STF_MST s
        JOIN ORG_JIG_MST o
          ON o.cmp_cd = s.cmp_cd
         AND o.jig_cd = s.jig_cd
       WHERE s.stf_cd = :stf_cd
         AND s.del_flg = :not_deleted
  - step: イベント２ (7) I-317（管理情報 5 項目）の生成
    sql_placeholder: |
      -- Q-229 の裁定: I-317 の 5 項目は社員マスタから参照取得する（本画面は更新しない）。
      -- 実装上は上の I-316 取得クエリと同一の往復にまとめてよい（結果は同じ）。
      SELECT scmp_cd, sjig_cd, ji_kjo_ksn_flg, ta_kjo_ksn_flg, login_acs_kais
        FROM STF_MST
       WHERE stf_cd = :stf_cd
         AND del_flg = :not_deleted
  - step: エラー表示時のメッセージ文言取得（クライアント側・Q-206）
    sql_placeholder: |
      -- 利用者向け文言の実体はメッセージ管理情報から取得する（承認版 §9.2）。
      SELECT msg_txt
        FROM CD_MSG_MST
       WHERE msg_id = :error_detail_code

# 【每个 E-20x 的分支条件与迁移】
#   出所: 承認版 §9.1（エラー一覧）・§9.2（文面方針）・§6
error_detail:
  - error_id: E-201
    condition: 社員マスタに未削除の該当行がない（③ 社員検証で 0 件）
    next_action: ログインさせない。Session エラー画面へ遷移（クライアント判定）。応答は E-207 の形式
  - error_id: E-202
    condition: I-303 が半角数字 7 桁固定に合致しない（1〜6 桁・8 桁以上・数字以外）
    next_action: E-201 と同じ扱い（存在しない社員と同じ）。クライアント検出時は API を呼ばず同一文面を表示。`/generateUrl` で検出した場合は 1／R60W0001 を返す
  - error_id: E-203
    condition: I-320 が無効・データなし・例外（/login・/generateUrl の前処理）
    next_action: HTTP 403。オンライン利用エラー画面へ遷移。社員の存在有無に依存しない文面。ログイン画面に留めない
  - error_id: E-204
    condition: 画面マスタの取得に失敗（イベント１）
    next_action: システムエラー画面へ遷移。自動再試行しない。「再読み込み」ボタンを表示。**同一クライアント（同一ブラウザセッション）内で連続 3 回**失敗したら運用ログに記録する（Q-230。成功で 0 に戻す・時間窓は設けない。ログは時刻・画面ID・結果コードのみで、未ログインのため社員コードは無い）
  - error_id: E-205
    condition: 復号失敗（入力 I-313 が不正な暗号化値・当日鍵の日跨ぎ）
    next_action: Session エラー画面へ遷移。翌日は業務エラー（Q-216）。ログに暗号化値・平文とも出力しない
  - error_id: E-206
    condition: 初期表示（/init）の稼働状態チェックが不可
    next_action: オンライン利用エラー画面へ遷移（E-203 と同一文面）。ログインさせない
  - error_id: E-207
    condition: /login の該当なし
    next_action: 応答は errorCode の "1" のみを返し、他のフィールドを返さない（承認版 §7.5）
  - error_id: E-208
    condition: ログイン処理中の DB 障害等
    next_action: システムエラー画面へ遷移。内部情報を利用者向け文言に出さず運用ログへ記録する
  - error_id: E-209
    condition: /generateUrl の暗号化失敗・設定不備
    next_action: システムエラー画面へ遷移（E-208 と同一文面）
  - error_id: E-210
    condition: 生成 URL が 150 桁を超える
    next_action: 切捨てない。エラー通知。詳細コードは R60W0001（C 裁定）

# 【复用/参照的既有资产 —— ★greenfield では「新規定義するもの」】
existing_assets:
