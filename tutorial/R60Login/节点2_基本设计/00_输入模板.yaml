# =============================================================================
# 节点2（基本设计）输入模板 —— 文件编号: IN-201
# -----------------------------------------------------------------------------
# 这是「人 → AI」的接口文件。你把它填好，直接丢给 Claude，AI 就会据此生成
# 基本设计书（01_AI产出_基本设计书.md）。
#
# 填写规则：
#   1. 所有 <尖括号> 都是「待填」。把尖括号连同内容一起换成你的实际内容。
#   2. 键名（冒号左边）固定，不要改。值（冒号右边）随你填。
#   3. 不确定的地方填 null，并在 open_questions 里记一条，不要留空不管。
#   4. 全部填完把 status 从 draft 改成 filled。
#   5. 键名一律 snake_case；camelCase（如 stfCd）只能出现在「值」里。
# =============================================================================

# ---------- 顶部 7 个固定字段（一般不用改）----------
id: IN-201                 # 本输入文件的编号，节点2 固定为 IN-201
type: node-input           # 文件种类，固定 node-input
req_ids: [R-201]           # 本节点对应的需求编号，来自节点1 的承认版
status: draft             # draft=还没填 / filled=已填、可交给 AI
sensitivity: internal      # 密级：internal（内部）即可
owner: AI-SE               # 责任人角色
version: 0.1.0             # 本文件版本，改动一次就 +0.0.1

# =============================================================================
# 正文 —— 以下才是你要填的内容
# =============================================================================

# 【1】source_requirement：本节点的输入来自哪份承认版文件
#   填什么：节点1 承认版（04_承認版_需求结构化表.md）的相对路径，以及需求编号。
#   为什么：基本设计里的每一条都必须能追回需求，否则 trace_check 断链、审查过不了。
source_requirement:
  file: <节点1_需求/04_承認版_需求结构化表.md>
  requirement_id: R-201

# 【2】target_module：这次要设计哪个模块
#   填什么：模块代号 + 中文名 + 一句话说明。
#   为什么：决定后续文件命名、包路径、画面与接口前缀，务必和代码里的名称一致。
target_module:
  module_code: <例 R60Login>
  module_name: <例 共通マスタ ログイン>
  summary: <一句话，例 共通マスタへ入るためのログイン認証処理>

# 【3】function_name：本模块对外提供的主要功能（对应 F-201）
#   填什么：功能编号 + 功能名 + 它挂在哪个需求下。
#   为什么：F-ID 是「需求 → 画面 → 项目」链条的中间环节，缺了它链条就断。
function_name:
  function_id: F-201
  name: <例 R60Login ログイン機能>
  parent_requirement: R-201

# 【4】screen_list：有几个画面，分别是什么
#   填什么：每个画面的 教学用画面编号(SCR-201…)、文件路径、作用。
#   为什么：画面是最小交付单位，AI 要按画面组织设计；编号必须用教学号段 SCR-2xx。
#   注意：不要用主仓库会冲突的编号，一律用 SCR-2xx。
screen_list:
  - screen_id: SCR-201
    file: <例 Front-end/src/views/<画面名>.vue>
    role: <例 ログイン画面>
    comments: <补充说明，可留空>

# 【5】io_items：输入输出项目（I-301…）
#   填什么：每个项目的 项目编号、英文名、日文名、方向(in/out)、备注。
#   为什么：这是「画面项目 ↔ DB 列 ↔ 接口字段」三者的对应表，漏一个后面全对不上。
#   提示：不确定的项目也先写下来，在 comments 里写「待确认」，不要跳过。
io_items:
  - item_id: I-301
    name: <英文项目名，例 stfCd>
    jp_name: <日文名，例 暗号化社員コード>
    direction: in
    comments: <这个项目是干嘛的、在哪一步用到>

# 【6】db_tables：要用到哪些表
#   填什么：表名 + 用途(read/write) + 关键 WHERE 条件。
#   为什么：基本设计必须列出「使用テーブル」，且不得引入未授权表。
#   ★build_mode で書ける内容が変わる：
#     - migration：既存の物理表名を書く（案件プロファイルが与える既存スタックの一部）。
#     - greenfield（既定）：**物理名は工程03（詳細設計）で確定する**。ここは論理名の提案にとどめ、
#       `<…（当方の論理名。物理名は工程03 で確定）>` のように未確定であることを明示する。
#       **それらしい物理名を発明して書かない**（後で実物と食い違い、嘘の設計になる）。
db_tables:
  - table_name: <migration=既存の物理表名 ／ greenfield=論理名（物理名は工程03 で確定）>
    usage: <read / write>
    note: <例 稼働状態のチェックに使用>

# 【7】common_functions：共通部品（呼ぶ／作る）
#   填什么：共通部品的名字 + 用途。
#   ★build_mode で**この節の意味が逆になる**（ここを取り違えると設計が壊れる）：
#     - migration：**すでに存在する**共通関数名を書き、**呼ぶ**（唯一真源。呼ぶだけ。改変・並行新版の作成は禁止）。
#     - greenfield（既定）：**既存の共通函数は存在しない**。したがってここには
#       「**本案件で新規定義する候補**」を書く。工程04（框架・環境構築）で一覧化し、工程05（製造）で定義する。
#       定義後はそれが唯一真源となり、以降の改変禁止はそこに働く。
#       **工程02 の時点で「もう在る」前提の設計を書かない。**
common_functions:
  - name: <migration=既存の共通関数名 ／ greenfield=新規定義する候補名>
    purpose: <例 エラー・情報メッセージ表示>

# 【8】error_ids：本模块要定义哪些错误
#   填什么：错误编号(E-201…) + 触发条件 + 处理方式。
#   为什么：错误一览是基本设计必修项，也是后续测试用例的种子。
error_ids:
  - error_id: E-201
    condition: <例 オンライン利用不可>
    note: <例 オンライン停止専用画面へ遷移>

# 【9】constraints：有什么限制
#   填什么：技术栈、性能、安全、合规、既存资产等「不能碰」的约束。
#   为什么：这些是红线，AI 一旦越线，产物直接作废。
#   ★build_mode で書ける内容が変わる：
#     - migration：既存資産の改変禁止・既存スタックの変更禁止（案件プロファイルが与える）。
#     - greenfield（既定）：**スタックはまだ確定していない**（工程04 で当方が提案し人が承認する＝紅線④）。
#       したがって「スタック変更禁止」ではなく「**工程02 の時点でスタックを確定させない**」が制約になる。
constraints:
  - <migration=既存の共通資産は改変禁止 ／ greenfield=共通部品は本案件で新規定義する（既存資産は無い）>
  - <migration=既存スタックは変更禁止 ／ greenfield=スタックは工程04 で提案し人が承認する（本節点で確定させない）>

# 【10】open_questions：还没定下来的事
#   填什么：Q-220… + 问题 + 建议默认值 + 需要谁拍板。
#   ★番号の起点に注意（ここを間違えると节点1 の Q と衝突する）：
#     节点1 が Q-201〜Q-219 を使う（12 条）。したがって**节点2 自身の新規未決は Q-220 以降**。
#     节点1 から持ち越した未決は、**同じ Q 番号のまま**継続確認する（番号を振り直さない）。
#   为什么：把「不确定」显式列出来，AI 才不会自己瞎猜；这也是要问客户的清单。
open_questions:
  - question_id: Q-220
    question: <例 遷移先画面は何で決まるか？>
    default_proposal: <你的建议默认值。**顧客が決める事項（A 類）なら null にして、暫定値を置かない**>
    owner_to_decide: <例 顧客 業務主管>

# 【11】human_review_required：本项目里人必须亲自拍板的点
#   填什么：必须由人（不是 AI）确认的项目清单。
#   为什么：AI 只能出草稿，责任在人；这些点一旦错了代价最大。
human_review_required:
  - <例 遷移先画面のマッピングが、顧客提供の業務画面一覧と一致しているか>
  - <例 Session 保存項目が、节点1 の受入条件と一致しているか>
  - <例 工程02 の時点でスタックを確定させていないか（工程04 の所掌を侵していないか）>
