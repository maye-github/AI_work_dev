# =============================================================================
# 【9】constraints —— 上游事实的转记（逐条标出出处）
#   原则：greenfield ではスタック・物理名・共通部品実体を本節点で確定させない。
#   节点1 の A 類回答は本演習では仮想答案であり、実案件では顧客の正式回答が必要。
# =============================================================================
constraints:
  - "greenfield のため既存資産は無い。共通部品は本案件で新規定義する（呼び出し前提の部品は提供元を Q-220 で確認する）。【出所：模板 §9・承認版 NG-04】"
  - "スタックは工程04 で提案し人が承認する（紅线④）。本節点でスタックを確定させない。【出所：模板 §9・CLAUDE.md §1 紅线④】"
  - "DB は論理名のみを提案し、物理名は工程03（詳細設計）で確定する。それらしい物理名を発明しない。【出所：模板 §6（greenfield）】"
  - "ID は ids.yml が唯一発号口。本節点の F-201・I-301〜I-320・E-201〜E-210 は素案であり、登録は人が行う。【出所：紅线①】"
  - "本画面は業務データを 1 件も更新しない（参照と画面遷移のみ）。排他制御・被参照チェック・重複チェックは不要。【出所：承認版 §1-4・§1-5・規則 01・02】"
  - "パスワード関連（変更・有効期限・複雑性など）は対象外。【出所：承認版 §2・NG-02】"
  - "メニューヘッダ・Session エラー画面は呼び出すのみで、本件では新規作成しない。【出所：承認版 §2・§3.8・NG-04】"
  - "画面マスタの内容・並び順の保守は対象外（取得・表示のみ）。【出所：承認版 §3.2・§3.8・NG-05】"
  - "本画面では利用権限を判定しない。ログイン可否は社員コードの存在（論理削除されていないこと）のみで決める。所属・権限・有効期限は用いない。【出所：Q-209（A・节点1 暂定）・規則 04・05】"
  - "暗号化方式は「各桁を+1（先頭桁はゼロ埋めなし、2 桁目以降は 2 桁ゼロ埋め）→ 4 桁超は先頭 4 桁と後続に分割（境界は 5 桁目で固定）→ 各ブロックの変換値に当日 yyyymmdd を整数加算 → 5 桁以上は _ で連結」。**算式の境界規則：① 各桁の +1 は 1 桁に切り詰めない（桁の値が 9 のときは 10 を出力し、次の桁へ桁上げしない）／② ブロック分割の境界は 5 桁目で固定する。** AES-256-ECB ではない。復号は案件指定の復号関数による。【出所：Q-201（A・节点1 暂定：虚拟答案。①② は節点1 v1.0.3＝CR-203 で追記）】"
  - "暗号化処理は共通関数 1 本に統合し、ログイン時・URL 生成時の双方から呼ぶ。【出所：承認版 §11.3 #5】"
  - "当日鍵はサーバのローカル日付（JST）を yyyymmdd で用い、当日内のみ有効。翌日は復号失敗として業務エラーとする。【出所：Q-216（C 裁定）】"
  - "URL のパラメータ順は stfCd→stfKbn→gmnId→kgnKbn 固定。文字コードは UTF-8、パーセントエンコード不要、日時は JST とする。【出所：Q-201・§12 #8（C 裁定）】"
  - "Session はサーバ側に保持し、ブラウザには HttpOnly Cookie で識別子のみ持たせる。idle 30 分・絶対 8 時間で失効し、閉じるで破棄する。多重ログインは許可する。保持項目は 11 件。【出所：Q-205（B 提案・节点1 暂定：顧客承認待ち）】"
  - "エラー応答は errorCode 0＝正常／1＝業務エラー／2＝システムエラー。詳細コードは R60W0001〜R60W0004・R60E9999。【出所：Q-206（B 提案・节点1 暂定）】"
  - "稼働可否はシステム共通の稼働フラグで判定する。3 処理すべてで前処理し、不可時は HTTP 403・オンライン利用エラー画面へ遷移する。【出所：Q-207（B 提案・节点1 暂定）】"
  - "入力値の前後空白は trim せず、全角・非 ASCII 文字は入力時に半角へ変換して除去する。【出所：Q-210・§12 #7（C 裁定）】"
  - "サーバは /login で受け取った stfCd のみを使用し、stfKbn・gmnId・kgnKbn は検証も保存もせず無視する。遷移と権限区分の保持はクライアント側で行う。【出所：Q-212（C 裁定）】"
  - "URL 出力時に社員コードが未入力の場合は、文字列「NaN」を社員コードとして扱い、入力エラーとしない。【出所：Q-214（B 提案・节点1 暂定）】"
  - "ログイン成功時は新規ウィンドウ／タブ、メニュー押下時は同一ウィンドウで遷移する。権限区分は URL に載せず、ログイン後の保持領域で引き継ぐ。【出所：Q-203・Q-204（B 提案・节点1 暂定）】"
  - "API 通信は HTTPS 必須（開発環境のみ http を許容）。生成 URL の scheme は環境設定で切り替える。ログイン試行は 5 回／10 分でロックし、10 分後に自動解除する。【出所：Q-215（B 提案・节点1 暂定）】"
  - "アクセスログには社員コード（マスク）・画面 ID・権限区分・結果コード・時刻を出力し、保存期間は 1 年とする。氏名は出力しない。【出所：Q-206・§12 #9（B 提案・节点1 暂定）】"
  - "非機能は Chrome／Edge の最新 2 バージョン、画面解像度 1280×800 以上、同時利用 100、ログイン応答 3 秒以内（95 パーセンタイル）、可用性 99.5%（業務時間帯）とする。【出所：Q-219（B 提案・节点1 暂定）】"
  - "URL 欄は受付 150 文字・表示幅 120 文字、超過はエラーとする。編集値は表示のみに用い、遷移には使用しない。【出所：Q-213（C 裁定）】"
  - "二度送信の抑止は共通部品の 3 関数（subCheckSubmit → subSetSubmitFlg → subInitSubmitFlg）で行い、finally で必ず解放する。【出所：承認版 §11.3 #27】"
  - "設計の前提は「画面マスタ・社員マスタ・システム共通テーブルが利用可能であること」。崩れた場合は稼働不可として扱う。【出所：承認版 §11.3 #8】"

# =============================================================================
# 【10】open_questions —— 本节点新产生的未决（Q-220 起，不与节点1 的 Q-201〜Q-219 撞号）
#   category: A＝顧客が決める／B＝当方が提案し顧客が承認／C＝当方内部で裁定
#   节点1 已决事项不重复列入；其中暂定结论已在【9】对应条目注明「节点1 暂定」。
# =============================================================================
open_questions:
  - question_id: Q-220
    question: "共通部品（メニューヘッダ／Session エラー画面／オンライン利用エラー画面／システムエラー画面）は、本案件で新規作成するのか、顧客の共通基盤が提供するのか。承認版は Session エラー画面を「呼び出す・新規作成しない」とする（§2・NG-04）が、greenfield には既存資産が無く、正式な I/F も未提供（§12 #5）。本節点ではこれら 4 部品を screen_list に含めず、ルート名で遷移する前提で設計してよいか。"
    default_proposal: "4 部品は screen_list に含めず、承認版 Q-217・§12 #5 のルート名で遷移する前提で設計する。I/F 受領後に確定する。提供が無い場合は工程02 の追加設計（3 エラー画面＋メニューヘッダ）を起案する。"
    owner_to_decide: "顧客 情報システム部門（提供範囲）／当方 SE（追加設計の要否）"
    category: "B"

  - question_id: Q-221
    question: "承認版 §11.3 #27 は二度送信防止を「共通部品の 3 関数」で行うと確定し、§11.3 #5 は暗号化処理を共通関数 1 本に統合するとする。しかし greenfield には当該共通部品が存在しない。本案件の共通部品として新規定義する前提で、F-201 の設計に含めてよいか。"
    default_proposal: "含める。二度送信防止 3 関数（subCheckSubmit／subSetSubmitFlg／subInitSubmitFlg）と暗号化・復号 1 関数を、工程04 で共通部品一覧に載せ、工程05 で定義する。工程02 では「既にある」とは書かない。"
    owner_to_decide: "当方 SE（工程04 の技術選型承認と一体で確認）"
    category: "C"

  - question_id: Q-222
    question: "画面マスタの候補が 0 件のとき、URL 出力ボタンは押せるのか。Q-211 の回答は「候補なし・ログイン不可メッセージ」までで、URL 出力の可否は AI 合理案に留まり明文が無い。"
    default_proposal: "0 件時はログイン・URL 出力とも不可とし、両ボタンを非活性にして「利用可能な画面がありません」を表示する。根拠は Q-211 の AI 合理案と §11.3 #8。"
    owner_to_decide: "顧客 業務主管（Q-211 の補完）／当方 SE"
    category: "B"

  - question_id: Q-223
    question: "画面 ID（gmnId）から遷移先画面ルートへの解決規則をどうするか。Q-203 は「画面 ID を本システムの画面ルートに解決」とするが、greenfield ではルート規約がまだ無い。シミュレーション版の末尾区分を除く規則も必要。"
    default_proposal: "画面ルートは /R60/<gmnId> とする。シミュレーション版は末尾の区分を除いた gmnId でルートを解決し、区分をクエリに付す。工程04 のルーティング規約で最終確定する。"
    owner_to_decide: "当方 SE（工程04）"
    category: "C"

  - question_id: Q-224
    question: "【解決済 2026-10-21】ユーザーＩＤの桁数は「半角 7 桁固定」か「最大 7 桁」か。承認版 §4 #3 と Q-210 の裁定が食い違っていた。"
    default_proposal: "節点1 へ R 類として退回し、Q-210 を「半角数字 7 桁固定・必須」に訂正した（D-201／CR-201）。承認版 v1.0.2 として 2026-10-21 に SE-001 が再承認。設計書は 7 桁固定で書く。"
    owner_to_decide: "解決済（SE-001 再承認 2026-10-21）"
    category: "C"

  - question_id: Q-225
    question: "【解決済 2026-10-21】システム日時の表示形式が、承認版 §4 #2 の hh:mm:ss と Q-218 の裁定（24 時間制）で食い違っていた。"
    default_proposal: "節点1 へ R 類として退回し、Q-218 を「要求書の hh は AM/PM 表記が無いため 24 時間制と解する」と明示する形に訂正した（D-202／CR-202）。承認版 v1.0.2 として 2026-10-21 に SE-001 が再承認。設計書は YYYY/MM/DD HH:mm:ss で書く。"
    owner_to_decide: "解決済（SE-001 再承認 2026-10-21）"
    category: "C"

  - question_id: Q-226
    question: "F-201・I-301〜I-320・E-201〜E-210 は本節点の素案番号である。どの時点で ids.yml へ登録するか。"
    default_proposal: "設計評審（人の承認）後に人が ids.yml へ一括登録する。本節点では発号しない（紅线①）。"
    owner_to_decide: "当方 SE（登録は人）"
    category: "C"

