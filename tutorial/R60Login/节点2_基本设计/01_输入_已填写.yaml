screen_list:
  - screen_id: SCR-201
    file: "【AI 素案】未確定。画面実装ファイルのパスは工程04（スタック確定）後に決定する。画面名は R60Login を想定。"
    role: "【AI 素案】共通マスタの入口となるログイン画面。画面タイトル・システム日時・ユーザーＩＤ・起動区分・説明文・画面・権限区分・URL 欄、およびログイン／メニュー／URL出力／閉じるの 4 ボタンを配置する。"
    comments: "【AI 素案】12 項目・5 イベントに 1:1 対応させる。メニューヘッダとエラー画面 3 種は共通部品として呼び出す前提のため本一覧に含めない（提供元は Q-220 で確認中）。二度送信防止は共通部品 3 関数で行う（§11.3 #27）。"

# =============================================================================
# 【5】io_items —— 设计字段（AI 素案）
#   方針：同一業務フィールドは 1 項目だけ定義する（単一ソース）。
#   画面項目 #1〜#12 → I-301〜I-312。派生・API・Session 項目 → I-313〜I-320。
#   direction は原則 in/out。例外として画面項目 #10（I-310）のみ、生成 URL の表示（out）と
#   利用者による編集（in）を 1 項目で表すため inout としている（単一ソース維持のため分割しない）。
#   出所（上游约束）：承認版 §4・§6・§7、Q-201／Q-203〜Q-219
# =============================================================================
io_items:
  - item_id: I-301
    name: "【AI 素案】screenTitle"
    jp_name: "【AI 素案】画面タイトル"
    direction: out
    comments: "【AI 素案】固定値「共通マスタ　ログイン」（全角空白を含む）。出所：承認版 §4 #1・§11.3 #9。画面項目 #1。"

  - item_id: I-302
    name: "【AI 素案】systemDateTime"
    jp_name: "【AI 素案】システム日時"
    direction: out
    comments: "【AI 素案】YYYY/MM/DD HH:mm:ss・24 時間制・1 秒更新・クライアント端末時刻。出所：Q-218（C 裁定・v0.5.2）。要求書 §3.2 #2 の `hh` は AM/PM 表記が無いため 24 時間制と解する（D-202・2026-10-21 再承認済）。画面項目 #2。"

  - item_id: I-303
    name: "【AI 素案】stfCd"
    jp_name: "【AI 素案】ユーザーＩＤ（社員コード・平文入力）"
    direction: in
    comments: "【AI 素案】半角数字 7 桁固定・必須（1〜6 桁は入力エラー）。前後空白は trim せず、全角は入力時に除去する。出所：Q-210（C 裁定・v0.5.2）・§12 #7・要求書 §3.2 #3。画面項目 #3。暗号化済みの転送表現は I-313（単一ソースは本項目）。D-201 で 7 桁固定に訂正済（2026-10-21 再承認済）。"

  - item_id: I-304
    name: "【AI 素案】stfKbn"
    jp_name: "【AI 素案】起動区分"
    direction: in
    comments: "【AI 素案】半角数字 1 桁・1／2／3 のみ・初期値 3・編集可。範囲外は入力エラー。出所：Q-210・承認版 §3.2 #4。画面項目 #4。遷移用 URL の stfKbn とメニュー遷移の引継ぎに用い、ログイン可否は変えない（規則 10）。"

  - item_id: I-305
    name: "【AI 素案】descriptionText"
    jp_name: "【AI 素案】説明文"
    direction: out
    comments: "【AI 素案】「1：本店ユーザー、2：工場ユーザー、3：システム管理者」。出所：承認版 §4 #5。画面項目 #5。"

  - item_id: I-306
    name: "【AI 素案】gmnId"
    jp_name: "【AI 素案】画面（遷移先画面 ID）"
    direction: in
    comments: "【AI 素案】画面マスタの画面 ID。候補は全社共通・有効のみ・表示順昇順、初期値は先頭候補。出所：Q-211（A・节点1 暂定）、承認版 §3.2 #6。画面項目 #6。"

  - item_id: I-307
    name: "【AI 素案】kgnKbn"
    jp_name: "【AI 素案】権限区分"
    direction: in
    comments: "【AI 素案】更新あり（Y）／更新なし（N）の 2 値固定。初期値は更新あり（Y）。遷移先の更新操作可否に用いる。出所：承認版 §4 #7・§11.3 #19。画面項目 #7。"

  - item_id: I-308
    name: "【AI 素案】loginButton"
    jp_name: "【AI 素案】ログインボタン"
    direction: in
    comments: "【AI 素案】初期状態は活性。押下で POST /R60Login/login を呼ぶ。出所：承認版 §4 #8・§5 イベント 2。画面項目 #8。"

  - item_id: I-309
    name: "【AI 素案】menuButton"
    jp_name: "【AI 素案】メニューボタン"
    direction: in
    comments: "【AI 素案】初期状態は活性。押下時も POST /R60Login/login を共用し、成功後にクライアント側でメニュー画面へ遷移する。出所：Q-202（A・节点1 暂定）、§11.3 #2。画面項目 #9。"

  - item_id: I-310
    name: "【AI 素案】url"
    jp_name: "【AI 素案】URL（遷移用 URL）"
    direction: inout
    comments: "【AI 素案】受付上限 150 文字・表示幅 120 文字・半角（ASCII 印字可能文字）。生成 URL が 150 文字を超える場合は切捨てずエラー。利用者の編集値は表示のみに用い、遷移には使用しない。パラメータ順は stfCd→stfKbn→gmnId→kgnKbn 固定。出所：Q-213（C 裁定）・Q-201。画面項目 #10。"

  - item_id: I-311
    name: "【AI 素案】urlOutputButton"
    jp_name: "【AI 素案】URL出力ボタン"
    direction: in
    comments: "【AI 素案】初期状態は活性。押下で POST /R60Login/generateUrl を呼び、結果を I-310 に表示する。出所：承認版 §4 #11・§5 イベント 4。画面項目 #11。"

  - item_id: I-312
    name: "【AI 素案】closeButton"
    jp_name: "【AI 素案】閉じるボタン"
    direction: in
    comments: "【AI 素案】初期状態は活性。確認文言「画面を終了してよろしいですか？」を表示してから閉じる。出所：Q-218（C 裁定）。画面項目 #12。"

  - item_id: I-313
    name: "【AI 素案】encryptedStfCd"
    jp_name: "【AI 素案】暗号化社員コード（I-303 の転送表現）"
    direction: in
    comments: "【AI 素案】派生項目。単一ソースは I-303。POST /R60Login/login のリクエストに用いる。暗号化は共通関数 1 本に統合（§11.3 #5）。方式は Q-201（桁変換＋当日 yyyymmdd 加算）。"

  - item_id: I-314
    name: "【AI 素案】pageList"
    jp_name: "【AI 素案】画面候補一覧"
    direction: out
    comments: "【AI 素案】POST /R60Login/init の応答。value＝画面 ID、label＝画面名の配列。有効のみ・表示順昇順。出所：承認版 §4.2・Q-211。"

  - item_id: I-315
    name: "【AI 素案】kbnList"
    jp_name: "【AI 素案】権限区分候補一覧"
    direction: out
    comments: "【AI 素案】POST /R60Login/init の応答。value／label の配列（更新あり・更新なし）。値は kgnKbn と同じ符号（Y／N）。出所：承認版 §4.2・§11.3 #19。"

  - item_id: I-316
    name: "【AI 素案】userInfo"
    jp_name: "【AI 素案】ユーザー情報"
    direction: out
    comments: "【AI 素案】POST /R60Login/login の成功応答、および Session 保持項目 6 件（cmpCd／cmpNm／jigCd／jigNm／stfCd／stfNm）。出所：Q-205（B 提案・节点1 暂定）・Q-208。Session はサーバ側保持、識別子のみ HttpOnly Cookie。"

  - item_id: I-317
    name: "【AI 素案】mngInfo"
    jp_name: "【AI 素案】管理情報"
    direction: out
    comments: "【AI 素案】POST /R60Login/login の成功応答、および Session 保持項目 5 件（scmpCd／sjigCd／jiKjoKsnFlg／taKjoKsnFlg／loginAcsKais）。出所：Q-205（B 提案・节点1 暂定）。"

  - item_id: I-318
    name: "【AI 素案】errorCode"
    jp_name: "【AI 素案】エラー区分コード"
    direction: out
    comments: "【AI 素案】文字列。0＝正常／1＝業務エラー／2＝システムエラー。/login の該当なしは「1」のみを返し、他のフィールドを返さない。出所：Q-206（B 提案・节点1 暂定）、承認版 §4.3。"

  - item_id: I-319
    name: "【AI 素案】errorDetailCode"
    jp_name: "【AI 素案】詳細エラーコード"
    direction: out
    comments: "【AI 素案】R60W0001（入力不正）／R60W0002（社員不存在）／R60W0003（復号失敗）／R60W0004（稼働不可）／R60E9999（システム例外）。出所：Q-206（B 提案・节点1 暂定）。"

  - item_id: I-320
    name: "【AI 素案】operationFlag"
    jp_name: "【AI 素案】稼働状態フラグ"
    direction: in
    comments: "【AI 素案】システム共通の稼働フラグ。init／login／generateUrl の 3 処理の前処理で参照し、有効時のみ利用可とする。出所：Q-207（B 提案・节点1 暂定）。"

# =============================================================================
# 【6】db_tables —— 设计字段（AI 素案）
#   greenfield のため論理名のみ。物理名は工程03 で確定する（発明しない）。
#   出所（上游约束）：Q-208・Q-211・Q-207、承認版 §1-4（更新なし）
# =============================================================================
db_tables:
  - table_name: "【AI 素案】社員マスタ（論理名。物理名は工程03 で確定）"
    usage: read
    note: "【AI 素案】社員コードの存在確認（論理削除フラグが未削除の行のみ有効）。userInfo の項目取得。出所：Q-208（A・节点1 暂定）。"

  - table_name: "【AI 素案】組織・事業場マスタ（論理名。物理名は工程03 で確定）"
    usage: read
    note: "【AI 素案】会社・事業場の名称取得（社員マスタと結合）。出所：Q-208。"

  - table_name: "【AI 素案】コード・メッセージ管理マスタ（論理名。物理名は工程03 で確定）"
    usage: read
    note: "【AI 素案】コード・メッセージの取得。結合キーのコード値は承認版 Q-208 の指定による（本ファイルに再掲しない）。"

  - table_name: "【AI 素案】画面マスタ（論理名。物理名は工程03 で確定）"
    usage: read
    note: "【AI 素案】画面候補の取得（有効な行のみ・表示順の昇順）。本画面は取得・表示のみで保守しない（NG-05）。出所：Q-211（A・节点1 暂定）。"

  - table_name: "【AI 素案】システム共通テーブル（稼働フラグ。論理名。物理名は工程03 で確定）"
    usage: read
    note: "【AI 素案】稼働可否の判定。出所：Q-207（B 提案・节点1 暂定）。本画面は write を行わない（承認版 §1-4・規則 01）。"

# =============================================================================
# 【7】common_functions —— 设计字段（AI 素案）
#   greenfield のため既存共通関数は無い。ここは「本案件で新規定義する候補」と
#   「提供元が未確定の共通部品（呼び出しのみ）」を区別して列挙する。
#   工程02 の時点で「もう在る」前提の設計を書かない。
# =============================================================================
common_functions:
  - name: "【AI 素案】社員コード暗号化・復号 共通関数（本案件で新規定義。1 本に統合）"
    purpose: "【AI 素案】平文の社員コードを暗号化し、暗号化済み社員コードを復号する。ログイン時・URL 生成時の双方から呼ぶ。方式は Q-201、当日鍵は Q-216。出所：承認版 §11.3 #5。"

  - name: "【AI 素案】subCheckSubmit（二度送信防止。本案件で新規定義）"
    purpose: "【AI 素案】ボタンイベントの先頭で二度押しを判定し、処理続行可否を返す。出所：承認版 §11.3 #27。"

  - name: "【AI 素案】subSetSubmitFlg（二度送信防止。本案件で新規定義）"
    purpose: "【AI 素案】API 呼出直前に二度送信フラグを ON にする。出所：承認版 §11.3 #27。"

  - name: "【AI 素案】subInitSubmitFlg（二度送信防止。本案件で新規定義）"
    purpose: "【AI 素案】finally ブロックで必ずフラグを OFF に解放する。例外時も解放する。出所：承認版 §11.3 #27。"

  - name: "【AI 素案】メッセージ表示共通部品（エラー・情報ダイアログ）"
    purpose: "【AI 素案】エラー／情報メッセージを表示する。文言はメッセージ管理情報から取得する（Q-206）。"

  - name: "【AI 素案】エラー区分判定・エラー画面遷移 共通部品"
    purpose: "【AI 素案】errorCode／HTTP status を判定し、Session エラー／オンライン利用エラー／システムエラーの各画面へ遷移する。遷移主体はクライアント（Q-217）。"

  - name: "【AI 素案】メニューヘッダ共通部品（提供元未確定。呼び出しのみ）"
    purpose: "【AI 素案】遷移先でタイトル・システム日時を表示する。本案件では新規作成しない（承認版 §2・NG-04）。提供元と I/F は Q-220。"

  - name: "【AI 素案】Session エラー画面（提供元未確定。呼び出しのみ）"
    purpose: "【AI 素案】社員不存在・復号失敗のときに遷移する。ルート名は承認版 §12 #5 による。I/F は Q-220。"

  - name: "【AI 素案】オンライン利用エラー画面（提供元未確定）"
    purpose: "【AI 素案】稼働不可のときに遷移する。I/F は Q-220。"

  - name: "【AI 素案】システムエラー画面（提供元未確定）"
    purpose: "【AI 素案】初期表示失敗・DB 障害等のときに遷移し、「再読み込み」ボタンを表示する（Q-217）。I/F は Q-220。"

  - name: "【AI 素案】メッセージ管理情報 取得共通部品"
    purpose: "【AI 素案】エラーメッセージ文言を取得する。出所：Q-206。"

  - name: "【AI 素案】API 呼び出し共通部品"
    purpose: "【AI 素案】POST／JSON の共通呼び出しと、エラー応答の解釈を一元化する。出所：Q-206・承認版 §4.1。"

# =============================================================================
# 【8】error_ids —— 设计字段（AI 素案）
#   出所（上游约束）：承認版 §8 の E-01〜E-09、Q-206・Q-207・Q-210・Q-213・Q-216・Q-217
# =============================================================================
error_ids:
  - error_id: E-201
    condition: "【AI 素案】社員が存在しない（社員マスタに未削除の該当行が無い）"
    note: "【AI 素案】業務エラー（詳細コード R60W0002）。ログインさせず Session エラー画面へ遷移する。出所：承認版 E-01・Q-206・Q-217。"

  - error_id: E-202
    condition: "【AI 素案】ユーザーＩＤの桁数・文字種が不正"
    note: "【AI 素案】業務エラー（詳細コード R60W0001）。存在しない社員コードと同じ扱いとし、Session エラー画面へ遷移する。出所：承認版 E-02・Q-210。"

  - error_id: E-203
    condition: "【AI 素案】オンライン利用が許可されていない（稼働フラグが無効・データなし・例外）"
    note: "【AI 素案】業務エラー（詳細コード R60W0004・HTTP 403）。オンライン利用エラー画面へ遷移する。3 処理の前処理で判定する。出所：承認版 E-03・Q-207。"

  - error_id: E-204
    condition: "【AI 素案】画面マスタの取得に失敗"
    note: "【AI 素案】システムエラー（errorCode＝2）。システムエラー画面へ遷移し、自動再試行は行わない。出所：承認版 E-04・Q-217。"

  - error_id: E-205
    condition: "【AI 素案】復号に失敗（不正な暗号化社員コード、または日跨ぎ）"
