  - "【AI 素案】F-201・I-301〜I-320・E-201〜E-210 の採番が ids.yml に登録され、野号でないこと（紅线①）。"
  - "【AI 素案】遷移方式（ログイン＝新規ウィンドウ／タブ、メニュー＝同一ウィンドウ）と権限区分の受渡しが Q-203・Q-204 の提案どおりか。"
  - "【AI 素案】Session 保持項目 11 件が Q-205 と一致し、後続画面の参照契約を満たすか。"
  - "【AI 素案】エラー区分・詳細コードが Q-206 と一致し、E-201〜E-210 が承認版 E-01〜E-09 を漏れなく覆うか。"
  - "【AI 素案】greenfield の制約を守り、工程02 でスタックを確定させていないか（工程04 の所掌を侵していないか）。"
