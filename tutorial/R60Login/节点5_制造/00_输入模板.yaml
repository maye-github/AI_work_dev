# 【编码规范】
#   ★greenfield（本演習）: 参照すべき既存コードが無い。したがって「規範」は
#     ① 工程04 で承認された採用スタックの慣用、② 本節点で新規定義した共通部品、の 2 つになる。
#     「既存の◯◯ファミリーに合わせる」という種類の指示は**出せない**（比較対象が存在しない）。
coding_standards:
  - "greenfield: 工程04 承認済みスタックの慣用に従う — Vue 3（Composition API ＋ `<script setup>`）＋ TypeScript（`strict`）＋ Vite ＋ PrimeVue ＋ Pinia（工程04 §1.1）"
  - "greenfield: サーバは Python 3.12 ＋ FastAPI ＋ Pydantic v2 ＋ SQLAlchemy Core（`text()`。**ORM マッピングは作らない**）＋ oracledb（Thin）（工程04 §1.2）"
  - "greenfield: 共通部品（`subCheckSubmit`／`subSetSubmitFlg`／`subInitSubmitFlg`、暗号化・復号の 1 本）は**本案件で新規定義**する。既存部品の存在を前提にしない。**定義後はその新定義が唯一真源**となり、以後みだりに変えない（05 §8.5・§9）"
  - "greenfield: `BaseCamelModel` は本案件で新規定義し、`model_config` の 4 行（`alias_generator` / `populate_by_name` / `serialize_by_alias` / `extra`）を固定する。**派生モデルで `model_config` を再定義しない**（`.claude/rules/03-design-coding.md` §2・工程04 §4）"
  - "命名は 3 層で分離する — 画面・接口（TS）は camelCase（`stfCd`／`gmnId`）、定義層・Python は snake_case（`stf_cd`／`gmn_id`）、DB 物理名は UPPER（`STF_CD`／`GMN_ID`）。**変換点は `BaseCamelModel` の 1 箇所だけ**。手書き変換を散在させない（規則 03 §4・工程04 §2.6）"
  - "SQL は明示手書き。値は必ず `:name` の名前付きバインドで受け、**f-string 等で値を連結しない**。列名・表名を利用者入力から組み立てない。**SELECT のみ**（DML なし）（05 §5.1・工程04 §2.4・§2.5）"
  - "本画面に**動的ソートは無い**（並びは `ORDER BY disp_order, gmn_id` の固定）。したがって `ALLOWED_SORT_FIELDS` 白名单は**適用対象が存在しない**。ソート機能の追加は設計変更（CR）（05 §5.1 #2・規則 03 §5）"
  - "Oracle セッションの `NLS_DATE_FORMAT` は **`RR-MM-DD` 固定・変更禁止**（`.claude/rules/00-project-global.md` §2・工程04 §2.3）。日付・時刻を SQL に埋め込まない（05 §5.1 #4）"
  - "冪等性: 現在時刻・乱数・UUID・順序不定の反復を出力へ埋め込まない。L-206 の日付は**引数として注入**し、テストで固定できるようにする（規則 03 §7.1・05 §2.7）"
  - "1 画面 1 生成・端点 3 本を単位に分割して生成する（規則 03 §7.4・05 §1.3）。一括で全層を生成しない"
  - "入力の正規化（**trim しない**・全角→半角・非 ASCII 除去）は **L-207 の 1 箇所だけ**で行う。他で再実装しない（05 §8.4）"
  - "複雑判定に該当する製造物は設計者以外が diff を読む（状態遷移・外部連携を伴う L-203／L-205／L-208 が該当。規則 03 §7.2）"
  - "ログは標準出力へ 1 行 1 JSON（構造化）。社員コードは中間 5 桁を `*`、氏名は出力しない。当日鍵・平文／暗号化前後の実値・Session 識別子を出さない（工程04 §6.2・05 §8.1・§9）"

# 【接口签名（照设计写，不自行增改）】
#   端点パス・フィールド名は 05 §2.3／§2.5／§2.6／§4.2 の転記。名称の無いものは `null` とし、
#   実装で勝手に名付けない（design に無い名前を「仕様」にしない）。
interfaces:
  - name: "POST /R60Login/init"
    side: server
    params: "なし（利用者入力を用いない。05 §2.3）"
    returns: |
      errorCode（I-318）／errorDetailCode（I-319・異常時のみ）
      pageList（I-314）: [{value: gmn_id, label: gmn_nm}]。有効行のみ・`disp_order` 昇順＋`gmn_id` 昇順
      kbnList（I-315）: 2 件固定 [{value: "Y", label: "更新あり"}, {value: "N", label: "更新なし"}]
    http: "200（業務・システム応答は errorCode で区分）／403（E-206 稼働不可・errorDetailCode=R60W0004）"
    logic_ids: [L-201, L-202]
    sql_ids: [SQL-1, SQL-2]
    notes: "候補 0 件は**エラーではない**（errorCode=\"0\"）。クライアントが文言表示と I-308／I-311 非活性を行う（05 §2.3 ステップ6・B-22）"
  - name: "POST /R60Login/login"
    side: server
    params: |
      encryptedStfCd（I-313）のみを使用する。
      stfKbn（I-304）／gmnId（I-306）／kgnKbn（I-307）は受信するが、**検証も保存もせず無視する**
      （否定の限定句。「受け取らない」と読み替えない。05 §4.2・Q-212）。
    returns: |
      errorCode（I-318）／errorDetailCode（I-319）
        ※ E-201／E-207 は errorCode="1" のみを返し、errorDetailCode を返さない（裁定 Q-235）
