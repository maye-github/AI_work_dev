      識別子のみ HttpOnly Cookie。idle 30 分／絶対 8 時間。保持先は OQ-05
    http: "200／403（E-203 稼働不可・R60W0004）"
    logic_ids: [L-201, L-203, L-206]
    sql_ids: [SQL-1, SQL-3, SQL-4, SQL-5]
