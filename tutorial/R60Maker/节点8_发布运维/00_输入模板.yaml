# =============================================================================
# 【发布步骤】
#   ★以下は AI 暫定案（v0.2.0）。数値・日時・連絡体制は人が決める（節点2 §11 が唯一の定義）
# =============================================================================
release_plan:
  window: >-
    未確定。人は稼働時間（平日 7:00–22:00 JST）と計画停止枠（月間 4 時間以内）の範囲で決める
    （出所: 節点2 §11 No.9・No.10）。AI が実施日時を決めない。
  preconditions:
    - 節点7 の合否判定が人の識別子で記録されていること（**現状 未充足**。実行 0 件）
    - 保留 3 本（IT-PENDING-06／07／10）の扱いが人により裁定済みであること（**現状 未裁定**）
    - 物理名・物理型が確定していること（節点3 §1 は AI 素案・Q-308b 待ち）
    - 共通部品 v3.0（SessionErrorScreen／OnlineControlErrorScreen／SystemErrorScreen／ReferenceChecker／
      EmergencyDispatcher 等）の提供経路が確保されていること（節点4 §5 の未確定）
    - シークレット管理サービス・共通ログ部品の**参照名**が用意されていること（実値は書かない）
    - 本リリースに DDL を伴う場合は、その実施主体・実施枠が人が決まっていること（アプリは DDL を発行しない）
  steps:
    - ビルド成果物の配置（frontend／backend を同一版で揃える）
    - 環境設定の投入（接続先・セッション保持先・ログ送出先）— **値は占位**で扱い、リポジトリに置かない
    - DB 準備: D-207〜D-212 の物理定義を確定後に用意する。**アプリの 6 端点は DDL を 1 文も発行しない**
    - 共通部品 v3.0 への接続確認（認証・セッション・ログ）
    - スモークテスト（下記 smoke_criteria の順で実施）
      - POST /R60Maker/init（入力なし）
      - POST /R60Maker/search（1 件目・0 件・501 件の 3 条件）
      - POST /R60Maker/initEdit（mode="1"／"2"／"3"）
      - POST /R60Maker/edit（新規→修正）
      - POST /R60Maker/delete（論理削除）
      - POST /R60Maker/download（要求本文を送らない）
    - 画面 1 周（検索画面 → マスタ画面 → 戻る）
    - 監視・ログの有効化確認
  smoke_criteria:
    - 6 端点が正常系で HTTP 200 かつ `errorCode="0"`
    - 読取 4 端点（init／search／initEdit／download）で `INSERT`・`UPDATE`・`DELETE`・`MERGE` が **0 文**
    - /delete の DML が `UPDATE ... SET del_flg=1` のみ。**物理 DELETE は 0 文**
    - 更新対象が D-207 のみ（D-208〜D-212 は SELECT のみ）
    - 業務データ（D-207）がスモークの書込分以外で変化していないこと
    - セッション 30 分・稼働時間外の挙動は運用設定どおり（**置換先画面は未観測**＝IT-PENDING-07）
    - ダウンロードの CSV が UTF-8 BOM・CRLF・ヘッダ行・5 列で、`last_update_datetime`／`rev_no` の列を含まない

# =============================================================================
# 【回滚步骤（可执行 + 有时间目标）】
# =============================================================================
rollback_plan:
  trigger:
    - 6 端点のいずれかが 5xx を返す、または `errorCode="9"` が継続する
    - 一覧検索の 95 パーセンタイルが節点2 §11 No.4 の目標を超える状態が続く
    - 登録・削除の応答が No.6 の目標を超える状態が続く
    - D-207 に意図しない更新（利用者が行っていない変更）が観測された
    - セッション失効（9001）・稼働状態（9002）の判定が誤動作する
    - 共通部品 v3.0 への接続が継続して失敗する
  steps:
    - 直前リリースのビルド成果物へ切り戻す（frontend／backend を**同一版で**戻す）
    - 環境設定の参照名を直前の版へ戻す（**実値を手順書に書かない**。シークレット管理側で切り替える）
    - アプリの起動確認と 6 端点の疎通確認（/init → /search）
    - スモークテストの再実施（読取 4 端点で DML 0 文／/delete は論理削除のみ）
    - スモークで書き込んだ行の扱いを人が裁定する（**物理削除はしない**。`del_flg` で扱う）
    - セッション保持先を切り戻した場合は、利用者へ再ログインを促す
    - 切戻しの結果（戻した版・戻した参照名・再実施した確認）をリリースノートに追記する
  target_time: >-
    未確定。判断開始から切戻し完了までの目標時間は人が決める（AI が数値を決めない）。
    参考の制約は RTO 4 時間・RPO 24 時間（節点2 §11 No.11）であり、切戻し目標はこれを超えないこと。
  drill: >-
    未実施。**演練していない回滚手順を「演練済み」と書かない**。

# =============================================================================
# 【运用监视】
#   ★数値の唯一の定義は 節点2 承認版 §11。本節点は参照であり、数値を再定義しない
# =============================================================================
monitoring:
  logs:
    - アクセスログ（1 年）・操作ログ（3 年）・監査ログ（5 年）。追記専用・改ざん防止（出所 節点2 §11 No.15）
    - "errorCode 別の発生件数（\"0\"／\"1\"／\"9\"）と errorId 別の内訳（1001／1002／2001／2002／2003／2004／2005／9001／9002／9101／9999）"
    - /edit・/delete の実行件数と失敗件数（排他 2003・被参照 2002）
    - 稼働状態チェックの判定結果（9002 の発生）
    - セッション失効（9001）の発生件数
    - 応答が 10 秒を超えた件数（No.18。自動再実行は行わない）
    - 敏感値（接続情報・実データ）は操作ログに出さない。遮蔽は共通ログ部品に委ねる
  alerts:
    - 5xx または `errorCode="9"` が一定時間に一定件数（**閾値は運用で決める。人が決める**）
    - 一覧検索の 95 パーセンタイルが No.4 の目標を連続して超える（出所 節点2 §11 No.4）
    - 登録・削除の 95 パーセンタイルが No.6 の目標を連続して超える（No.6）
    - 応答 10 秒超の発生（No.18）
    - 稼働率が No.9 の目標を下回る見込み（計画停止 No.10 を除く）
  health_check:
    - POST /R60Maker/init の疎通（入力を持たないため最も軽い）
    - D-207〜D-212 への参照成功（SELECT のみ。件数が前回と一致すること）
    - 共通部品 v3.0 への接続（認証・セッション・ログ）
  thresholds_source: tutorial/R60Maker/节点2_基本设计/05_承認版_基本设计书.md §11

