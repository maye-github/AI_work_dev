# 【约束】
constraints:
  - "詳細設計は基本設計の範囲を超えない。I-322〜I-354 と マスタ画面 9 項目（I-ID 未付与・Q-306）の範囲を超えない。I-354 より後の I-ID を発番しない（承認版 §4.3・§13）"
  - "スタックは工程04 で提案し人が承認する（紅線④）。本節点で確定させない"
  - "物理名・列名・型・桁は AI 素案であり、Q-308b の顧客回答待ち。確定値として扱わない（紅線③・A 類を当方が埋めない）"
  - "論理削除 del_flg（0=未削除／1=削除済み）を使い、物理削除しない。検索条件に削除区分を必ず含める（削除含むオフ時は未削除のみ）"
  - "キー重複は削除済みも存在とみなす。名称（日本語名・カナ名）の重複は許容し、一意制約はメーカーコードのみ（承認版 §12 #16）"
  - "排他は lastUpdateDatetime と revNo の両方の一致を要する。新規・複製は null を送りサーバは比較しない（承認版 §1.2・§6 イベント7・12）"
  - "検索のソートは白名单方式。許可は MAKER_CD／MAKER_NM の 2 項目のみ（承認版 §4.1 #19/#21・§12 #5）。白名单外・未指定は固定ソート（削除区分→メーカーコード昇順→ROWID）へフォールバック"
  - "SQL は :BIND プレースホルダのみ。実値・実コードを文字列連結で埋め込まない。敏感値は占位（TBL_1／COL_1／VAL_1）を用いる"
  - "ページングは任意頁移動（頁番号 1 始まり）のため OFFSET/FETCH を例外採用し、安定順序のため末尾に ROWID を付す（理由を sql_targets に明記）"
  - "緊急配信は業務データのコミット確定後に非同期で起動する。戻り値は受付 ID であり配信の成否ではない（承認版 §10.2 #7）"
  - "エラー応答は HTTP ステータス 200 とし、判定は本文の errorCode を正とする。errorCode は 0=正常／1=業務エラー／9=システムエラー（2 を使わない）。errorId は 4 桁（承認版 §12 #6）"
  - "前処理順は セッション → オンライン可否 → 権限 → 入力チェック。1 つでも失敗したら後続を実行しない（承認版 §12 #7）"
  - "CSV は UTF-8（BOM あり）・CRLF・ヘッダ行あり。列は一覧の 5 列で排他情報を含めない（承認版 §12 #15）"
  - "ログに実データ・機密値をそのまま出力しない。実値は占位（TBL_1／COL_1／VAL_1）で扱う（紅線⑦）"
  - "ID は ids.yml が唯一の発号口。L-212〜L-222／D-207〜D-212／E-213〜E-224 は素案（教学号段は ids.yml に登録しない・紅線①）"

