# 【境界値表】出所: 承認版 §4.1・§4.2・§6・§8・§11・§12
boundary_values:
  - item: "メーカーコード（I-329・マスタ画面の同項目）"
    min: "1 文字"
    max: "5 文字"
    boundary_handling: "半角英数字 1〜5 は可。0 文字（未入力）・6 文字以上・数字以外の文字は不可。修正では変更不可"
    source: "承認版 §4.1 #8・§4.2 #2・§8 #1"
  - item: "メーカー日本語名（I-330・マスタ画面の同項目）"
    min: "0 Byte"
    max: "30 Byte"
    boundary_handling: "UTF-8 で 30Byte ちょうどは可、31Byte は不可。使用不可文字（カンマ・アポストロフィ・ダブルクォート・パイプ）を含むと不可"
    source: "承認版 §4.1 #9・§4.2 #3・§8 #2・Q-277"
  - item: "メーカーカナ名（マスタ画面）"
    min: "0 文字"
    max: "15 文字"
    boundary_handling: "半角カナ 15 文字ちょうどは可、16 文字は不可。濁点・半濁点は独立した 1 文字として数える。使用不可文字（アポストロフィ・カンマ・円マーク・半角スペース）を含むと不可"
    source: "承認版 §4.2 #4・§8 #3"
  - item: "1 頁件数（I-333）"
    min: "10"
    max: "100"
    boundary_handling: "候補は 10／20／50／100 のみ。既定 20。それ以外の値は不可"
    source: "承認版 §4.1 #12・§8 #4・Q-246"
  - item: "検索結果件数"
    min: "0 件"
    max: "500 件"
    boundary_handling: "0 件は正常（E-213 を表示しつつ検索成功扱い）。500 件ちょうどは可、501 件は E-214 で出力しない"
    source: "承認版 §6 イベント2・§9 E-213/E-214・Q-263・Q-273・Q-280"
  - item: "頁番号（I-337・I-338）"
    min: "1"
    max: "総頁数"
    boundary_handling: "1 始まり。総件数 0 件のとき非活性。頁番号は画面が保持し検索条件とともに送る"
    source: "承認版 §4.1 #16/#17・§6 イベント3"
  - item: "CSV 出力（イベント8）"
    min: "0 件"
    max: "500 件・5MB・10 秒"
    boundary_handling: "500 件超・5MB 超は出力しない（E-214）。0 件の検索も押下できる。UTF-8（BOM あり）・CRLF・ヘッダ行あり"
    source: "承認版 §6 イベント8・§11 #7・§12 #15"

