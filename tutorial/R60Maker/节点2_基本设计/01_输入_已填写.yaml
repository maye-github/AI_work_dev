#     逐条标出 Q 编号或承认版章节。
#   设计字段 = 本节点要产出的内容，全部以「【AI 素案】」标记，未经设计评审（紅线③）不得视为已定。
#   build_mode = greenfield：物理表名在工程03 确定，堆栈在工程04 由人承认（紅线④）。
