    comments: "【AI 素案】検索条件領域の縮小／拡大。サーバ通信は行わない。状態は画面内で保持し、マスタ画面から戻っても維持する（Q-265）。出所：画面項目定義 I-336。"

  - item_id: I-337
    name: "【AI 素案】pagerTop"
    jp_name: "【AI 素案】ページャ（上部）"
    direction: in
    comments: "【AI 素案】先頭頁／前頁／頁番号／次頁／最終頁。頁番号は1始まり（Q-288）。総件数0件のときは非活性。共通部品 Pager を呼び出す。出所：画面項目定義 I-337・共通部品仕様 §3.2（仮想（教学用））。"

  - item_id: I-338
    name: "【AI 素案】pagerBottom"
    jp_name: "【AI 素案】ページャ（下部）"
    direction: in
    comments: "【AI 素案】I-337 と同一仕様。項目の単一ソースは I-337（本項目は I-337 を参照する）。出所：画面項目定義 I-338。"

  - item_id: I-339
    name: "【AI 素案】totalCount"
    jp_name: "【AI 素案】総件数"
    direction: out
    comments: "【AI 素案】検索結果の総件数。出所：画面項目定義 I-339・共通部品仕様 §3.2（仮想（教学用））。"

  - item_id: I-340
    name: "【AI 素案】makerCdHeader"
    jp_name: "【AI 素案】一覧見出し：メーカーコード"
    direction: in
    comments: "【AI 素案】押下でソート。利用者が指定できるソートはメーカーコード／メーカー日本語名の2項目のみ。指定時も削除区分を第1キーとして維持し、同値時はメーカーコード昇順（Q-261）。出所：承認版 §4.1 #8・画面項目定義 I-340。"

  - item_id: I-341
    name: "【AI 素案】makerCdCell"
    jp_name: "【AI 素案】一覧セル：メーカーコード"
    direction: out
    comments: "【AI 素案】押下で修正モードのマスタ画面を開く。行選択とは別の操作とする（Q-266）。出所：画面項目定義 I-341。"

  - item_id: I-342
    name: "【AI 素案】makerNmHeader"
    jp_name: "【AI 素案】一覧見出し：メーカー日本語名"
    direction: in
    comments: "【AI 素案】押下でソート。第2キーに指定し、同値時はメーカーコード昇順（Q-261）。出所：承認版 §4.1 #8・画面項目定義 I-342。"

  - item_id: I-343
    name: "【AI 素案】makerNmCell"
    jp_name: "【AI 素案】一覧セル：メーカー日本語名"
    direction: out
    comments: "【AI 素案】押下で修正モードのマスタ画面を開く。行選択とは別の操作（Q-266）。出所：画面項目定義 I-343。"

  - item_id: I-344
    name: "【AI 素案】makerKanaNmHeader"
    jp_name: "【AI 素案】一覧見出し：メーカーカナ名"
    direction: out
    comments: "【AI 素案】ソート不可。出所：画面項目定義 I-344・承認版 §4.1 #8。"

  - item_id: I-345
    name: "【AI 素案】makerKanaNmCell"
    jp_name: "【AI 素案】一覧セル：メーカーカナ名"
    direction: out
    comments: "【AI 素案】表示のみ。出所：画面項目定義 I-345。"

  - item_id: I-346
    name: "【AI 素案】sendStatusHeader"
    jp_name: "【AI 素案】一覧見出し：送信状態"
    direction: out
    comments: "【AI 素案】ソート不可。出所：画面項目定義 I-346・承認版 §4.1 #8。"

  - item_id: I-347
    name: "【AI 素案】sendStatusCell"
    jp_name: "【AI 素案】一覧セル：送信状態"
    direction: out
    comments: "【AI 素案】コード値マスタ『送信状態コード』の名称を表示する。コードを直接表示しない。送信状態9（送信エラー）のレコードも名称表示のみで、業務エラー扱いにも登録・更新の抑止にもしない（Q-304）。出所：画面項目定義 I-347・共通部品仕様 §7.1（仮想（教学用））。"

  - item_id: I-348
    name: "【AI 素案】deleteHeader"
    jp_name: "【AI 素案】一覧見出し：削除"
    direction: out
    comments: "【AI 素案】ソート不可。出所：画面項目定義 I-348・承認版 §4.1 #8。"

  - item_id: I-349
    name: "【AI 素案】deleteCell"
    jp_name: "【AI 素案】一覧セル：削除"
    direction: out
    comments: "【AI 素案】コード値マスタ『削除区分コード』の名称を表示する。出所：画面項目定義 I-349・共通部品仕様 §7.2（仮想（教学用））。"

  - item_id: I-350
    name: "【AI 素案】copyButton"
    jp_name: "【AI 素案】複製"
    direction: in
    comments: "【AI 素案】検索成功後、かつ行が選択されているとき活性。行未選択では非活性（Q-262）。複製モードのマスタ画面を開く。0件検索も検索成功として扱うため活性（Q-263）。出所：承認版 §5.1・画面項目定義 I-350。"

  - item_id: I-351
    name: "【AI 素案】backButton"
    jp_name: "【AI 素案】戻る"
    direction: in
    comments: "【AI 素案】検索成功後に活性。前の画面へ戻る（Q-253）。0件検索も検索成功として扱うため活性（Q-263）。出所：承認版 §5.1・画面項目定義 I-351。"

  - item_id: I-352
    name: "【AI 素案】businessEndButton"
    jp_name: "【AI 素案】業務終了"
    direction: in
    comments: "【AI 素案】常時活性。確認のうえ業務を終了する（Q-272）。遷移は共通部品の仕様に従い、本画面は遷移要求のみを出す（Q-253）。出所：承認版 §5.1・画面項目定義 I-352。"

  - item_id: I-353
    name: "【AI 素案】downloadButton"
    jp_name: "【AI 素案】ダウンロード"
    direction: in
    comments: "【AI 素案】検索成功後に活性。最後に実行した検索条件でCSVを出力する（画面の現在値は使わない。Q-264）。上限500件超過時は出力しない（Q-280）。CSVはUTF-8（BOMあり）・CRLF・ヘッダ行あり（Q-251）。列は一覧の5項目とし、排他情報は含めない（Q-291）。0件検索も検索成功として扱うため活性（Q-263）。出所：承認版 §4.1 #14・§6・画面項目定義 I-353。"

  - item_id: I-354
    name: "【AI 素案】newButton"
    jp_name: "【AI 素案】新規"
    direction: in
    comments: "【AI 素案】検索成功後に活性。新規モードのマスタ画面を開く。0件検索も検索成功として扱うため活性（Q-263）。出所：承認版 §5.1・画面項目定義 I-354。"

# =============================================================================
# 【6】db_tables —— 设计字段（AI 素案）
#   greenfield のため論理名のみ。物理名は工程03（詳細設計）で確定する（発明しない）。
#   出所（上游约束）：承認版 §4.3〜§4.5・§8、Q-242〜Q-305
# =============================================================================
db_tables:
  - table_name: "【AI 素案】メーカーマスタ（論理名。物理名は工程03 で確定）"
    usage: "read/write"
    note: "【AI 素案】SELECT／INSERT／UPDATE／論理削除。登録区分（1=仕掛／2=確定）、送信状態、削除区分、監査項目（登録者・登録日時・更新者・更新日時・改訂番号）を保持する。本画面は登録内容の確定操作を持たない（確定は夜間の共通マスタ確定処理）。出所：承認版 §4.3〜§4.5・§8 #4/#5・Q-243・Q-244。"

  - table_name: "【AI 素案】購入品目別仕入先マスタ（論理名。物理名は工程03 で確定）"
    usage: "read"
    note: "【AI 素案】被参照チェックの判定対象。参照の有無のみを確認し、更新しない。削除済みの参照元は数えない。出所：承認版 §4.4・§8 #6・Q-297・共通部品仕様 §5.4（仮想（教学用））。"

  - table_name: "【AI 素案】原材料仕入単価マスタ（論理名。物理名は工程03 で確定）"
    usage: "read"
    note: "【AI 素案】被参照チェックの判定対象。参照の有無のみを確認し、更新しない。削除済みの参照元は数えない。出所：承認版 §4.4・§8 #6・Q-297。"

  - table_name: "【AI 素案】コード値マスタ（論理名。物理名は工程03 で確定）"
    usage: "read"
    note: "【AI 素案】送信状態コード（0=未送信／1=送信中／2=送信済み／9=送信エラー）と削除区分コード（0=未削除／1=削除済み）の表示名称を取得する。コードを直接表示しない。出所：承認版 §8 #3・Q-242・共通部品仕様 §7（仮想（教学用））。"

  - table_name: "【AI 素案】メッセージマスタ（論理名。物理名は工程03 で確定）"
    usage: "read"
    note: "【AI 素案】画面に表示するメッセージの文面を取得する。画面側で文面を直書きしない。出所：承認版 §8 #1・Q-258・共通部品仕様 §8（仮想（教学用））。"

  - table_name: "【AI 素案】権限マスタ（論理名。物理名は工程03 で確定）"
    usage: "read"
    note: "【AI 素案】利用者1名につき1つの権限コード（MKR01／MKR02／MKR03）を取得し、エンドポイント別の可否を判定する。画面のボタン活性は補助であり、最終可否はサーバ側で決める。出所：承認版 §3・§8 #8・Q-254・Q-305・共通部品仕様 §4（仮想（教学用））。"

# =============================================================================
# 【7】common_functions —— 设计字段（AI 素案）
#   承認版 §8 #2 は「共通部品は本件では新規作成しない」とする。ただし build_mode は
#   greenfield であり、当方の既存資産は無い。したがって「呼出しのみ」と「提供元未確定」を
#   区別して書き、提供元は工程04 で確定する（Q-307）。工程02 の時点で「もう在る」とは書かない。
# =============================================================================
common_functions:
  - name: "【AI 素案】CommonHeader（共通ヘッダ。呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】画面タイトル・システム日時・会社名・部署名・ユーザー名を描画する。会社名・部署名・ユーザー名は別々の表示項目とし、連結しない。本件では新規作成しない（承認版 §8 #2）。出所：共通部品仕様 §3.1（仮想（教学用））・Q-241。提供元は Q-307。"

  - name: "【AI 素案】Pager（ページャ。呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】先頭頁／前頁／頁番号／次頁／最終頁と総件数を上部・下部の2か所に描画する。頁番号は1始まり、総件数0件で非活性。本件では新規作成しない（承認版 §8 #2）。出所：共通部品仕様 §3.2（仮想（教学用））・Q-241・Q-288。提供元は Q-307。"

  - name: "【AI 素案】SessionErrorScreen（セッションエラー画面。呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】errorCode=9 かつ errorId=9001 のとき、現在の画面を置換する。本件では新規作成しない（承認版 §8 #2）。出所：共通部品仕様 §3.3（仮想（教学用））・Q-298。提供元は Q-307。"

  - name: "【AI 素案】OnlineControlErrorScreen（オンライン制御エラー画面。呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】errorCode=9 かつ errorId=9002 のとき、現在の画面を置換する。本件では新規作成しない（承認版 §8 #2）。出所：共通部品仕様 §3.4（仮想（教学用））・Q-298。提供元は Q-307。"

  - name: "【AI 素案】SystemErrorScreen（システムエラー画面。呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】errorCode=9 かつ errorId が9001・9002以外のとき、現在の画面を置換する。本件では新規作成しない（承認版 §8 #2）。出所：共通部品仕様 §3.5（仮想（教学用））・Q-298。提供元は Q-307。"

  - name: "【AI 素案】ReferenceChecker.check（被参照チェック。呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】メーカーコードを渡し、参照件数（0=参照なし）を受ける。対象は購入品目別仕入先マスタ・原材料仕入単価マスタで、削除済みの参照元は数えない。想定外は CommonComponentException として errorId=9101 で処理中断し、0として扱わない。呼出しは削除の排他直前、および修正で削除をオンにして登録する場合（削除をオンにしない修正では呼ばない）。本件では新規作成しない（承認版 §8 #2）。出所：承認版 §4.3・§4.4・§8 #6・Q-245・Q-297・Q-299・共通部品仕様 §5（仮想（教学用））。提供元は Q-307。"

  - name: "【AI 素案】EmergencyDispatcher.dispatch（緊急配信。呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】業務ID・操作（1=登録／2=削除）・メーカーコード・日本語名・カナ名・利用者ID・発生時刻を渡し、非同期で配信を起動する。戻り値は受付IDであり配信の成否ではない。成否は画面へ返らず、送信状態（0=未送信／1=送信中／2=送信済み／9=送信エラー）で表す。業務データのコミット確定後に起動し、同一トランザクションにしない。失敗しても業務データをロールバックしない。本件では新規作成しない（承認版 §8 #2）。出所：承認版 §4.7・§8 #7・Q-242・Q-250・Q-295・Q-303・共通部品仕様 §6（仮想（教学用））。提供元は Q-307。"

  - name: "【AI 素案】権限チェック部品（エンドポイント別。呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】各APIの要求先頭で、エンドポイントごとに必要な権限コード（MKR01／MKR02／MKR03）を検証し、不足時は業務エラー（errorId=2004）として処理を中断する。画面のボタン活性制御は補助であり、本検証を代替しない。出所：承認版 §3・Q-254・Q-305・共通部品仕様 §4.2（仮想（教学用））。提供元は Q-307。"

  - name: "【AI 素案】メッセージ取得部品（呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】共通メッセージマスタから文面を取得する。/init の応答およびエラー応答の messages（{code, kind, text} の配列、kind は E／W／I／C）に用いる。出所：承認版 §8 #1・Q-257・Q-258・Q-290・共通部品仕様 §8（仮想（教学用））。提供元は Q-307。"

  - name: "【AI 素案】コード値取得部品（呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】送信状態コード・削除区分コードの表示名称を取得する。コードを直接表示しない。出所：承認版 §8 #3・Q-242・共通部品仕様 §7（仮想（教学用））。提供元は Q-307。"

  - name: "【AI 素案】監査項目付与部品（呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】登録者・登録日時・更新者・更新日時・改訂番号を付与する。本画面は値を設定しない。出所：承認版 §4.5 #4・§8 #5・Q-244。提供元は Q-307。"

  - name: "【AI 素案】共通ログ部品（呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】操作ログを出力する。本画面は個別ログを実装しない。出所：承認版 §8 #1・前提条件書 #15（仮想（教学用））。提供元は Q-307。"

  - name: "【AI 素案】セッション・オンライン可否判定部品（呼出しのみ・提供元未確定）"
    purpose: "【AI 素案】各APIの先頭でセッションの存在と有効期限（最終操作から30分）、およびオンライン稼働の可否を判定する。失敗時は errorCode=9／errorId=9001・9002 で通知し、画面がエラー画面へ置換する。出所：承認版 §6・§8 #9・Q-249・Q-298・共通部品仕様 §10.1（仮想（教学用））。提供元は Q-307。"

# =============================================================================
# 【8】error_ids —— 设计字段（AI 素案）
#   承認版 §7 の11事象＋サーバ側入力チェック（Q-296）を E-213〜E-224 に割り当てる。
#   errorCode は 0=正常／1=業務エラー／9=システムエラー。errorId は受領資料（仮想（教学用））の体系。
# =============================================================================
error_ids:
  - error_id: E-213
    condition: "【AI 素案】検索結果が0件"
    note: "【AI 素案】業務エラー（errorCode=1／errorId=1001）。明細を表示しない。0件も検索成功として扱い、複製・戻る・ダウンロード・新規は活性にする（Q-263）。メッセージは MSG-E-001（仮想（教学用））。出所：承認版 §7・§4.1 #9/#16・Q-263。"

  - error_id: E-214
    condition: "【AI 素案】検索結果が上限500件を超えた"
    note: "【AI 素案】業務エラー（1／1002）。明細・CSVを出力しない。ちょうど500件は許容する（Q-273）。出所：承認版 §7・§4.1 #10・Q-273・Q-280。"

  - error_id: E-215
    condition: "【AI 素案】新規・複製でメーカーコードが既に存在する"
    note: "【AI 素案】業務エラー（1／2001）。メーカーコードを強調表示する。削除済みレコードも存在とみなす（Q-275）。出所：承認版 §4.3・§7・Q-275。"

  - error_id: E-216
    condition: "【AI 素案】削除時に他のマスタから参照されている"
    note: "【AI 素案】業務エラー（1／2002）。削除しない。削除済みの参照元は数えない（Q-297）。出所：承認版 §4.4・§7・Q-297。"

  - error_id: E-217
    condition: "【AI 素案】他の利用者が先に更新していた（lastUpdateDatetime と revNo の少なくとも一方が不一致）"
    note: "【AI 素案】業務エラー（1／2003）。メッセージのみ表示し、項目の強調表示・フォーカス移動はしない（Q-300）。排他は両方の一致を要する（Q-294）。新規モードは排他情報を null で送り比較しない（Q-293）。出所：承認版 §4.3・§6・§7・Q-292〜Q-294・Q-300。"

  - error_id: E-218
    condition: "【AI 素案】被参照チェックの共通部品が想定外の結果を返した（CommonComponentException）"
    note: "【AI 素案】システムエラー（9／9101）。処理を中断し、システムエラー画面へ置換する。参照件数を0として扱わない。出所：承認版 §7・共通部品仕様 §5.5（仮想（教学用））。"

  - error_id: E-219
    condition: "【AI 素案】画面側の入力チェック違反（必須・桁・文字種・使用不可文字）"
    note: "【AI 素案】該当項目の背景色を変え、フォーカスを移す。サーバへ送らない。検索条件にも同じチェックを適用する（Q-278）。文面は共通メッセージマスタを優先する（Q-256）。出所：承認版 §4.6・§7・Q-256・Q-278。"

  - error_id: E-220
    condition: "【AI 素案】APIの権限検証で権限が不足している（エンドポイント別）"
    note: "【AI 素案】業務エラー（1／2004）。処理を中断し、画面遷移しない。画面のボタン活性制御とは独立に判定する（Q-305）。出所：承認版 §3・§7・Q-254・Q-305・共通部品仕様 §4.2（仮想（教学用））。"

  - error_id: E-221
    condition: "【AI 素案】セッション情報が存在しない、または最終操作から30分を超過した"
    note: "【AI 素案】システムエラー区分（9／9001）。セッションエラー画面へ置換する。出所：承認版 §7・§8 #9・Q-249・Q-298。"

  - error_id: E-222
    condition: "【AI 素案】オンライン利用が許可されていない（稼働時間外・計画停止）"
    note: "【AI 素案】システムエラー区分（9／9002）。オンライン制御エラー画面へ置換する。出所：承認版 §7・§8 #10・前提条件書 #1/#2（仮想（教学用））・Q-298。"

  - error_id: E-223
    condition: "【AI 素案】DBエラー・想定外の例外"
    note: "【AI 素案】システムエラー（9／9999）。ロールバックし、システムエラー画面へ置換する。出所：承認版 §7。"

  - error_id: E-224
    condition: "【AI 素案】サーバ側の入力チェック違反（画面側と同一条件）"
    note: "【AI 素案】業務エラー（1／2005）。メッセージを表示し、処理を中断する（画面遷移しない）。出所：承認版 §4.6・§7・Q-296・共通部品仕様 §10.1（仮想（教学用））。"

# =============================================================================
# 【9】constraints —— 上游事实的转记（逐条标出出处）
#   greenfield のためスタック・物理名は本節点で確定させない。
#   受領資料 4 本は仮想（教学用）であり、真案件では顧客発行の正式資料に置き換える。
# =============================================================================
constraints:
  - "greenfield のため既存資産は無い。スタックは工程04 で提案し人が承認する（紅线④）。本節点でスタックを確定させない。【出所：模板 §9・CLAUDE.md §1 紅线④】"
  - "DB は論理名のみを提案し、物理名は工程03（詳細設計）で確定する。それらしい物理名を発明しない。【出所：模板 §6（greenfield）】"
  - "ID は教学号段（R-202／F-202／I-322〜I-354／E-213〜E-224）。ids.yml には登録せず、tools.registry で発号しない。【出所：ユーザー指示・node-worker-contract §7】"
  - "対象は検索画面・マスタ画面の2画面と6つのAPI端点。端点はすべてPOSTで、パスは /R60Maker/ に続く init／search／download／initEdit／delete／edit。要求は {params: {...}} の1階層、項目名はキャメルケース。【出所：承認版 §2.1・§6・Q-286】"
  - "値の体系：検索区分は \"1\"=表示／\"0\"=仕掛表示、モードは \"1\"=新規／\"2\"=複製／\"3\"=修正、昇降順は \"asc\"／\"desc\"、ソート項目は \"makerCd\"／\"makerNm\"、頁番号は1始まり。【出所：承認版 §6・Q-287・Q-288】"
  - "エラー応答は errorCode 0=正常／1=業務エラー／9=システムエラー。errorCode に2は使わない。errorId は4桁（正常時は0000）。HTTPステータスはすべて200とし、判定は本文の errorCode を正とする。【出所：承認版 §6・§7・Q-289・共通部品仕様 §9（仮想（教学用））】"
  - "APIの前処理順は セッション → オンライン可否 → 権限 → 入力チェック。1つでも失敗したら後続を実行しない。【出所：承認版 §6・Q-296・Q-298・共通部品仕様 §10.1（仮想（教学用））】"
  - "権限は利用者1名につき1コード（MKR01=参照／MKR02=参照＋登録・更新／MKR03=全操作）。上位は下位を含む。エンドポイント別に検証し、不足は業務エラー（2004）として処理中断・画面遷移しない。画面のボタン活性は誤操作防止の補助であり、最終可否はサーバ側で決める。【出所：承認版 §3・Q-254・Q-305・共通部品仕様 §4（仮想（教学用））】"
  - "権限マトリクスの不可は5セル：download の2セル（MKR01・MKR02）、delete の2セル（MKR01・MKR02）、edit の1セル（MKR01）。この可否表は受領資料（仮想（教学用））の判断であり、真案件では顧客承認が必要（Q-309）。【出所：共通部品仕様 §4.2（仮想（教学用））・handoff §4 #3】"
  - "セッション有効期限は最終操作から30分。超過はセッションエラー画面へ置換（errorId=9001）。【出所：承認版 §8 #9・NFR標準 #12（仮想（教学用））・Q-249】"
  - "オンライン稼働は平日7:00–22:00（JST）。計画停止は毎週土曜22:00〜日曜7:00、毎月第3日曜0:00–6:00。稼働外はオンライン制御エラー画面（9002）。【出所：前提条件書 #1/#2（仮想（教学用））・承認版 §8 #10】"
  - "検索上限は500件。ちょうど500件は許容し、超過は業務エラーで明細・CSVを出力しない（Q-273・Q-280）。1頁件数は10／20／50／100、既定20。変更・クリアでは自動再検索しない（Q-269）。【出所：承認版 §4.1 #10/#11・Q-246・Q-273・Q-280】"
  - "0件検索も「検索成功」として扱い、複製・戻る・ダウンロード・新規を活性にする（Q-263）。明細は表示しない。【出所：承認版 §4.1 #9/#16・Q-263】"
  - "ソート可能な項目はメーカーコード／メーカー日本語名の2項目のみ。指定時も削除区分を第1キーとして維持し、同値時はメーカーコード昇順。カナ名・送信状態・削除はソート不可。【出所：承認版 §4.1 #7/#8・Q-261】"
  - "ダウンロードは最後に実行した検索条件を用いる（画面の現在値は使わない）。CSVはUTF-8（BOMあり）・CRLF・ヘッダ行あり。列は一覧の5項目で、排他情報は含めない。【出所：承認版 §4.1 #14・§6・Q-251・Q-264・Q-291】"

  - "削除は論理削除。削除済みデータは復活させない（削除チェックは外せず、登録ボタンは非活性）。削除ボタンと「削除チェック＋登録」は同一の削除処理とし、入力チェック・被参照・排他・緊急配信の条件も同一。【出所：承認版 §4.4・§4.5 #1・Q-267・Q-268】"
  - "キー重複チェックは削除済みレコードも「存在する」とみなす。名称（日本語名・カナ名）の重複は許容し、一意制約はメーカーコードのみ。【出所：承認版 §4.3・§4.5 #2・Q-275・Q-276】"
  - "排他は lastUpdateDatetime と revNo の両方の一致を要する。新規モードは null を送りサーバは比較しない。/initEdit は排他情報を返す。排他エラーはメッセージのみで項目強調しない。【出所：承認版 §6・§7・Q-292・Q-293・Q-294・Q-300】"
  - "被参照チェックは購入品目別仕入先マスタ・原材料仕入単価マスタを対象とし、削除済みの参照元は数えない。呼出しは削除の排他直前、および修正で削除をオンにして登録する場合。削除をオンにしない修正では呼ばない。想定外は 9101 で処理中断し、0として扱わない。【出所：承認版 §4.3/#4.4・§7・Q-297・Q-299・共通部品仕様 §5（仮想（教学用））】"
  - "緊急配信は共通部品を非同期で呼ぶ。成否は画面へ返らず、送信状態（0=未送信／1=送信中／2=送信済み／9=送信エラー）で表す。業務データのコミット確定後に起動し、同一トランザクションにしない。配信失敗で業務データをロールバックしない。削除時の配信指示は削除ボタン押下時点の画面値。【出所：承認版 §4.7・§8 #7・Q-242・Q-250・Q-282・Q-295・Q-303】"
  - "送信状態9のレコードは一覧に名称として表示するのみ。業務エラー扱いにも登録・更新の抑止にもしない。再送は本画面の機能外。【出所：承認版 §4.5 #3・Q-304】"
  - "監査項目（登録者・登録日時・更新者・更新日時・改訂番号）は共通部品が付与し、本画面は値を設定しない。【出所：承認版 §4.5 #4・§8 #5・Q-244】"
  - "登録区分は1=仕掛／2=確定。本画面からの登録はすべて仕掛で作成され、確定は夜間の共通マスタ確定処理が行う。本画面に確定操作は無い。一覧に登録ステータス列は設けない（Q-284）。【出所：承認版 §5.1・§8 #4・Q-243・Q-284】"
  - "入力チェックは画面側とサーバ側で同一条件。画面側の違反時は該当項目の背景色を変えフォーカスを移す。サーバ側は 2005 で処理中断。検索条件にも同じ使用不可文字チェックを適用する。【出所：承認版 §4.6・§7・Q-277・Q-278・Q-296】"
  - "メーカーコードは半角英数字1〜5文字（可変長）。日本語名はUTF-8で30Byte以内（全角可、使用不可：カンマ・アポストロフィ・ダブルクォート・パイプ）。カナ名は半角カナ15文字以内、濁点・半濁点は独立した1文字（使用不可：アポストロフィ・カンマ・円マーク・半角スペース）。【出所：承認版 §4.6・Q-274・Q-277】"
  - "画面タイトルの固定値は「メーカーマスタメンテ」。文書名「メーカーマスタメンテナンス」との不一致は固定値どおり実装する。【出所：承認版 §5.1・Q-283】"
  - "画面のシステム日時はサーバ時刻（NTP同期）を YYYY/MM/DD hh:mm:ss（JST）で表示し、端末時刻を使用しない。【出所：承認版 §5.1・前提条件書 #13（仮想（教学用））・Q-255】"
  - "文字コードはUTF-8。メーカー日本語名の30ByteはUTF-8のバイト数で判定する。【出所：前提条件書 #14（仮想（教学用））・NFR標準 #17（仮想（教学用））・Q-277】"
  - "大文字・小文字は既存値をそのまま保持し、同一視しない。移行時のコード変換は行わず、前後空白のtrimのみ行う。【出所：前提条件書 #9（仮想（教学用））】"
  - "非機能の標準値（Edge／Chrome 120以上、1366×768以上、一覧検索3秒以内95パーセンタイル、初期表示2秒以内、同時50セッション、可用性99.5%以上など）は NFR標準 v1.1（仮想（教学用））を合格基準とする。応答10秒超はタイムアウトメッセージを表示し、自動再実行しない。【出所：承認版 §8 #10・NFR標準（仮想（教学用）） #1〜#18】"
  - "戻る＝前画面、業務終了＝確認ダイアログ後に終了。遷移は共通部品の仕様に従い、本画面は遷移要求のみを出す。【出所：承認版 §8 #11・Q-253・Q-272】"
  - "メッセージ文面は共通メッセージマスタを優先し、画面側で文面を直書きしない。応答の messages は {code, kind, text} の配列（kind は E／W／I／C）。【出所：承認版 §8 #1・Q-256・Q-257・Q-290・共通部品仕様 §8（仮想（教学用））】"
  - "操作ログは共通ログ部品が出力し、本画面は個別ログを実装しない。【出所：前提条件書 #15（仮想（教学用））・承認版 §8 #1】"
  - "データ移行：既存メーカーマスタ1,850件（削除済み120件を含む）を全件移行し、削除区分・登録区分を保持する。移行はリリース前週末に1回。移行後の差分は本画面で修正する。受領資料は仮想（教学用）。【出所：前提条件書 #7/#8（仮想（教学用））・承認版 §9 #1】"
  - "利用部門は調達部・生産管理部、利用者は最大50名。同時利用数は50セッション。【出所：前提条件書 #4（仮想（教学用））・NFR標準 #8（仮想（教学用））】"

  - "本画面の対象外（Non-Goals）：購入品目別仕入先マスタ・原材料仕入単価マスタの各画面、緊急配信の配信処理そのもの、メーカー情報の一括取り込み（アップロード）、登録内容の確定操作、緊急配信の再送。前3者は本画面の機能ではなく、確定は夜間の共通マスタ確定処理、再送は本画面の機能外とする。【出所：承認版 §2.2 #1〜#5】"


  - "ヘッダセル押下＝ソート、セル内のコード・名称テキスト押下＝リンクとし、領域を分離して競合させない。【出所：承認版 §5.1・Q-270】"

  - "登録・削除の完了後は、最後に実行した検索条件で再検索し、頁番号は1頁目に戻す。仕掛表示の状態も引き継ぐ。【出所：承認版 §4.1・Q-271】"

  - "「削除時」＝削除ボタン押下、「削除を選択して登録するとき」＝修正画面で削除チェックをオンにして登録する場合。両方とも名称を必須とする。【出所：承認版 §4.4・Q-281】"

  - "「登録」ボタンは新規・複製・修正のすべてを扱う。処理は新規=INSERT／修正=UPDATE／削除=論理削除。「更新」はUPDATEを指す。【出所：承認版 §2・§4・Q-285】"

# =============================================================================
# 【10】open_questions —— 本节点新产生的未决
#   起点は Q-306（节点1 は Q-239〜Q-305 を使用済み）。节点1 の解決済み Q は再掲しない。
#   区分は question の冒頭に記す（A=顧客が決める／B=当方が提案し顧客が承認／C=当方内部で裁定）。
# =============================================================================
open_questions:
  - question_id: Q-306
    question: "【区分 C】マスタ画面の9項目（操作モード、メーカーコード、メーカー日本語名、メーカーカナ名、緊急配信、削除、戻る、削除ボタン、登録ボタン）に I-ID を付与するか。承認版 §5.2 は9項目を列挙するが、『R60 共通画面項目定義 v2.0』（仮想（教学用））は検索画面のみを対象とし、マスタ画面は対象外とする。I-ID 体系は I-322〜I-354 で、マスタ画面の番号が無い。"
    default_proposal: "本節点では I-34 以降を発明しない。設計書ではマスタ画面項目を名称で扱い、必要なら工程03 または設計評審で I-ID を発号する。"
    owner_to_decide: "人（設計評審）／当方 SE"

  - question_id: Q-307
    question: "【区分 B】承認版 §8 #2 は共通部品を「本件では新規作成しない」とし、受領資料（仮想（教学用））が I/F を定める。しかし build_mode は greenfield で当方の既存資産が無い。共通部品の実体は顧客基盤が提供するのか、本案件で新規定義するのか。"
    default_proposal: "受領資料 v3.0 の I/F を呼び出す前提で設計する。実体の提供元は工程04 で確定する。提供が無い場合は工程04 で新規定義候補として一覧化する。"
    owner_to_decide: "顧客 情報システム部門（提供範囲）／当方 SE（工程04）"

  - question_id: Q-308
    question: "【区分 C】画面実装ファイルのパス、物理テーブル名、技術スタックは greenfield のため本節点で確定できない。"
    default_proposal: "画面ファイルパスと技術スタックは工程04（人の承認）で、物理テーブル名は工程03 で確定する。本節点では null のままとする。"
    owner_to_decide: "当方 SE（工程03・工程04）"

  - question_id: Q-309
    question: "【区分 B】受領資料（仮想（教学用））§4.2 の権限マトリクス（download・delete は MKR03 のみ、edit は MKR02 以上）は、顧客の正式承認を得る必要があるか。承認版 §3 はエンドポイントごとに権限を定めるとするが、可否表そのものは受領資料の判断である。"
    default_proposal: "本演習では受領資料 §4.2 を採用する。真案件では顧客の情報システム部門に可否表を提示し、正式承認を得る。"
    owner_to_decide: "顧客 情報システム部門"

