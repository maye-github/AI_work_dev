# =============================================================================
target_module:
  module_code: "R60Maker"
  module_name: "メーカーマスタメンテナンス"
  summary: "調達・生産系共通マスタのうちメーカーマスタを検索・登録・更新・削除・ダウンロードする維持管理画面。検索画面とマスタ画面の2画面、6つのAPI端点で構成する。（出所：承認版 §1・§2.1・§3）"

# =============================================================================
# 【3】function_name —— 上游事实（F-202 は模板固定编号。教学号段のため ids.yml へ登録しない）
#   出所：承认版 §2.1（対象＝2画面と6端点）
# =============================================================================
function_name:
  function_id: F-202
  name: "R60Maker メーカーマスタメンテナンス機能"
  parent_requirement: R-202

# =============================================================================
# 【4】screen_list —— 设计字段（AI 素案）
#   出所（上游约束）：承认版 §3・§5.1・§5.2・§4.2
#   greenfield のため画面実装ファイルのパスは工程04 のスタック確定後に決まる（Q-308）。
# =============================================================================
screen_list:
  - screen_id: SCR-201
    file: null
    role: "【AI 素案】検索画面。メーカー情報の検索・一覧表示・CSVダウンロード・マスタ画面への遷移。"
    comments: "【AI 素案】画面項目は I-322〜I-354（33 件）で定義する。出所：承認版 §5.1・『R60 共通画面項目定義 v2.0』（仮想（教学用））§3。一覧の列はコード／日本語名／カナ名／送信状態／削除の5列とし、登録ステータス列は設けない（Q-284）。行選択は単一選択で、リンク押下は行選択と別操作（Q-266）。画面実装ファイルのパスは工程04 のスタック確定後に決まる（Q-308）。"

  - screen_id: SCR-202
    file: null
    role: "【AI 素案】マスタ画面。新規／複製／修正の登録と削除。"
    comments: "【AI 素案】画面項目は9項目：操作モード（新規／複製／修正）、メーカーコード、メーカー日本語名、メーカーカナ名、緊急配信、削除、戻る、削除ボタン、登録ボタン。出所：承認版 §5.2。上流はこの9項目に I-ID を付与していない（『R60 共通画面項目定義 v2.0』はマスタ画面を対象外とする）ため、io_items には計上せず、本欄に列挙する（Q-306）。初期化はモード別：新規＝全項目空・緊急配信オフ・削除欄ブランク、複製＝コード・日本語名・カナ名の3項目のみ引継ぎ・緊急配信オフ・削除欄ブランク、修正＝登録値をそのまま表示・メーカーコード変更不可（承認版 §4.2）。登録ボタンは常時活性で押下時に検査する（Q-301）。削除ボタンは新規・複製では非活性、修正では活性、削除済みでは非活性（承認版 §5.2）。変更なしで終了した場合は画面を閉じずに留まる（Q-302）。削除ボタンと削除チェック＋登録は同一の削除処理（Q-267）。緊急配信の判定は削除ボタン押下時点の画面値（Q-282）。画面実装ファイルのパスは工程04 のスタック確定後に決まる（Q-308）。"

# =============================================================================
# 【5】io_items —— 设计字段（AI 素案）
#   方針：同一業務フィールドは 1 項目だけ定義する（単一ソース NFR-1）。
#   番号は『R60 共通画面項目定義 v2.0』（仮想（教学用））の I-322〜I-354 をそのまま用いる。
#   direction は in/out。操作を伴う見出し・ボタン・ページャは in、表示専用は out とする。
#   マスタ画面の9項目は上流で I-ID 未付与のため io_items に計上しない（screen_list SCR-202 に列挙。Q-306）。
#   出所（上游约束）：承认版 §4・§5.1・§6・§7、Q-242〜Q-305
# =============================================================================
io_items:
  - item_id: I-322
    name: "【AI 素案】screenTitle"
    jp_name: "【AI 素案】画面タイトル"
    direction: out
    comments: "【AI 素案】固定値「メーカーマスタメンテ」。文書名「メーカーマスタメンテナンス」との不一致は固定値どおり実装する（Q-283）。出所：承認版 §5.1・画面項目定義 I-322（仮想（教学用））。"

  - item_id: I-323
    name: "【AI 素案】systemDateTime"
    jp_name: "【AI 素案】システム日時"
    direction: out
    comments: "【AI 素案】サーバ時刻（NTP同期）を YYYY/MM/DD hh:mm:ss（JST）で表示する。端末時刻は使用しない（Q-255）。出所：承認版 §5.1・前提条件書 #13（仮想（教学用））・画面項目定義 I-323。"

  - item_id: I-324
    name: "【AI 素案】companyName"
    jp_name: "【AI 素案】会社名"
    direction: out
    comments: "【AI 素案】ログイン利用者の会社名。共通ヘッダの細目で、部署名・ユーザー名とは別々の表示項目として描画する（連結しない）。出所：画面項目定義 I-324・共通部品仕様 §3.1（仮想（教学用））。"

  - item_id: I-325
    name: "【AI 素案】departmentName"
    jp_name: "【AI 素案】部署名"
    direction: out
    comments: "【AI 素案】ログイン利用者の部署名。共通ヘッダの細目。出所：画面項目定義 I-325・共通部品仕様 §3.1（仮想（教学用））。"

  - item_id: I-326
    name: "【AI 素案】userName"
    jp_name: "【AI 素案】ユーザー名"
    direction: out
    comments: "【AI 素案】ログイン利用者のユーザー名。共通ヘッダの細目。出所：画面項目定義 I-326・共通部品仕様 §3.1（仮想（教学用））。"

  - item_id: I-327
    name: "【AI 素案】messageArea"
    jp_name: "【AI 素案】メッセージ領域"
    direction: out
    comments: "【AI 素案】検索結果・完了・エラーのメッセージを表示する領域。文言は共通メッセージマスタから取得し、画面側で直書きしない（Q-258）。出所：画面項目定義 I-327・共通部品仕様 §8（仮想（教学用））。"

  - item_id: I-328
    name: "【AI 素案】confirmDialog"
    jp_name: "【AI 素案】確認・エラーダイアログ"
    direction: out
    comments: "【AI 素案】登録・削除・戻る・業務終了の確認、および入力エラーを表示するモーダル領域。確認文面は共通メッセージマスタを優先する（Q-257）。戻る＝前画面、業務終了＝確認後に終了（Q-253・Q-272）。出所：画面項目定義 I-328・共通部品仕様 §8（仮想（教学用））。"

  - item_id: I-329
    name: "【AI 素案】makerCd"
    jp_name: "【AI 素案】メーカーコード（検索条件）"
    direction: in
    comments: "【AI 素案】前方一致の検索条件。半角英数字1〜5文字（可変長）・最大入力5文字（Q-274）。使用できない文字は無し（文字種の制約のみ。Q-279 は要求書の誤記で無効）。出所：承認版 §4.1 #2・§4.6・画面項目定義 I-329。"

  - item_id: I-330
    name: "【AI 素案】makerNm"
    jp_name: "【AI 素案】メーカー日本語名（検索条件）"
    direction: in
    comments: "【AI 素案】中間一致の検索条件。UTF-8で30Byte以内。使用できない文字（カンマ・アポストロフィ・ダブルクォート・パイプ）のチェックを検索条件にも適用する（Q-278）。出所：承認版 §4.1 #3・§4.6・画面項目定義 I-330。"

  - item_id: I-331
    name: "【AI 素案】clearMakerNmButton"
    jp_name: "【AI 素案】メーカー日本語名クリア"
    direction: in
    comments: "【AI 素案】I-330 が空白でないとき活性。押下で I-330 を空白にする。項目の単一ソースは I-330（本項目は I-330 を参照する）。出所：画面項目定義 I-331。"

  - item_id: I-332
    name: "【AI 素案】includeDeleted"
    jp_name: "【AI 素案】削除含む"
    direction: in
    comments: "【AI 素案】チェックボックス。初期値はオフ。オンのとき削除済みも一覧に含める。仕掛表示との同時指定はANDとし、削除済みかつ仕掛のデータも対象に含める（Q-260）。出所：承認版 §4.1 #4/#5/#13・画面項目定義 I-332。"

  - item_id: I-333
    name: "【AI 素案】pageSize"
    jp_name: "【AI 素案】1頁件数"
    direction: in
    comments: "【AI 素案】ドロップダウン。候補は10／20／50／100件、既定は20件。変更では自動再検索しない（Q-269）。出所：承認版 §4.1 #11・Q-246・画面項目定義 I-333。"

  - item_id: I-334
    name: "【AI 素案】wipDisplay"
    jp_name: "【AI 素案】仕掛表示"
    direction: in
    comments: "【AI 素案】検索モードのトグル。初期表示は通常モード。押下で仕掛モードになり、その状態で「表示」を押すと通常モードに戻る（Q-259）。出所：承認版 §4.1 #6/#12・画面項目定義 I-334。"

  - item_id: I-335
    name: "【AI 素案】searchButton"
    jp_name: "【AI 素案】表示"
