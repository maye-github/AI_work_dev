#   受領資料 4 本は教学用の仮想資料である。出所に書くときは「仮想（教学用）」を併記する。
# =============================================================================

---
id: IN-201
type: node-input
req_ids: [R-202]
status: filled
sensitivity: internal
owner: AI-SE
version: 0.1.1

# =============================================================================
# 【1】source_requirement —— 上游事实
#   出所：承认版 front-matter・承认记录・表题
# =============================================================================
source_requirement:
  file: "tutorial/R60Maker/节点1_需求/04_承認版_需求结构化表.md"
  requirement_id: R-202

# =============================================================================
# 【2】target_module —— 上游事实
