output_endpoints:
  - endpoint: "/R60Maker/init"
    method: "POST"
    event_refs: ["イベント1 初期表示"]
    request_fields: ["入力を持たない（{}）"]
    response_fields: ["1頁件数の候補（値・表示名）", "メッセージ情報", "エラー区分"]
    source_clause: "§4.1 #1／§4.2"
  - endpoint: "/R60Maker/search"
    method: "POST"
    event_refs: ["イベント2 表示ボタンクリック", "イベント3 仕掛表示ボタンクリック"]
    request_fields: ["メーカーコード", "メーカー日本語名", "削除含む", "検索区分（1=表示／0=仕掛表示）", "1頁件数", "頁番号", "ソート項目", "昇降順"]
    response_fields: ["総件数", "明細の配列", "エラー区分"]
    source_clause: "§4.1 #2／§4.3"
  - endpoint: "/R60Maker/download"
    method: "POST"
    event_refs: ["イベント8 ダウンロードボタンクリック"]
    request_fields: ["§4.3 と同じ検索条件"]
    response_fields: ["CSV ファイル（添付）"]
    source_clause: "§4.1 #3／§4.4"
  - endpoint: "/R60Maker/initEdit"
    method: "POST"
    event_refs: ["イベント5 複製ボタンクリック", "イベント6 一覧データリンククリック", "イベント7 新規ボタンクリック"]
    request_fields: ["モード（1=新規／2=複製／3=修正）", "メーカーコード（複製・修正の場合）"]
    response_fields: ["モード別の初期値（§3.6 の表のとおり）"]
    source_clause: "§4.1 #4／§4.5"
  - endpoint: "/R60Maker/delete"
    method: "POST"
    event_refs: ["イベント11 削除ボタンクリック（マスタ）"]
    request_fields: ["メーカーコード", "メーカー日本語名", "メーカーカナ名", "緊急配信", "排他情報（最終更新日時・改訂番号）"]
    response_fields: ["エラー区分"]
    source_clause: "§4.1 #5／§4.6"
  - endpoint: "/R60Maker/edit"
    method: "POST"
    event_refs: ["イベント12 登録ボタンクリック（マスタ）"]
    request_fields: ["モード", "メーカーコード", "メーカー日本語名", "メーカーカナ名", "緊急配信", "削除", "排他情報（最終更新日時・改訂番号）"]
    response_fields: ["エラー区分"]
    source_clause: "§4.1 #6／§4.7"
exceptions:
  - event: "検索結果が0件"
    handling: "業務エラー。メッセージを表示し、明細を表示しない。"
    destination: "検索画面に留まる"
    source_clause: "§5"
  - event: "検索結果が上限件数を超えた"
    handling: "業務エラー。メッセージを表示し、明細を表示しない。"
    destination: "検索画面に留まる"
    source_clause: "§5"
  - event: "メーカーコードが既に存在する（新規・複製）"
    handling: "業務エラー。メーカーコードを強調表示する。"
    destination: "マスタ画面に留まる"
    source_clause: "§5／§3.7 新規・複製 手順7"
  - event: "他のマスタから参照されている（削除）"
    handling: "業務エラー。削除しない。"
    destination: "マスタ画面に留まる"
    source_clause: "§5／§3.8 手順4"
  - event: "他の利用者が先に更新していた（排他）"
    handling: "業務エラー。処理を中断する。"
    destination: "マスタ画面に留まる"
    source_clause: "§5／§3.7 修正 手順7／§3.8 手順5"
  - event: "被参照チェックの共通部品が想定外の結果を返した"
    handling: "システムエラー。処理を中断する。"
    destination: "遷移先の記載なし"
    source_clause: "§5"
  - event: "入力チェック違反（画面側）"
    handling: "該当項目を強調表示し、フォーカスを移す。サーバへは送らない。"
    destination: "画面に留まる"
    source_clause: "§5／§3.9"
  - event: "セッション情報が存在しない"
    handling: "セッションエラー画面へ遷移する。"
    destination: "セッションエラー画面"
    source_clause: "§5／§3.4"
  - event: "オンライン利用が許可されていない"
    handling: "オンライン制御エラー画面へ遷移する。"
    destination: "オンライン制御エラー画面"
    source_clause: "§5／§3.4"
  - event: "API の権限検証で権限が不足している"
    handling: "業務エラー。処理を中断する。画面のボタン活性制御は補助であり、これとは独立に判定する。"
    destination: "画面に留まる（エラー区分で通知）"
    source_clause: "§5／§3.1"
  - event: "DB エラー・想定外の例外"
    handling: "ロールバックし、システムエラー画面へ遷移する。"
    destination: "システムエラー画面"
    source_clause: "§5"
  - event: "登録確認で No"
    handling: "中断する（エラーではない）。"
    destination: "マスタ画面に留まる"
    source_clause: "§3.7 新規・複製 手順6／修正 手順5"
  - event: "変更なし（複製・修正）"
    handling: "登録せずメッセージを表示して終了する。"
    destination: "記載なし（画面に留まるか閉じるか未記載）"
    source_clause: "§3.7 新規・複製 手順5／修正 手順4"
  - event: "削除確認で No"
    handling: "中断する（エラーではない）。"
    destination: "マスタ画面に留まる"
    source_clause: "§3.8 手順3"
