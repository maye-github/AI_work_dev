---
schema_version: "1"
case_ref: "R60Maker"
req_ref: "R-202"
title: "メーカーマスタメンテナンス（R60Maker）画面 要求構造化表"
status: "draft"
sensitivity: "internal"
owner: "AI-SE"
version: "0.2.0"
background: >-
  調達・生産系の各種マスタを新しい基盤で構築するにあたり、メーカー（資材・原材料の供給元）の情報を
  維持管理する画面が必要である。メーカーマスタは購入品目別仕入先マスタおよび原材料仕入単価マスタから
  参照される基礎データであり、登録・変更・削除の際に他マスタからの参照関係を壊さないことが求められる。
  本要求は新規構築であり、対象はメーカーマスタメンテナンスの検索画面・マスタ画面およびその API である。
scope:
  in_scope:
    - "メーカーマスタメンテナンスの検索画面"
    - "メーカーマスタメンテナンスのマスタ画面（新規・複製・修正）"
    - "上記2画面が利用する6つの API 端点"
  api_common: '6端点はすべて POST。パスは /R60Maker/<name>。要求は {"params": {...}} の形式、応答の項目名はキャメルケースとする。'
non_goals:
  - "購入品目別仕入先マスタの画面そのもの（本画面は参照の有無を確認するのみ）"
  - "原材料仕入単価マスタの画面そのもの（本画面は参照の有無を確認するのみ）"
  - "緊急配信の配信処理そのもの（本画面は弊社の共通部品を呼び出すのみ）"
  - "メーカー情報の一括取り込み（アップロード）"
business_rules:
  - rule_no: "BR-01"
    summary: "検索条件は AND で結合し、空の条件は検索条件に含めない。"
    source_clause: "§3.5 条件の組み合わせ"
  - rule_no: "BR-02"
    summary: "メーカーコードは前方一致（入力値で始まるもの）で検索する。"
    source_clause: "§3.5 表"
  - rule_no: "BR-03"
    summary: "メーカー日本語名は中間一致（入力値を含むもの）で検索する。"
    source_clause: "§3.5 表"
  - rule_no: "BR-04"
    summary: "削除含むがオフのとき、削除済みのデータを検索対象から除く。"
    source_clause: "§3.5 表"
  - rule_no: "BR-05"
    summary: "削除含むがオンのとき、削除済みのデータも検索対象に含める。"
    source_clause: "§3.5 表"
  - rule_no: "BR-06"
    summary: "仕掛表示は登録が未確定のデータのみを対象とし、確定済みは対象外とする。"
    source_clause: "§3.5 表／§3.2 #8"
  - rule_no: "BR-07"
    summary: "既定の並び順は、削除済みかどうか（未削除を先）の次にメーカーコードの昇順とする。"
    source_clause: "§3.5 並び順"
  - rule_no: "BR-08"
    summary: "利用者がソートを指定できるのはメーカーコードとメーカー日本語名の2項目のみとし、それ以外の指定は受け付けず既定の並び順とする。"
    source_clause: "§3.5 並び順"
  - rule_no: "BR-09"
    summary: "該当0件の場合は一覧を表示せずメッセージを表示する。"
    source_clause: "§3.5 件数／§5"
  - rule_no: "BR-10"
    summary: "上限件数を超えた場合は一覧を表示せずメッセージを表示する。上限値は弊社の共通仕様による。"
    source_clause: "§3.5 件数"
  - rule_no: "BR-11"
    summary: "ページングは画面で選択した1頁件数を用い、頁の移動は弊社標準規約による。"
    source_clause: "§3.5 ページング"
  - rule_no: "BR-12"
    summary: "ダウンロードは直前に実行した検索条件をそのまま用い、出力項目と並び順は一覧と同じとする。ファイル形式・文字コード・ファイル名は弊社標準規約による。"
    source_clause: "§3.5 ダウンロード"
  - rule_no: "BR-13"
    summary: "表示ボタンは検索条件による検索を、仕掛表示ボタンは登録が未確定のデータのみを対象とする検索を実行する。"
    source_clause: "§3.4 #2／#3"
  - rule_no: "BR-14"
    summary: "一覧のメーカーコードまたはメーカー日本語名のリンク押下で、選択行を引き継いだ修正のマスタ画面を開く。"
    source_clause: "§3.2 #13／#14／§3.4 #6"
  - rule_no: "BR-15"
    summary: "複製ボタンは選択した行の内容を引き継ぎ、複製のマスタ画面を開く。"
    source_clause: "§3.2 #12／§3.4 #5"
  - rule_no: "BR-16"
    summary: "新規ボタンは新規のマスタ画面を開く。"
    source_clause: "§3.2 #21／§3.4 #7"
  - rule_no: "BR-17"
    summary: "マスタ画面は新規・複製・修正の3つのモードを持ち、操作モードの項目にいずれかを表示する。"
    source_clause: "§3.3 #1／§3.6"
  - rule_no: "BR-18"
    summary: "新規モードは引継ぎ値なしとし、全項目を空、緊急配信をオフ、削除欄をブランクとする。"
    source_clause: "§3.6 表"
  - rule_no: "BR-19"
    summary: "複製モードはメーカーコード・メーカー日本語名・メーカーカナ名の3項目のみを引き継ぎ、緊急配信をオフ、削除欄をブランクとする。"
    source_clause: "§3.6 表"
  - rule_no: "BR-20"
    summary: "複製は新規登録の下書きであり、緊急配信と削除の状態は引き継がない。"
    source_clause: "§3.6 複製の扱い"
  - rule_no: "BR-21"
    summary: "修正モードは対象行の全項目を登録されている値のまま表示し、メーカーコードは変更できない。"
    source_clause: "§3.6 表／§3.3 #2"
  - rule_no: "BR-22"
    summary: "登録ボタン押下時は、示された順に確認し、違反した時点で処理を中断する。"
    source_clause: "§3.7 冒頭"
  - rule_no: "BR-23"
    summary: "新規・複製では、メーカーコードが未入力ならエラーとする。"
    source_clause: "§3.7 新規・複製 手順1"
  - rule_no: "BR-24"
    summary: "新規・複製では、メーカーコードが半角英数字5文字以内でなければエラーとする。"
    source_clause: "§3.7 新規・複製 手順2"
  - rule_no: "BR-25"
    summary: "新規・複製では、緊急配信がオンのとき、日本語名・カナ名が未入力ならエラーとする。"
    source_clause: "§3.7 新規・複製 手順3／§3.10"
  - rule_no: "BR-26"
    summary: "新規・複製では、日本語名・カナ名が §3.9 の条件を満たさなければエラーとする。"
    source_clause: "§3.7 新規・複製 手順4"
  - rule_no: "BR-27"
    summary: "複製では、全項目が引き継いだ値のままなら登録せずメッセージを表示して終了する。"
    source_clause: "§3.7 新規・複製 手順5"
  - rule_no: "BR-28"
    summary: "登録確認を利用者に求め、No なら中断する。"
    source_clause: "§3.7 新規・複製 手順6"
  - rule_no: "BR-29"
    summary: "新規・複製では、同じメーカーコードが既に存在する場合エラーとし、エラー時はメーカーコードを強調表示する。"
    source_clause: "§3.7 新規・複製 手順7／§5"
  - rule_no: "BR-30"
    summary: "新規・複製では、新規レコードとして登録する。"
    source_clause: "§3.7 新規・複製 手順8"
  - rule_no: "BR-31"
    summary: "修正では、緊急配信がオンのとき、日本語名・カナ名が未入力ならエラーとする。"
    source_clause: "§3.7 修正 手順1"
  - rule_no: "BR-32"
    summary: "修正では、削除をオンにして登録するとき、日本語名・カナ名が未入力ならエラーとする。"
    source_clause: "§3.7 修正 手順2"
  - rule_no: "BR-33"
    summary: "修正では、日本語名・カナ名が §3.9 の条件を満たさなければエラーとする。"
    source_clause: "§3.7 修正 手順3"
  - rule_no: "BR-34"
    summary: "修正では、全項目が変更されていなければ登録せずメッセージを表示して終了する。"
    source_clause: "§3.7 修正 手順4"
  - rule_no: "BR-35"
    summary: "修正でも登録確認を利用者に求め、No なら中断する。"
    source_clause: "§3.7 修正 手順5"
  - rule_no: "BR-36"
    summary: "修正では、削除をオンにした場合のみ被参照チェックを行い、参照されていれば削除できない。"
    source_clause: "§3.7 修正 手順6／§3.8"
  - rule_no: "BR-37"
    summary: "修正では排他を行い、他の利用者が先に更新していた場合はエラーとして処理を中断する。"
    source_clause: "§3.7 修正 手順7"
  - rule_no: "BR-38"
    summary: "修正では既存レコードを更新し、削除をオンにした場合は論理削除とする。"
    source_clause: "§3.7 修正 手順8"
  - rule_no: "BR-39"
    summary: "登録・更新の完了時は完了メッセージを表示し、マスタ画面を閉じて一覧を再検索する。"
    source_clause: "§3.7 登録・更新の共通"
  - rule_no: "BR-40"
    summary: "登録・更新で緊急配信がオンの場合は、完了後に緊急配信の処理を起動する。"
    source_clause: "§3.7 登録・更新の共通／§3.10"
  - rule_no: "BR-41"
    summary: "削除ボタン押下時も、示された順に確認し、違反した時点で処理を中断する。"
    source_clause: "§3.8 冒頭"
  - rule_no: "BR-42"
    summary: "削除では、緊急配信のオン・オフにかかわらず、日本語名・カナ名が未入力ならエラーとする。"
    source_clause: "§3.8 手順1"
  - rule_no: "BR-43"
    summary: "削除では、日本語名・カナ名が §3.9 の条件を満たさなければエラーとする。"
    source_clause: "§3.8 手順2"
  - rule_no: "BR-44"
    summary: "削除確認を利用者に求め、No なら中断する。"
    source_clause: "§3.8 手順3"
  - rule_no: "BR-45"
    summary: "購入品目別仕入先マスタまたは原材料仕入単価マスタから参照されている場合は削除できない。"
    source_clause: "§3.8 手順4"
  - rule_no: "BR-46"
    summary: "削除でも排他を行い、他の利用者が先に更新していた場合はエラーとして処理を中断する。"
    source_clause: "§3.8 手順5"
  - rule_no: "BR-47"
    summary: "削除は論理削除とし、物理削除は行わない。"
    source_clause: "§3.8 手順6"
  - rule_no: "BR-48"
    summary: "緊急配信が指示されている場合、緊急配信の処理を起動する。"
    source_clause: "§3.8 手順7"
  - rule_no: "BR-49"
    summary: "削除の完了時は完了メッセージを表示し、マスタ画面を閉じて一覧を再検索する。"
    source_clause: "§3.8 手順8"
  - rule_no: "BR-50"
    summary: "参照の有無は弊社の共通部品で判定する。"
    source_clause: "§3.8 被参照チェックの考え方／§3.11"
  - rule_no: "BR-51"
    summary: "削除ボタンは新規・複製では非活性、修正では活性、削除済みのデータでは非活性とする。"
    source_clause: "§3.3 #8"
  - rule_no: "BR-52"
    summary: "修正の削除チェックは、オンにして登録すると削除となり、削除済みのデータを開いた場合はチェック済みで表示する。"
    source_clause: "§3.3 #6"
  - rule_no: "BR-53"
    summary: "メーカーコードは新規・複製では必須（修正では変更不可）、半角英数字5文字以内、使用できない文字は「−」とする。"
    source_clause: "§3.9 表"
  - rule_no: "BR-54"
    summary: "メーカー日本語名は緊急配信の指定時・削除時・削除を選択して登録するとき必須、30Byte以内（全角使用可）、使用できない文字はカンマ・アポストロフィ・ダブルクォート・パイプとする。"
    source_clause: "§3.9 表"
  - rule_no: "BR-55"
    summary: "メーカーカナ名は日本語名と同じ条件で必須、半角カナ15文字以内、使用できない文字はアポストロフィ・カンマ・円マーク・半角スペースとする。"
    source_clause: "§3.9 表"
  - rule_no: "BR-56"
    summary: "入力チェックに違反したときは該当項目の背景色を変え、その項目にフォーカスを移す。メッセージの文面は弊社標準規約による。"
    source_clause: "§3.9 違反したときの扱い"
  - rule_no: "BR-57"
    summary: "検索画面のメーカーコード・メーカー日本語名も同じ桁・文字種で確認し、違反した場合は検索を行わず該当項目にフォーカスを移す。"
    source_clause: "§3.9 検索条件の入力チェック"
  - rule_no: "BR-58"
    summary: "緊急配信にチェックを付けて登録または削除した場合、弊社の共通部品による緊急配信の処理を起動する。本画面はこれを呼び出すのみである。"
    source_clause: "§3.10 第1項"
  - rule_no: "BR-59"
    summary: "緊急配信を指定するときは、メーカー日本語名とメーカーカナ名の入力が必須である。"
    source_clause: "§3.10 第2項"
  - rule_no: "BR-60"
    summary: "一覧には送信状態を表示する。"
    source_clause: "§3.10 第3項／§3.2 #16"
  - rule_no: "BR-61"
    summary: "緊急配信の初期値はオフとする。"
    source_clause: "§3.3 #5"
  - rule_no: "BR-62"
    summary: "エラー応答・メッセージ・ログの形式は弊社の標準規約による。正常／業務エラー／システムエラーの区分けおよびエラーコード体系も標準規約の方式による。"
    source_clause: "§3.11 第1項／§5"
  - rule_no: "BR-63"
    summary: "共通ヘッダ・ページャ・セッションエラー画面・オンライン制御エラー画面・システムエラー画面は弊社の共通部品であり、本件ではこれらを呼び出し、新規に作成しない。"
    source_clause: "§3.11 第2項／§2"
  - rule_no: "BR-64"
    summary: "コード値の名称（送信状態・削除の区分など）は弊社のコード値マスタから取得し、本画面は取得して表示するのみとする。"
    source_clause: "§3.11 第3項"
  - rule_no: "BR-65"
    summary: "登録ステータス（仕掛／確定）の判定基準は弊社の共通仕様による。本画面はその結果を用いるのみとする。"
    source_clause: "§3.11 第4項"
  - rule_no: "BR-66"
    summary: "監査項目（登録者・登録日時・更新者・更新日時・改訂番号など）の付与は弊社の共通仕様による。本画面が個別に値を決めない。"
    source_clause: "§3.11 第5項"
  - rule_no: "BR-67"
    summary: "1頁件数の候補および検索の上限件数は弊社の共通仕様による。"
    source_clause: "§3.11 第7項"
  - rule_no: "BR-68"
    summary: "非機能（対応ブラウザ・画面解像度・同時利用数・性能）は弊社の標準に従う。"
    source_clause: "§3.11 第8項"
  - rule_no: "BR-69"
    summary: "セッションの有効期限・タイムアウト時の扱いは弊社の共通仕様による。本画面は新たにセッションを生成しない。"
    source_clause: "§3.11 第9項"
  - rule_no: "BR-70"
    summary: "すべてのイベントに共通する前提として、セッション情報が存在しない場合はセッションエラー画面へ、オンライン利用が許可されていない場合はオンライン制御エラー画面へ遷移する。"
    source_clause: "§3.4 すべてのイベントに共通する前提／§5"
input_items:
  - item_no: "S-01"
    screen: "検索画面"
    name: "画面タイトル"
    kind: "ラベル"
    required_when: null
    max_length: null
    char_type: null
    initial_value: "固定値「メーカーマスタメンテ」"
    source_clause: "§3.2 #1"
  - item_no: "S-02"
    screen: "検索画面"
    name: "システム日時"
    kind: "ラベル"
    required_when: null
    max_length: null
    char_type: null
    initial_value: "弊社標準規約による"
    source_clause: "§3.2 #2／§3.11"
  - item_no: "S-03"
    screen: "検索画面"
    name: "会社／部署／ユーザー名"
    kind: "ラベル"
    required_when: null
    max_length: null
    char_type: null
    initial_value: "ログイン中の利用者の情報"
    source_clause: "§3.2 #3"
  - item_no: "S-04"
    screen: "検索画面"
    name: "メーカーコード"
    kind: "テキストボックス"
    required_when: "任意（空のとき検索条件に含めない）"
    max_length: 5
    char_type: "半角英数字"
    initial_value: "空白"
    source_clause: "§3.2 #4／§3.5"
  - item_no: "S-05"
    screen: "検索画面"
    name: "メーカー日本語名"
    kind: "テキストボックス（入力を消すボタンを添える）"
    required_when: "任意（空のとき検索条件に含めない）"
    max_length: 30
    char_type: "全角可（30Byte 以内）"
    initial_value: "空白"
    source_clause: "§3.2 #5／§3.5"
  - item_no: "S-06"
    screen: "検索画面"
    name: "削除含む"
    kind: "チェックボックス"
    required_when: null
    max_length: null
    char_type: null
    initial_value: "オフ"
    source_clause: "§3.2 #6／§3.5"
  - item_no: "S-07"
    screen: "検索画面"
    name: "1頁件数"
    kind: "ドロップダウン"
    required_when: null
    max_length: null
    char_type: null
    initial_value: "既定の候補"
    source_clause: "§3.2 #7／§3.11"
  - item_no: "S-08"
    screen: "検索画面"
    name: "仕掛表示"
    kind: "ボタン"
    required_when: null
    max_length: null
    char_type: null
    initial_value: "活性"
    source_clause: "§3.2 #8／§3.4 #3"
  - item_no: "S-09"
    screen: "検索画面"
    name: "表示"
    kind: "ボタン"
    required_when: null
    max_length: null
    char_type: null
    initial_value: "活性"
    source_clause: "§3.2 #9／§3.4 #2"
  - item_no: "S-10"
    screen: "検索画面"
    name: "検索条件(非)表示"
    kind: "ボタン"
    required_when: null
    max_length: null
    char_type: null
    initial_value: "活性"
    source_clause: "§3.2 #10／§3.4 #4"
  - item_no: "S-11"
    screen: "検索画面"
    name: "ページャ（上部・下部）"
    kind: "リンク・ラベル"
