# =============================================================================
# 【API 序列】順序を固定して書く。順序が実装依存になると期待値が定まらない。
#   6 端点はいずれもルート直下（プレフィックス無し）。共通前処理 L-212 を全端点が通る。
# =============================================================================
api_sequence:
  - step: 1
    method: POST
    path: /init
    expect: |
      入力なし。HTTP 200・errorCode="0"。1 頁件数候補 {10,20,50,100}（既定 20）・
      メッセージ 15 件（MSG-C-001〜004・MSG-I-001〜003・MSG-E-001〜008）・初期フラグ
      （通常・削除含むオフ・条件部拡大・一覧空・総件数 0・ページャ非活性）を返す。
      前処理で権限（E-220）・Session 30 分（E-221）・稼働時間（E-222）を判定する。
  - step: 2
    method: POST
    path: /search
    expect: |
      params（maker_cd 前方一致・maker_nm 中間一致・include_deleted・page_size・
      shikake_mode・page_no・sort_field）。総件数を先に取り、次に当頁分を取る 2 段。
      501 件以上は E-214（明細も CSV も返さない）。0 件は E-213 だが**検索成功扱い**
      （errorCode="1" でも複製・戻る・ダウンロード・新規は活性）。
      並び順は削除区分（未削除先）→メーカーコード昇順。
  - step: 3
    method: POST
    path: /initEdit
    expect: |
      mode="2"（複製）はコード・名称・カナの 3 項目のみ引き継ぎ、mode="3"（修正）は
      現在値＋last_update_datetime＋rev_no を返す。削除済みは削除固定・登録ボタン非活性。
      対象なし（mode=3 で該当行なし）は E-223（想定外の例外）に落とす。
  - step: 4
    method: POST
    path: /edit
    expect: |
      mode="1"（新規）はキー重複を判定してから INSERT（reg_kbn=1・send_sts=0・del_flg=0・rev_no=1）。
      mode="3"（修正）は両キー（maker_cd＋rev_no）一致を確認して UPDATE（rev_no=旧+1）。
      重複は E-215、排他不一致は E-217、被参照は E-216。**この端点だけが INSERT/UPDATE を発行する。**
  - step: 5
    method: POST
    path: /delete
    expect: |
      被参照チェック（D-208・D-209。削除済みの参照元は数えない）→ 排他（両キー一致）→
      **論理削除**（del_flg=1）。物理削除文は 1 文も発行しない。被参照ありは E-216、
      排他不一致は E-217、被参照チェックの想定外は E-218。**この端点だけが UPDATE を発行する。**
  - step: 6
    method: POST
    path: /download
    expect: |
      最後の検索条件で全件を取る（頁送り無し）。CSV は UTF-8（BOM あり）・CRLF・
      ヘッダ行あり・5 列。**排他情報（last_update_datetime・rev_no）を含めない。**
      500 件超は E-214 で CSV を出さない。読取のみ。

# =============================================================================
# 【E2E 场景】承認済み要求の受入基準に対応づける（A/B 比較はしない）
#   要求 §4 業務規則と §5 イベント（12 件）に 1 対 1 で寄せる。
# =============================================================================
e2e_scenarios:
  - scenario_id: E2E-201
    name: 初期表示から検索までの貫通
    steps: 検索画面を開く → /init → 条件入力（コード前方一致・名称中間一致）→ /search → 一覧表示
    expected: |
      タイトル（I-322「メーカーマスタメンテ」）・1 頁件数（I-333 既定 20）・
      一覧 5 列・総件数（I-339）が表示される。受入基準＝要求 §5 イベント1・2、§4 業務規則
  - scenario_id: E2E-202
    name: 検索0件でも画面が死なない
    steps: 一致しない条件で検索 → 0 件表示 → 複製ボタン押下
    expected: |
      errorCode="1"／errorId="1001"（E-213）だが**検索成功扱い**。複製・戻る・ダウンロード・
      新規が活性のまま。受入基準＝要求 §4（0 件の扱い）・設計 §2 の E-213 行
  - scenario_id: E2E-203
    name: 修正の往復（取得→更新→一覧反映）
    steps: 行選択 → 修正 → /initEdit(mode=3) → 値変更 → /edit(mode=3) → 一覧再検索
    expected: |
      rev_no が旧+1 になり、last_update_datetime が更新される。一覧に変更後の値が出る。
      受入基準＝要求 §5 イベント7・12、設計 L-217／L-220
  - scenario_id: E2E-204
    name: 新規作成の往復
    steps: 新規 → /initEdit(mode=2) 不要 → 入力 → /edit(mode=1) → 一覧再検索
    expected: |
      1 行増える。reg_kbn=1（仕掛）・send_sts=0（未送信）・del_flg=0・rev_no=1。
      受入基準＝要求 §5 イベント5・12、設計 L-220
  - scenario_id: E2E-205
    name: 論理削除と一覧からの消え方
    steps: 行選択 → 削除チェック → /delete → 一覧再検索（削除含むオフ）→ 削除含むオンで再検索
    expected: |
      del_flg=1 になる。削除含むオフでは一覧から消え、オンでは削除済みとして現れる。
      **物理削除文は 0 文**。受入基準＝要求 §5 イベント11、設計 L-219
  - scenario_id: E2E-206
    name: 二重登録されないこと
    steps: 登録ボタンを連打 → /edit が 2 回飛ぶ状況を作る
    expected: |
      2 回目は排他不一致（E-217）またはキー重複（E-215）で止まり、**2 行にならない**。
      失敗時に残してはいけない状態＝二重行・中途半端な rev_no の増加
  - scenario_id: E2E-207
    name: 異常系の貫通（Session・稼働・権限）
    steps: 最終操作から 30 分経過 → /search ／ 稼働時間外に /init ／ MKR01 で /edit
    expected: |
      E-221→SessionErrorScreen、E-222→OnlineControlErrorScreen、E-220→処理中断・遷移なし。
      **画面遷移先まで確認する**（errorCode だけ見て合格にしない）
  - scenario_id: E2E-208
    name: ダウンロードと排他情報の非露出
    steps: 検索成功 → ダウンロード → CSV を開く
    expected: |
      UTF-8 BOM・CRLF・ヘッダ行・5 列。last_update_datetime と rev_no の列が**無い**。
      受入基準＝要求 §5 イベント8、設計 L-218

# =============================================================================
# 【前端呼び出しチェーン】どこからどこへ流れるか（層を飛ばさない）
# =============================================================================
frontend_call_chain:
  - layer: view
    ref: tutorial/R60Maker/节点5_制造/frontend/views/SearchScreen.vue
    note: 検索画面。イベント 1〜5・8〜10 の起点。二度押し防止を通す
  - layer: view
    ref: tutorial/R60Maker/节点5_制造/frontend/views/MakerEditScreen.vue
    note: マスタ画面（登録・修正・複製・削除）。イベント 5〜7・11・12 の起点
  - layer: store
    ref: tutorial/R60Maker/节点5_制造/frontend/stores/searchState.ts
    note: 最後の検索条件の保持（ダウンロードと削除後の再検索がこれを使う）
  - layer: service
    ref: tutorial/R60Maker/节点5_制造/frontend/services/makerApi.ts
    note: init／search／download／initEdit／delete／edit の 6 呼出しのみ
  - layer: common
    ref: tutorial/R60Maker/节点5_制造/frontend/common/customerParts.ts
    note: 画面共通部品。入力チェック（E-219）はここで止め、サーバへ送らない

# =============================================================================
# 【DB 事务边界】書くのは /edit と /delete の 2 端点だけ
# =============================================================================
db_transaction_boundary:
  begin: 各端点のリクエスト処理開始時（明示的な BEGIN は発行しない）
  read_endpoints: "/init・/search・/initEdit・/download は SELECT のみ。1 文も書かない"
  write_endpoints: "/edit（INSERT または UPDATE）・/delete（UPDATE: del_flg=1）"
  operations: |
    D-207（メーカーマスタ）への INSERT/UPDATE。参照チェックで D-208・D-209 を SELECT。
    D-210（コード値）・D-211（メッセージ）・D-212（権限）は読取のみ。
  write: "更新対象は D-207 のみ。D-208〜D-212 は更新しない"
  commit: "/edit・/delete は成功時のみコミット。例外時はロールバック（E-223）"
  verify: |
    読取 4 端点の E2E 前後で、D-207〜D-212 の件数と last_update_datetime が変わらないこと。
    失敗系 E2E-206 の後で、D-207 の件数と rev_no が巻き戻っていること。

# =============================================================================
# 【A/B 比较字段】greenfield のため **行わない**（規則 04 §7.1）
# =============================================================================
ab_comparison: null
ab_comparison_reason: |
  build_mode=greenfield。比較対象たる旧版が存在しないため、A/B 比較も健康度スコアも
  閾値も設けない（規則 04 §7.1）。「修正前後」という概念が無い案件に、
  閾値だけを後付けで作らない（規則 04 §7.1 の明文）。

# =============================================================================
# 【greenfield の代替：受入基準の充足判定】
# =============================================================================
acceptance_verification:
  source: 節点1 承認版 v1.0.0 §4 業務規則・§5 画面項目・§7 異常処理、節点2 承認版 v1.0.0（イベント 12 件）
  method: |
    各受入基準を、E2E で観測可能な事象（HTTP ステータス・errorCode／errorId・
    Session の有効／失効・遷移先画面・表示値・CSV の中身・DB の件数と rev_no）に
    対応づけて合否を判定する。**一致比較ではなく充足判定**である。
  record: tutorial/R60Maker/节点7_结合测试/verification.md（`summary.md` は使わない。A/B ではないため）
  coverage: |
    要求 §4 の業務規則を 1 対 1 で E2E に対応づける。対応づかない条は
    「本節点の対象外」と理由付きで列挙する（黙って落とさない）。

# =============================================================================
# 【节点6 から引き継ぐ残リスク】単体では観測できないもの
# =============================================================================
residual_risks:
  - risk: 二重送信の抑止は画面側の実装依存であり、単体では観測できない
    covered_at: E2E-206
  - risk: 排他（rev_no）の競合は 1 プロセスでは再現しない
    covered_at: E2E-206（2 セッションで /edit を同時に叩く）
  - risk: 稼働時間・Session 30 分の判定は時刻依存で、単体では固定できない
    covered_at: E2E-207
  - risk: 被参照チェック（D-208・D-209）の「削除済み参照元は数えない」は単体では作れない
    covered_at: 本節点で参照データを用意して確認する
  - risk: テスト実行基盤（バックエンドの起動・DB の往復・CSV の実ファイル）が未定義
    covered_at: 本節点で実行基盤を確定するか、工程04 へ戻す。**確定しないまま「実施済み」と書かない**

# =============================================================================
# 【人必须拍板的点】
# =============================================================================
human_review_required:
  - 端到端贯通（前端→API→DB→画面）で観測しているか。単層の検証を結合テストと呼ばない
  - API 序列が**順序**として書かれているか（一覧の平铺になっていないか）
  - 事務境界に意外な書き込みが無いこと（読取 4 端点は件数不変）
  - 期待値の出所が承認済み受入基準であるか（greenfield。旧版実測値を混ぜていないか）
  - テスト報告に敏感値が無いこと（占位のみ）
