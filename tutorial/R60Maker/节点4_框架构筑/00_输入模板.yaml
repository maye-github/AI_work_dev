# 【技术栈】
#   ★greenfield（本演習・本案件）: ここが選型の本体。各 proposal は当方の提案であり、
#     approved_by に人の識別子が入るまで確定にしない。
#     grounds は「どの設計事実を満たすための選型か」を書く。設計から導けない部分は
#     「一般論（E4）」と明記した（製品・ライブラリ品種そのものの選定）。
tech_stack:
  selection_mode: "greenfield（本節点が選型節点。以下は全て提案であり承認前は確定でない）"
  frontend:
    proposal: "Vue 3（Composition API + script setup）+ TypeScript + Vite + PrimeVue + Pinia"
    status: "提案（承認待ち）"
    grounds:
      - "I-333 はドロップダウン（10／20／50／100・既定 20）、I-328 は確認・エラーダイアログ、I-332 はチェックボックス、I-334 はトグルボタン、I-337／I-338 はページャリンク、I-340／I-342 はソート可能な見出し → 選択部品・入力部品・ボタン・ダイアログ・一覧・ページャを一式持つ UI 基盤が要る（05 §2.4・§3.1）。"
      - "E-219 は該当項目の背景色を変えてフォーカスを移す（05 §5）→ 項目単位のスタイル変更とフォーカス制御ができること。"
      - "接口層は camelCase、定義層は snake_case（05 §1・物理名は 05 §1 のとおり）、I-347／I-349 はコードではなく名称を表示（05 §3.1）→ 型で取り違えを防ぐ TypeScript を採る（strict 有効）。"
      - "L-221 の活性制御（権限・検索結果・行選択・モード・削除状態）と L-222 の遷移要求はクライアントが主体（05 §2.10・§2.11）→ 画面状態を保持する層が要る。"
      - "検索条件は画面が保持し、ページャ操作時に再検索する（05 §2.4 手順②）→ 画面内状態ストア（Pinia）を置く。"
      - "CSV 応答（L-218）はファイルとエラー JSON を区別して保存する（05 §2.7 手順⑤）→ Blob 応答を扱えること。"
      - "I-323 はサーバ時刻（JST・YYYY/MM/DD hh:mm:ss）を表示する（05 §3.1）→ 端末時刻を使わない表示制御。"
      - "共通部品 CommonHeader（会社名・部署名・ユーザー名を別項目で描画）と Pager（上部・下部の 2 か所）を呼び出す。画面側で再実装しない（共通部品仕様 §1.1・§3.1・§3.2）。"
      - "対応ブラウザは Edge 120 以上／Chrome 120 以上、最低解像度 1366×768、同時 50 セッション（NFR §2 #1〜#3・#8）→ ビルド対象を現行 Chromium 系に絞れ、旧ブラウザ向けポリフィルを持たなくてよい。"
      - "検索画面（SCR-201）とマスタ画面（SCR-202）の 2 画面で、遷移は確認ダイアログを伴う（05 §2.11）→ 画面遷移の方式（ルータかモーダルか）は設計から決まらない（一般論（E4））。品種（Vue／PrimeVue／Pinia）の選定自体も設計からは決まらない（一般論（E4））。"
    notes: |
      Pinia は検索条件の保持（05 §2.4）と活性制御（05 §2.10）の状態を 1 箇所に置くために採る。
      共通部品（CommonHeader・Pager・3 つのエラー画面）は顧客提供の共通 UI ライブラリ v3.0 を
      呼ぶ前提であり、取得方法・パッケージ名は未確定（open_questions Q-317）。
  backend:
    proposal: "Python 3.12 + FastAPI + Pydantic v2 + SQLAlchemy Core（text()。ORM マッピングは使わない）+ oracledb（Thin）"
    status: "提案（承認待ち）"
    grounds:
      - "SQL は明示的に手書きし、値はすべて :BIND の名前付きプレースホルダで受ける（05 §4.1〜§4.11）。列名・表名を利用者入力から組み立てず、動的ソートは白名单 {MAKER_CD, MAKER_NM} で担保する（05 §4.4・裁定 Q-314）→ ORM の自動生成に委ねない構成が要る。SQLAlchemy Core の text() は SQL 本文をそのまま保持し、バインドと接続プールだけを使う。"
      - "6 端点（/init・/search・/download・/initEdit・/delete・/edit）はすべて POST・JSON 応答で、HTTP ステータスはすべて 200、判定は本文の errorCode（0／1／9）と errorId（4 桁）を正とする（共通部品仕様 §9.1・05 §5）→ status と本文を明示制御できる HTTP 層が要る。"
      - "L-212 は 6 端点すべての前にセッション（30 分）・オンライン可否（平日 7:00–22:00 JST）・権限（MKR01〜MKR03）・入力チェックの順で検証し、1 つでも失敗したら後続を実行しない（05 §2.1・共通部品仕様 §10.1）→ 前処理を 1 箇所に集約できること。"
      - "権限は利用者 1 名 1 コード（MKR01／02／03。上位は下位を含む）で、端点別の可否表に従う（共通部品仕様 §4.1・§4.2・05 §2.1）→ 端点別の権限検証を宣言的に書けること。"
      - "ReferenceChecker.check（被参照・読み取り専用・冪等）と EmergencyDispatcher.dispatch（非同期・受付 ID を返して即復帰・業務トランザクションをロールバックしない）を呼ぶ（共通部品仕様 §5・§6）→ 外部の共通処理パッケージを差し込める構成が要る。"
      - "CSV は UTF-8（BOM あり）・CRLF・ヘッダ行あり・列は一覧 5 列で、排他情報を含めない（05 §2.7 手順④）→ 文字コードと改行を明示制御できること。"
      - "接口層は camelCase・定義層は snake_case で、未定義項目は拒否する（.claude/rules/03-design-coding.md §2・§4）→ 変換を 1 箇所に閉じ、余剰入力を弾ける（Pydantic v2）。"
      - "文字コードは UTF-8、日時は JST、表示形式は YYYY/MM/DD hh:mm:ss、端末時刻は使用しない（NFR §2 #17・共通部品仕様 §1.1・05 §3.1）→ 明示指定する。"
      - "一覧検索 3 秒以内（95 パーセンタイル・サーバ処理時間）・同時 50 セッション（NFR §2 #4・#8）→ 非同期 I/O で足りる規模。言語・フレームワークの選定自体は設計からは決まらない（一般論（E4））。"
    notes: |
      ORM のモデル定義は作らない（物理定義は 05 §1 の表・列が唯一真源であり、二重定義を避ける）。
      頁送りは OFFSET/FETCH を例外採用し、安定順序のため物理行識別子（ROWID 等）を末尾に付す
      （05 §4.4・裁定 Q-313）。物理方言はスタック承認後に確定する（open_questions Q-318）。
  database:
    proposal: "Oracle Database（参照・更新の 6 表。製品・版・エディションは顧客の運用標準に従う）"
    status: "提案（承認待ち。製品の当否・版・エディションは運用標準待ち）"
    grounds:
      - "05 §4.4・裁定 Q-313 は頁送りの安定順序に物理行識別子（例: ROWID）を付すと定める。ROWID は Oracle の物理行識別子であり、設計が想定する方言の傍証である（ただし 05 §0・§4 は『物理方言は工程04 で確定』と明記しており、確定値ではない）。"
      - "05 §4.1〜§4.11 の値はすべて :BIND の名前付きプレースホルダで受ける → Oracle のネイティブなバインド記法とそのまま一致する（? でも %s でもない。変換層を挟まない）。"
      - "05 §1 は型を論理型（文字列／数値／日時）で示し、物理型はスタック承認後に確定する → VARCHAR2(n CHAR)／NUMBER／DATE 等へ写す。製品固有の型名を設計へ書き戻さない。"
      - "05 §4.1〜§4.11 は 6 表（D-207〜D-212）への SELECT／INSERT／UPDATE、内部結合、一意制約（メーカーコードのみ）、ORDER BY del_flg, maker_cd の安定順序で足りる → 標準 SQL と OFFSET/FETCH で表現できる。"
      - "日付・時刻を SQL に埋め込まず、文字コードは UTF-8（05 §5・NFR §2 #17）。タイムゾーンは JST（共通部品仕様 §1.1）。"
      - "NFR §2 #4・#8（3 秒以内・同時 50 セッション）／参照中心の 6 表 → 小規模。版・エディション・バックアップ（日次フル・35 日／月次 12 か月）・監視・ライセンスは顧客の運用標準に従う（NFR §2 #16・未確定 → open_questions Q-318）。"
      - "製品（Oracle）・版・エディションの選定自体は設計からは導けない（一般論（E4）。顧客の運用標準が優先する）。"
    notes: |
      接続は oracledb の Thin モード（クライアント端末に Oracle Client を入れない）。
      接続情報（ユーザ・パスワード・ホスト・ポート・サービス名）は環境設定／シークレット管理から注入し、
      本ファイルには書かない（占位 TBL_1/COL_1@PWD_1:PORT_1/SID_1）。
      承認後に製品・版が変わる場合は、大小文字規約とドライバ依存が変わる＝設計変更（CR）である。
  auth:
    proposal: "社内認証基盤の SSO 連携（本画面群はパスワードを保持しない）+ 権限コード MKR01〜MKR03 を AUTH_TBL から取得"
    status: "提案（承認待ち）"
    grounds:
      - "NFR §2 #14: 認証は社内認証基盤による SSO。本画面群はパスワードを保持しない。"
      - "05 §2.1 手順③・§4.1: 権限コードを D-212（AUTH_TBL）から取得し、端点別の必要権限を満たすか判定する。権限は利用者 1 名 1 コード（上位は下位を含む）。"
      - "共通部品仕様 §4.1: 画面はログイン時に受領した権限コードでボタン活性を制御するが、最終的な可否は API 側で決める。画面の活性制御は API の検証を代替しない。"
      - "05 §2.1 手順①・NFR §2 #12: セッションは最終操作から 30 分。超過時は SessionErrorScreen へ置換する。"
      - "SSO の連携方式・使用ライブラリ・トークン／セッションの受け渡しは顧客の共通基盤の仕様であり、設計からは決まらない（一般論（E4）。open_questions Q-319）。"
    notes: |
      本画面はパスワード入力を持たない。認証は共通基盤に委ね、本画面は受領した権限コードとセッションで動く。
      権限マスタ（AUTH_TBL）の初期データ投入は運用側の責務であり、本節点では決めない。
  storage:
    proposal: "ログ保存基盤（追記専用・改ざん防止。アクセスログ 1 年／操作ログ 3 年／監査ログ 5 年）+ CSV はクライアント保存（サーバに永続化しない）"
    status: "提案（承認待ち）"
    grounds:
      - "NFR §2 #15: アクセスログ 1 年・操作ログ 3 年・監査ログ 5 年。追記専用とし、改ざんを防止する。"
      - "NFR §3: ログの出力は共通ログ部品が行い、各画面は個別のログファイルを持たない。"
      - "05 §5: 敏感値（接続情報・鍵・実データ）は操作ログに出さない。遮蔽は共通ログ部品に委ね、本画面は独自に出力しない。"
      - "05 §2.7 手順⑤・NFR §2 #7: CSV はダウンロード応答として返し、クライアントが保存する。サーバ側にファイルを永続化しない（上限 500 件・5MB・10 秒以内）。"
      - "ログ保存基盤の製品・提供元・マスキング方法は顧客の運用標準／共通ログ部品の仕様に依存する（一般論（E4）。open_questions Q-320）。"
    notes: |
      バケット名・保存先 URL・テナント名は社内の別管理であり、本ファイルには書かない（占位 BUCKET_1／DOM_1）。
  infra:
    proposal: "コンテナ実行基盤 + TLS 終端のリバースプロキシ + dev/stg/prod の 3 環境 + ログ収集基盤（送出は共通ログ部品経由）"
    status: "提案（承認待ち）"
    grounds:
      - "NFR §2 #13: 通信は TLS 1.2 以上（社内 LAN・社内 VPN とも必須）→ TLS 終端をリバースプロキシに置く。"
      - "NFR §2 #9〜#11: 稼働率 99.5% 以上（平日 7:00–22:00）・計画停止は月間 4 時間以内・RTO 4 時間／RPO 24 時間（日次バックアップ）→ 単一リージョン・小規模構成で足りる（一般論（E4））。"
      - "NFR §2 #2・#3: 最低解像度 1366×768・端末 OS は Windows 11（社内標準端末）→ 配布・表示の前提を満たす。"
      - "05 §2.1 手順②・NFR §1: オンライン稼働は平日 7:00–22:00 JST（計画停止を含む）→ サーバのタイムゾーンを Asia/Tokyo に固定する。"
      - "05 §2.1 手順①・NFR §2 #12: セッションは最終操作から 30 分 → サーバ側 Session の保持先（プロセスメモリか外部ストアか）が必要。保持先の実体は冗長化構成に依存する（open_questions Q-321）。"
      - "共通部品仕様 §1.1: 共通部品は共通 UI ライブラリ（TypeScript）と共通処理パッケージ（Python）の v3.0 で提供される → 配備時に共通部品の取得経路が要る（open_questions Q-317）。"
      - "製品・ホスティング・冗長化の選定自体は設計からは導けない（一般論（E4）。顧客の運用標準に従う）。"
    notes: |
      ホスト名・接続先・バケット名・テナント名は社内の別管理であり、本ファイルには書かない（占位のみ）。
      証跡の保存先・監視の閾値も本節点では決めない（顧客の運用標準に従う）。
  approved_by: ""

# 【需要的环境】（用途のみ。実ホスト名・実 URL・案件番号は書かない）
env_list:
  - env: dev
    purpose: 開発・単体テスト。API は http 許容（本番以外のローカル検証に限る）。マスタはテストデータ（実データは使わない）。ログはローカル標準出力のみ。
  - env: stg
    purpose: 結合総合テスト・受入前確認。本番同等構成（TLS・JST・リバースプロキシ）。共通部品（共通 UI ライブラリ・共通処理パッケージ v3.0）と社内認証基盤 SSO、共通ログ部品への接続を検証する。マスタはテストデータ。
  - env: prod
    purpose: 本番。稼働率 99.5% 以上（平日 7:00–22:00）。ログはアクセス 1 年／操作 3 年／監査 5 年（NFR §2 #15）。実アドレス・実ホスト名は社内の別管理であり、本ファイルには書かない（占位 IP_1 等）。
  - env: all
    purpose: 3 環境共通。文字コード UTF-8、サーバのタイムゾーンは Asia/Tokyo（NFR §2 #17・共通部品仕様 §1.1）。環境ごとの値は環境変数／シークレット管理から注入し、コード・リポジトリに持たない。

