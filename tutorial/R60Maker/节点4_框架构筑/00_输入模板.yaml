# 【构建/启动配置】
build_settings:
  install: |
    frontend: npm ci
    backend : py -3 -m pip install -r requirements.txt
              （CI は python -m pip install -r requirements.txt。規則 00 §9 のコマンド表記差）
  build: |
    frontend: npm run build（= vue-tsc --noEmit && vite build）
    backend : なし（Python はビルドを持たない。構文検査として py -3 -m compileall -q app）
  start: |
    dev : py -3 -m uvicorn app.main:app --reload --port 8000（バインド先は uvicorn の既定＝ループバック。実 IP は書かない）
    prod: uvicorn をリバースプロキシ配下で起動（TLS 終端はプロキシ）。
          サーバのタイムゾーンは Asia/Tokyo（共通部品仕様 §1.1）。値は起動時に環境変数／シークレット管理から注入。
  required_settings: |
    値は書かない。必要な設定キーだけを列挙する（工程05 の実装時に名前を確定する）。
    - DB 接続情報（ユーザ・パスワード・ホスト・ポート・サービス名。占位 TBL_1/COL_1@PWD_1:PORT_1/SID_1）
    - サーバのタイムゾーン（Asia/Tokyo）と表示形式（YYYY/MM/DD hh:mm:ss）
    - オンライン稼働時間（平日 7:00–22:00 JST）と計画停止の有無
    - セッションの idle 失効秒数（30 分）
    - 検索上限 500 件・1 頁件数の候補 10／20／50／100・既定 20
    - CSV 出力の文字コード（UTF-8 BOM あり）・改行（CRLF）・ヘッダ有無
    - 緊急配信の業務 ID（R60Maker。共通部品仕様 §6.2）
    - 共通部品（共通 UI ライブラリ・共通処理パッケージ v3.0）の取得先・参照名
    - 社内認証基盤 SSO の接続先・参照名
    - 共通ログ部品の送出先・マスキング設定の参照名
    - シークレット参照名（DB 接続情報。実値・実パスは持たない）
  notes: |
    起動は冪等でなければならない（規則 03 §7.1）。起動時に現在時刻・乱数・UUID を設定値へ埋め込まない。
    CSV の上限（500 件・5MB・10 秒。NFR §2 #7）と排他（last_update_datetime と rev_no。05 §1）は
    実装で必ず守る。

# 【CI/CD 流水线要点】
cicd:
  gates:
    - "py -3 -m tools.trace_check --strict（必須。--skip による門隙突破を禁止）。門番は 6 道のまま（stats.gates_run = 6）"
    - "CI（ubuntu-latest）では python -m tools.trace_check --strict。ローカル（Windows）の py -3 と表記が違うだけで、同じ検査である（規則 00 §9）"
    - "機密走査は strict に含まれる（gate6）。単独実行は py -3 -m tools.trace_check --strict --only-check secrets。1 件でもヒットしたら commit 禁止"
    - "先例参照: py -3 -m tools.kb_refs check <承認版> --node 4（R60Maker は kb_refs_exempt.txt の免除対象ではない。case.yml 明記）"
    - "単体テスト全緑: pytest（server）+ vitest run（client）。テスト 0 件を緑と読まない（未整備を合格にしない）"
    - "型検査: vue-tsc --noEmit（ビルドより前に失敗させる）"
    - "ビルド: npm run build が零 error（構築ゲート相当。本骨架の門番ではない＝規則 04 §9.1 の G2）"
    - "依存の固定: npm ci と pip の固定バージョンで導入し、lockfile の差分をレビュー対象にする"
    - "承認前でもゲートを緩めない。ローカルで通したことを理由に CI 側を外さない（紅線⑥）"
  notes: |
    本骨架が持つ品質ゲートは G1（静的検査）相当のみであり、G2〜G5（構築・Console・スモーク・画像対比）は
    未実装である（.claude/rules/04-testing.md §9.1）。上表のビルド／型検査は案件側 CI へ接続する前提の草案であり、
    本骨架の門番（6 道）を増減させるものではない。
    移行思路: ローカル門番（trace_check strict・pytest・vitest・vue-tsc）をそのまま CI 常設門番へ写し、
    人手の commit 前チェックを CI の必須ジョブにする。--skip は CI でもローカルでも禁止（紅線⑥）。

# 【密钥/敏感值处理（只写方式，不写值）】
secrets_handling:
  method: |
    方式のみを書く。実値・実パス・接続文字列は本ファイルにもリポジトリにも置かない。
    - 実行時取得: 環境変数（コンテナの secret 注入）又はシークレット管理サービスから起動時に読む。
      設定はコードから分離し、DI で渡す。
    - DB 接続情報: 取得方式＝シークレット管理サービス（種別）から起動時に取得し、接続プールへ渡す。
      ユーザ・パスワード・ホスト・ポート・サービス名の実値は書かない（占位 TBL_1/COL_1@PWD_1:PORT_1/SID_1）。
    - SSO 連携: 認証情報（トークン・セッション）は共通基盤から受け取り、ログ・応答・ファイルへ出さない。
    - ログに出さない: DB 接続情報・セッション識別子・利用者識別子の実値・業務データ実値（NFR §3・05 §5）。
      遮蔽は共通ログ部品に委ね、本画面は独自に出力しない。
    - リポジトリに置かない: .env・鍵ファイル・接続文字列（.gitignore 済みの経路を使う）。
    - 未確定: シークレット管理基盤の有無・接続方式は顧客の運用標準に依存する（open_questions Q-322）。
  placeholders: "IP_1 / PORT_1 / PWD_1 / TBL_1 / SID_1 / BUCKET_1 / DOM_1 / KEY_1（規則 01 §1 の占位。実値は書かない）"

# 【约束】
constraints:
  - "greenfield（本演習・本案件）: 採用スタックは人が承認して初めて確定する（紅線④）。承認前は「提案」と書き、確定として扱わない。approved_by が空のまま次工程へ進まない（紅線③）"
  - "承認後のスタックは紅線④の対象である。置換・変更には人の承認（変更環 CR）を要する"
  - "本ファイルは節点3 承認版を入力とし、上流の設計値を変更しない（L／D／E／SQL／境界値。05 §1〜§7）"
  - "環境値・機密をファイルに記載しない。実ホスト名・実 URL・接続文字列・バケット名・テナント名・利用者識別子は占位のみ（規則 01 §1）"
  - "DB 製品依存の大小文字規約はスタック承認後に反映する（05 §1）。Oracle などの製品が非引用の識別子を大文字へ折畳む場合、物理名は大文字で作成し、アプリからの参照も大文字で統一する。名前の実体（MKR_TBL 等）は Q-308b の裁定（*_TBL）を維持する"
  - "SQL は明示し、値はすべて :BIND のバインド変数で受ける。列名・表名を利用者入力から組み立てない。ソート白名单は {MAKER_CD, MAKER_NM} の 2 項目、それ以外は固定ソート ORDER BY del_flg, maker_cd へフォールバックする（05 §4.4・裁定 Q-314）"
  - "頁送りは OFFSET/FETCH を例外採用し、安定順序のため物理行識別子（ROWID 等）を末尾に付す（05 §4.4・裁定 Q-313）。物理方言はスタック承認後に確定する"
  - "セッションは最終操作から 30 分。超過時は SessionErrorScreen へ置換する（NFR §2 #12・05 §2.1 ①）"
  - "オンライン稼働は平日 7:00–22:00 JST。時間外・計画停止は OnlineControlErrorScreen へ置換する（NFR §1・05 §2.1 ②）"
  - "権限は MKR01／MKR02／MKR03。上位は下位を含み、端点別の可否表に従う。権限不足は業務エラー（errorCode=1／errorId=2004）で画面遷移しない（共通部品仕様 §4.2・§10.2）"
  - "HTTP ステータスはすべて 200。判定は本文の errorCode（0=正常／1=業務エラー／9=システムエラー）と errorId（4 桁）を正とする。errorCode に 2 は使わない（共通部品仕様 §9.1・05 §5）"
  - "errorCode=9 はエラー画面へ置換、errorCode=1 はメッセージ表示のみで画面遷移しない（05 §5・共通部品仕様 §10.2）"
  - "共通部品（CommonHeader・Pager・SessionErrorScreen・OnlineControlErrorScreen・SystemErrorScreen・ReferenceChecker・EmergencyDispatcher）は呼び出すものであり、画面側で同等機能を再実装しない（共通部品仕様 §1.1）"
  - "CSV は UTF-8（BOM あり）・CRLF・ヘッダ行あり・一覧 5 列。上限 500 件・5MB・10 秒を超える場合は出力しない（05 §2.7・NFR §2 #7）"
  - "緊急配信は業務データのコミット確定後に非同期で起動し、呼出元の業務トランザクションをロールバックしない。配信失敗時は送信状態 9 へ更新する（共通部品仕様 §6.4）"
  - "被参照チェックは読み取り専用・冪等。想定外は E-218（errorCode=9／errorId=9101）で処理を中断し、参照件数を 0 として扱わない（共通部品仕様 §5.5・05 §2.8）"
  - "ログは共通ログ部品が出力し、各画面は個別ファイルを持たない。保持はアクセス 1 年／操作 3 年／監査 5 年（NFR §2 #15・§3）"
  - "NFR の測定条件は社内 LAN・キャッシュなし・同時 50 セッション。一覧検索 3 秒以内（95 パーセンタイル・サーバ処理時間）・可用性 99.5%・RTO 4 時間／RPO 24 時間（NFR §2 #4・#9〜#11）"
  - "生成・再実行は冪等であること。現在時刻・乱数・UUID・順序不定の反復を出力へ埋め込まない（規則 03 §7.1）"
  - "顧客の共通基盤（共通部品 v3.0・SSO・ログ基盤・運用標準）の仕様は顧客しか持たない事実であり、当方で決めない（open_questions）"

# 【设计移交事项】—— 節点3 承認版が「工程04 で確定」とした事項＋顧客交付資料が工程04 に委ねる事項
design_handover:
  - ref: HO-01
    subject: 物理方言と頁送り（OFFSET/FETCH・物理行識別子）の確定
    source: "05 §0（技術スタックは本節点で固定しない）／§4 冒頭（物理方言・頁送りの実装は工程04 のスタック承認後に確定）／§4.4・裁定 Q-313"
    proposal: |
      - 頁送りは OFFSET :offset ROWS FETCH NEXT :page_size ROWS ONLY を採用する（05 §4.4）。
      - 安定順序のため、末尾に物理行識別子を付す。Oracle 採用時は ROWID（05 §4.4 の例示）。
        他製品採用時は同等の一意識別子。
      - ORDER BY del_flg, maker_cd, <物理行識別子>。白名单指定時も第 1 キーは del_flg を維持する。
    grounds:
      - "05 §4.4: 任意頁への直接移動（頁番号 1 始まり）のため OFFSET/FETCH を例外採用し、安定順序のため末尾に物理行識別子（例: ROWID）を付す。"
      - "裁定 Q-313（Li・2026-11-06）: OFFSET/FETCH を例外採用する（ROWID による安定ソートを併用）。工程04 のスタック承認後に方言を確定する。"
    status: "提案（承認待ち）"
    open_question_ref: Q-318
    notes: |
      方言（OFFSET/FETCH の対応可否・物理行識別子の名称）は DB 製品で決まる。製品は Q-318 で確定する。
  - ref: HO-02
    subject: 顧客共通部品 v3.0 の提供形態・取得方法・版固定
    source: "共通部品インタフェース仕様書 v3.0 §1.1（共通 UI ライブラリ TypeScript と共通処理パッケージ Python の v3.0）／05 §0（技術スタックは工程04）"
    proposal: |
      - 共通 UI ライブラリ（TypeScript）: CommonHeader・Pager・SessionErrorScreen・
        OnlineControlErrorScreen・SystemErrorScreen を import して呼ぶ。画面側で再実装しない。
      - 共通処理パッケージ（Python）: ReferenceChecker.check・EmergencyDispatcher.dispatch を import して呼ぶ。
      - 取得方法（社内レジストリ／ベンダ配布／ソース同梱）とパッケージ名・版固定方法は未確定。
    grounds:
      - "共通部品仕様 §1.1: 各画面は本書の部品を呼び出すものとし、同等機能を画面側で再実装しない。提供形態は共通 UI ライブラリ（TypeScript）および共通処理パッケージ（Python）の v3.0。"
      - "05 §3.1 の I-322〜I-326 は CommonHeader、I-337／I-338 は Pager が担う（共通部品仕様 §3.1・§3.2）。"
      - "05 §2.8 ③〜④ は ReferenceChecker.check、§2.8 ⑦・§2.9 ⑨ は EmergencyDispatcher.dispatch を呼ぶ（共通部品仕様 §5・§6）。"
    status: "提案（承認待ち）"
    open_question_ref: Q-317
  - ref: HO-03
    subject: 社内認証基盤 SSO の連携方式と権限コードの受領
    source: "NFR 標準 v1.1 §2 #14（社内認証基盤による SSO・パスワード非保持）／05 §2.1 ③（権限コードの取得）／共通部品仕様 §4.1"
    proposal: |
      - 認証は共通基盤の SSO に委ね、本画面はパスワードを保持・入力しない。
      - ログイン成立後、利用者識別子と権限コード（MKR01〜MKR03）を受領する。
      - セッションは最終操作から 30 分。識別子の受け渡し（Cookie／ヘッダ）は共通基盤の仕様に従う。
    grounds:
      - "NFR §2 #14: 認証は社内認証基盤による SSO。本画面群はパスワードを保持しない。"
      - "05 §2.1 ③・§4.1: 権限コードを AUTH_TBL から取得し、端点別の必要権限を満たすか判定する。"
      - "NFR §2 #12: セッションは最終操作から 30 分。"
    status: "提案（承認待ち）"
    open_question_ref: Q-319
  - ref: HO-04
    subject: 共通ログ部品の提供元・送出経路・マスキング・保持
    source: "NFR 標準 v1.1 §2 #15（保持期間）・§3（共通ログ部品が出力し、各画面は個別ファイルを持たない）／05 §5（敏感値は操作ログに出さない）"
    proposal: |
      - アプリは共通ログ部品を呼び、独自のログファイルを持たない。
      - マスキングは共通ログ部品に委ね、本画面は利用者識別子・業務データ実値を出力しない。
      - 保持はアクセス 1 年／操作 3 年／監査 5 年（追記専用・改ざん防止）。
    grounds:
      - "NFR §3: ログの出力は共通ログ部品が行い、各画面は個別のログファイルを持たない。"
      - "NFR §2 #15: アクセスログ 1 年・操作ログ 3 年・監査ログ 5 年。追記専用・改ざん防止。"
      - "05 §5: 敏感値（接続情報・鍵・実データ）は操作ログに出さない。遮蔽は共通ログ部品に委ねる。"
    status: "提案（承認待ち）"
    open_question_ref: Q-320

# 【未决事项】—— 当方で決められない（顧客の事実・運用標準に依存する）もの。
#   answer / answered_by は人が埋める欄である。AI は値を入れない（紅線③）。
#   番号は Q-317 以降（Q-239〜Q-305 は節点1、Q-306〜Q-309 は節点2、Q-310〜Q-316 は節点3 が使用済み）。
