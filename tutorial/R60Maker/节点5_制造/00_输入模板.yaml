      totalCount（I-339）／pager（頁番号・総頁数・1 頁件数）／messageInfo
      0 件は E-213（errorCode=1・errorId=1001・MSG-E-001）を返しつつ**検索成功として扱う**
      500 件ちょうどは可、501 件以上は E-214（1／1002・MSG-E-002）で明細を返さない（L-214 手順⑥⑦）
    http: "200 固定"
    logic_ids: [L-212, L-214, L-215]
    sql_ids: [SQL-4.3, SQL-4.4, SQL-4.11]
    notes: "空白入力チェック違反は E-219（画面側・サーバへ送らない）、サーバ側違反は E-224（L-214 例外）。失敗時に一覧・総件数を更新しない"
