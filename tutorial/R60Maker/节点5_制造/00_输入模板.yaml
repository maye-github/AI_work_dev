# 【提交约束】
commit_rules:
  branch: "feature/D-207-R60Maker（演習は実 commit を行わず、様式のみ記録する）"
  commit_types_used: [feat, test, fix]
  format: "7 種様式（req / design / feat / test / fix / rel / chore）のいずれか 1 つで始め、本文に Trace / AI / Review の三段、末尾に Co-Authored-By 行を置く（`.claude/rules/05-commit-messages.md` §2・§3・§5）"
  trace_line: |
    1 コミット = 1 生成単位。Trace は F-202 → その単位が使う D-ID → L-ID。
      /init        : Trace:F-202->D-211,D-212->L-212,L-213
      /search      : Trace:F-202->D-207,D-210->L-212,L-214,L-215
      /download    : Trace:F-202->D-207->L-212,L-218
      /initEdit    : Trace:F-202->D-207->L-212,L-217
      /delete      : Trace:F-202->D-207,D-208,D-209->L-212,L-219
      /edit        : Trace:F-202->D-207,D-208,D-209->L-212,L-220
      画面・遷移・活性 : Trace:F-202->D-207->L-216,L-221,L-222
    D-207〜D-212 は read／write の対象であり、単独のコミット単位を作らない。
  ai_line: "AI: trans-cosmos-ai-node5-coding@v0.1（演習。`code-from-design-trans-cosmos-ai` は R-101 専用・ids.yml 事前登録必須のため使わない）"
  review_line: "Review: <人の拍板者識別子>（**AI を書かない**。人の拍板が無いうちはコミットしない＝紅線③。本案件の拍板者は Li）"
  attribution: "Co-Authored-By: Claude Code <noreply@anthropic.com>"
  gate_before_commit: "`py -3 -m tools.trace_check --strict` が Exit 0。**`--skip` による門隙突破を禁止**（禁④・紅線⑥）"
  notes: |
    種別の使い分け: 源コードは `feat`、単体テストコードは `test`、レビュー指摘の是正は `fix`。
    `design`（設計の確定）は本節点では使わない（設計は節点3 で確定済み）。

