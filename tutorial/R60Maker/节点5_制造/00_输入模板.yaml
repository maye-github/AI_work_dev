# 【编码规范】
#   ★greenfield（本演習）: 参照すべき既存コードが無い。したがって「規範」は
#     ① 工程04 で承認された採用スタックの慣用、② 本節点で新規定義した共通部品、の 2 つになる。
#     「既存の◯◯ファミリーに合わせる」という種類の指示は**出せない**（比較対象が存在しない）。
coding_standards:
  - "greenfield: 工程04 承認済みスタックの慣用に従う — Vue 3（Composition API ＋ `<script setup>`）＋ TypeScript（`strict`）＋ Vite ＋ PrimeVue ＋ Pinia（工程04 §1.1）"
  - "greenfield: サーバは Python 3.12 ＋ FastAPI ＋ Pydantic v2 ＋ SQLAlchemy Core（`text()`。**ORM マッピングは作らない**）＋ oracledb（Thin）（工程04 §1.2）"
  - "greenfield: 共通部品は**本案件で新規定義**する。既存部品の存在を前提にしない。**定義後はその新定義が唯一真源**となり、以後みだりに変えない（工程04 §1.1・§1.2）"
  - "greenfield: 顧客提供の共通部品 v3.0（CommonHeader・Pager・各種 ErrorScreen・ReferenceChecker・EmergencyDispatcher・共通ログ）は**呼ぶだけ**で、同等機能を画面／サーバ側で再実装しない（工程04 §0 末尾・§1.2）"
  - "greenfield: `BaseCamelModel` は本案件で新規定義し、`model_config` の 4 行（`alias_generator` / `populate_by_name` / `serialize_by_alias` / `extra`）を固定する。**派生モデルで `model_config` を再定義しない**（`.claude/rules/03-design-coding.md` §2・工程04 §1.2）"
  - "命名は 3 層で分離する — 画面・接口（TS）は camelCase（`makerCd`／`makerNm`）、定義層・Python は snake_case（`maker_cd`／`maker_nm`）、DB 物理名は UPPER（`MAKER_CD`／`MAKER_NM`）。**変換点は `BaseCamelModel` の 1 箇所だけ**。手書き変換を散在させない（規則 03 §4・工程04 §1.2）"
  - "SQL は設計 §4 の本文をそのまま保持し、値は必ず `:name` の名前付きバインドで受け、**f-string 等で値を連結しない**。列名・表名を利用者入力から組み立てない。発行するのは設計にある SELECT／INSERT／UPDATE のみで、**DELETE 文は作らない**（論理削除 `del_flg` を用いる。05 §1.1・§4）"
  - "動的ソートは白名单 `ALLOWED_SORT_FIELDS = {MAKER_CD, MAKER_NM}` のみ（05 §4.4）。白名单外・未指定は固定ソート `ORDER BY del_flg, maker_cd, ROWID` へフォールバックし、白名单指定時も第 1 キーは `del_flg`（未削除を先）を維持する。白名单の追加は設計変更（CR）"
  - "頁送りは任意頁への直接移動のため `OFFSET/FETCH` を例外採用し、安定順序のため末尾に物理行識別子（`ROWID`）を付す（05 §4.4）。物理方言・物理行識別子の名称は Q-326 の裁定まで確定しない"
  - "文字コードは UTF-8、タイムゾーンは Asia/Tokyo（JST）。日時を SQL に埋め込まず、**日付・時刻の実値をリテラルで書かない**（05 §5）。表示形式は YYYY/MM/DD hh:mm:ss（I-323）"
  - "冪等性: 現在時刻・乱数・UUID・順序不定の反復を出力へ埋め込まない。`rev_no` はサーバが採番（登録時 1・更新時 +1）、`last_update_datetime` は引数（サーバ時刻）として注入しテストで固定できるようにする（規則 03 §7.1・05 §1.1）"
  - "1 画面 1 生成・端点 6 本を単位に分割して生成する（規則 03 §7.4）。一括で全層を生成しない"
  - "エラー応答は `errorCode`（0=正常／1=業務エラー／9=システムエラー。**2 を使わない**）と `errorId`（4 桁。正常時 0000）を正とする。HTTP ステータスはすべて 200（05 §5）"
  - "複雑判定に該当する製造物は設計者以外が diff を読む（状態遷移・外部連携・複数表更新を伴う L-212／L-219／L-220 が該当。規則 03 §7.2）"
  - "ログは共通ログ部品へ委ね、本画面は独自のログファイルを持たない。敏感値（接続情報・鍵・実データ）をログに出さない（05 §5・工程04 §1.5）"

# 【接口签名（照设计写，不自行增改）】
#   端点パスは 05 §2.2〜§2.9 の転記。要求／応答の外側形状は `{params:{...}}` の 1 階層・camelCase（05 §0）。
#   項目の英語名は設計に明文が無いため、項目名称・物理列名から当方が導出した（Q-330）。
interfaces:
  - name: "POST /init"
    side: server
    params: |
      {params:{}}
      利用者入力を用いない（L-213 に要求項目の定義が無い）。
      外側形状 `{params:{...}}` は設計 §0 の共通方針に従うが、L-213 は params を参照しない。
    returns: |
      errorCode（0／1／9）／errorId（4 桁・正常時 0000）
      serverTime（I-323・JST・YYYY/MM/DD hh:mm:ss）
      companyNm（I-324）／deptNm（I-325）／userName（I-326）
