# 【验收条件】
acceptance:
  - "`py -3 -m tools.trace_check --strict` → Exit 0（`chain_complete=true`・`orphan_ids=[]`）。`--skip` は禁止（禁④）"
  - "`py -3 -m tools.trace_check --strict --only-check secrets` → ヒット 0（禁⑤）"
  - "実装が L-212〜L-222／D-207〜D-212／E-213〜E-224／I-322〜I-354／SQL 4.1〜4.11 に**一一対応**し、設計に無い処理・項目・端点・分岐を足していない（無多無少）"
  - "`BaseCamelModel` は `model_config` 4 行固定で**新規定義**され、派生モデルで再定義されていない。接口は camelCase・定義層は snake_case（gate5）"
  - "SQL は設計 §4 の SELECT／INSERT／UPDATE のみ。`:name` バインドのみで、f-string などによる値の連結が無く、列名・表名を入力から組み立てていない（05 §4）"
  - "ソートは白名单 {MAKER_CD, MAKER_NM} 経由、白名单外・未指定は `ORDER BY del_flg, maker_cd, ROWID` へフォールバックし、白名单指定時も第 1 キーは `del_flg`"
  - "エラー応答は `errorCode` 0／1／9（2 を使わない）と `errorId` 4 桁（正常時 0000）で、HTTP ステータスはすべて 200（05 §5）"
  - "`rev_no` はサーバ採番・`last_update_datetime` は引数注入であり、同一入力＋同一時刻から同一出力になる（現在時刻・乱数・UUID を埋め込んでいない。規則 03 §7.1）"
  - "境界値（05 §6）を満たす：メーカーコード 1〜5 の半角英数字・日本語名 UTF-8 30Byte・カナ 15 文字・頁件数 10/20/50/100・件数 0 件は正常／500 件ちょうど可／501 件以上は E-214"
  - "生成物は `tutorial/R60Maker/节点5_制造/` の下のみ。`src/`・`app/routers` の生産コードに触れていない"
  - "敏感値は占位のみ（`PWD_1` / `IP_1` / `PORT_1` / `TBL_1` / `SID_1`）。実値・実接続情報・実在データが無い"

