# 【测试观点（同值分割 / 境界值 / 决策表 の 3 技法 × 正常/境界/异常）】
# 比率の下限は 正常 3／境界 2／異常 3（規則 04 §2）。本件の E は 12 件あるため異常系は 12 件を下限とする。
test_viewpoints:
  # 技法① 同値分割 — 有効クラス／無効クラスを分け、有効クラスごとに 1 件以上
  equivalence_partitioning:
    - メーカーコード（I-329／マスタ画面）: 有効＝半角英数字 1〜5／無効＝空欄・6 桁以上・全角・記号（E-219／E-224）
    - メーカー日本語名（I-330／マスタ画面）: 有効＝使用不可文字を含まない 0〜30Byte／無効＝31Byte 以上・カンマ・アポストロフィ・ダブルクォート・パイプ
    - メーカーカナ名（マスタ画面）: 有効＝半角カナ 0〜15／無効＝16 文字以上・アポストロフィ・カンマ・円マーク・半角スペース
    - 1 頁件数（I-333）: 有効＝10／20／50／100／無効＝それ以外（既定 20）
    - 検索条件（I-329・I-330・I-332・I-334）: 有効＝指定／未指定の各クラス（空条件は AND から除外）
    - mode（L-217）: 有効＝"1"（新規）／"2"（複製）／"3"（修正）／無効＝それ以外（E-224）
  # 技法② 境界値 — 「ちょうど」を突く。±1 の外側は異常系へ寄せる
  boundary_value:
    - メーカーコード: 1 桁ちょうど（最小可）・5 桁ちょうど（最大可）。6 桁は E-219／E-224 側
    - メーカー日本語名: UTF-8 30Byte ちょうど可。31Byte は不可（異常系）
    - メーカーカナ名: 半角カナ 15 文字ちょうど可。16 文字は不可（異常系）
    - 1 頁件数: 10（最小）・100（最大）ちょうど可
    - 検索結果件数: 0 件（E-213 を表示しつつ検索成功）・500 件ちょうど（許容）。501 件は E-214
    - 頁番号（I-337／I-338）: 1 始まり。総件数 0 件で非活性
  # 技法③ デシジョンテーブル — 条件×動作を網羅し、等価な組合せは縮約しつつ全動作を 1 回以上覆う
  decision_table:
    - 権限（MKR01／MKR02／MKR03）× 端点（6 本）: 設計で明文の /download=MKR03 のみ・/delete=MKR03 のみ・/edit=MKR02 以上を網羅。上位は下位を含む。※/init・/search・/initEdit の下限は設計 §2.1 に明文が無い（Q-334）
    - 削除: 被参照（有／無）× 排他（一致／不一致）× 被参照結果（正常／想定外）→ E-216／E-217／E-218／正常
    - 登録更新: mode（新規／複製／修正）× 削除オン／オフ × 排他（一致／不一致／null）
    - 活性制御（L-221）: 検索成功（有／無）× 行選択（有／無）× 権限（3 種）→ I-350／I-351／I-353／I-354 の活性

